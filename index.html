/* 병 폭·가운데 긴 병 길이를 화면에 반영 */
function applyBottleSize(bw, tall, badgeH, H) {
  stageEl.style.setProperty('--bw', bw.toFixed(2) + 'px');
  if (!tall) { stageEl.style.removeProperty('--tall-slot'); return; }
  var sideH = Math.max(colLeft.getBoundingClientRect().height, colRight.getBoundingClientRect().height);
  var tallB = null;
  game.bottles.forEach(function (b) { if (b.tall) tallB = b; });
  var cap = tallB ? tallB.cap : 8;
  var slot = (sideH - badgeH - bw * 0.42) / cap;
  /* 무대 높이를 넘지 않게 한 번 더 제한 (가로 모드처럼 세로가 아주 좁은 화면) */
  var maxSlot = H ? (H - badgeH - bw * 0.66) / cap : 1e9;
  slot = Math.min(maxSlot, Math.max(bw * 0.42, Math.min(bw * 1.20, slot)));
  stageEl.style.setProperty('--tall-slot', slot.toFixed(2) + 'px');
}

/* 지금 그려진 선반들이 실제로 차지하는 세로 길이 (실측) */
function columnHeight() {
  return Math.max(
    colLeft.getBoundingClientRect().height,
    colRight.getBoundingClientRect().height,
    colCenter.getBoundingClientRect().height
  );
}

function fitStage(force) {
  if (!appEl || !barEl) return;

  /* 1) 화면에서 실제로 쓸 수 있는 높이를 구해 무대 높이를 px 로 못 박는다 (넘침 원천 차단) */
  var metrics = stageMetrics();
  var avail = metrics.avail;
  stageEl.style.flex = '0 0 auto';
  stageEl.style.height = avail.toFixed(1) + 'px';
  stageEl.style.maxHeight = avail.toFixed(1) + 'px';
  stageEl.style.setProperty('--stage-h', avail.toFixed(1) + 'px');

  var W = stageEl.clientWidth, H = stageEl.clientHeight;
  if (!W || !H) return;

  var tall = !!(game.cfg && game.cfg.tall);
  var normals = 0;
  game.bottles.forEach(function (b) { if (!b.tall) normals++; });
  if (!normals) return;
  var nL = Math.ceil(normals / 2);
  var badgeEl = stageEl.querySelector('.goal-badge');
  var badgeH = badgeEl ? badgeEl.offsetHeight + 8 : (tall ? 24 : 0);

  var plan = planTiers(nL, W, H, tall, badgeH);
  stageEl.style.setProperty('--rowgap', plan.rowGap.toFixed(1) + 'px');

  /* 계획한 단 수가 지금 선반과 다르면 다시 그린다 */
  var curTiers = colLeft.querySelectorAll('.shelf').length || 2;
  if (force || plan.tiers !== curTiers) {
    game.tiers = plan.tiers;
    clearSelected();                 // 요소를 새로 그리므로 선택 표시도 초기화
    buildLayout();
    renderAll(false);
    updateHud();
    badgeEl = stageEl.querySelector('.goal-badge');
    badgeH = badgeEl ? badgeEl.offsetHeight + 8 : (tall ? 24 : 0);
    plan = planTiers(nL, W, H, tall, badgeH);
    stageEl.style.setProperty('--rowgap', plan.rowGap.toFixed(1) + 'px');
  }

  /* 2) 계산값을 적용한 뒤, 실제 그려진 높이를 재서 화면을 넘으면 병을 더 줄인다 */
  var bw = Math.max(MIN_BW, Math.min(plan.bw, 78));
  applyBottleSize(bw, tall, badgeH, H);
  for (var i = 0; i < 4; i++) {
    var drawn = columnHeight();
    if (drawn <= H - 1 || bw <= MIN_BW) break;
    bw = Math.max(MIN_BW, bw * ((H - 1) / drawn) * 0.995);
    applyBottleSize(bw, tall, badgeH, H);
  }

  game.bottles.forEach(function (b) { b.restRect = null; });
}

/* =====================================================================
   4. 조작 & 게임 진행
   ===================================================================== */
function bottleById(id) { return game.bottles[id]; }

function clearSelected() {
  game.bottles.forEach(function (b) { if (b.el) b.el.classList.remove('selected'); });
  game.selected = null;
}

function selectBottle(id) {
  var b = game.bottles[id];
  if (!b) return;
  clearSelected();
  game.selected = id;
  if (b.el) b.el.classList.add('selected');
  Sound.pick();
}

function shakeEl(el) {
  if (!el || el.classList.contains('pouring')) return;   // 기울여 붓는 중에는 흔들지 않음
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  setTimeout(function () { el.classList.remove('shake'); }, 300);
}

/* 병의 '제자리' 위치 — 붓느라 기울어 있어도 원래 상자를 잰다 */
function restRect(el) {
  var cls = el.className;
  var t = el.style.transform, tr = el.style.transition;
  var tilted = el.classList.contains('pouring') || el.classList.contains('return');
  if (tilted) el.classList.remove('pouring', 'return');
  el.style.transition = 'none';
  el.style.transform = 'none';
  var r = el.getBoundingClientRect();
  el.style.transform = t;
  el.style.transition = tr;
  if (tilted) el.className = cls;                       // 같은 프레임 안에서 원래 상태로 복구
  return r;
}

/* 병을 상대 병 위로 기울임 (입구가 상대 병 입구에 오도록 계산) */
function tiltTowards(srcEl, dstEl) {
  var a = restRect(srcEl);
  var b = dstEl.getBoundingClientRect();
  var dir = (b.left + b.width / 2) >= (a.left + a.width / 2) ? 1 : -1;
  var isTall = srcEl.classList.contains('tall');
  var deg = dir * (isTall ? 10 : 30);
  var th = deg * Math.PI / 180;
  var arm = a.height - 6;
  var lipX = a.left + a.width / 2 + Math.sin(th) * arm;
  var lipY = a.top + a.height - Math.cos(th) * arm;
  var targetX = b.left + b.width / 2 + dir * 3;
  var targetY = b.top - 7;
  var tx, ty;
  if (isTall) {
    /* 긴 병은 크게 휘둘리지 않게 제자리에서만 살짝 기울인다 (물줄기가 목표까지 이어진다) */
    tx = dir * a.width * 0.20;
    ty = -a.width * 0.04;
  } else {
    tx = targetX - lipX;      // 입구가 목표 병 입구에 오도록
    ty = targetY - lipY;
  }

  srcEl.classList.remove('return');
  srcEl.classList.add('pouring');
  srcEl.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) rotate(' + deg + 'deg)';

  return {
    x: targetX, y: targetY,
    from: { x: a.left + a.width / 2 + Math.sin(th) * arm + tx,
            y: a.top + a.height - Math.cos(th) * arm + ty }
  };
}

function untilt(el) {
  el.classList.remove('pouring');
  el.classList.add('return');
  el.style.transform = '';
}

function showStream(pt, colorIdx) {
  var wrap = document.createElement('div');
  wrap.className = 'stream-wrap';
  var s = document.createElement('div');
  s.className = 'stream';
  s.style.setProperty('--c', COLORS[colorIdx]);

  var from = pt.from || pt;
  var dx = pt.x - from.x, dy = pt.y - from.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > 10) {                       // 병 입구에서 목표까지 이어지는 물줄기
    wrap.style.left = from.x + 'px';
    wrap.style.top = from.y + 'px';
    wrap.style.transform = 'rotate(' + (Math.atan2(-dx, dy) * 180 / Math.PI).toFixed(1) + 'deg)';
    s.style.height = dist.toFixed(1) + 'px';
  } else {
    wrap.style.left = pt.x + 'px';
    wrap.style.top = pt.y + 'px';
  }
  wrap.appendChild(s);
  streamLayer.appendChild(wrap);

  var ring = document.createElement('div');
  ring.className = 'splash';
  ring.style.left = pt.x + 'px';
  ring.style.top = (pt.y + 12) + 'px';
  streamLayer.appendChild(ring);

  setTimeout(function () {
    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    if (ring.parentNode) ring.parentNode.removeChild(ring);
  }, 260);
}

/* =====================================================================
   붓기 연출 — 논리와 완전히 분리된 논블로킹 애니메이션
   한 병의 연출은 독립적으로 진행/갱신되고, 입력은 절대 기다리지 않는다.
   ===================================================================== */
var POUR_TILT = 70;      // 기울기까지
var POUR_HOLD = 75;      // 기운 채로 붓는 시간
var POUR_BACK = 75;      // 제자리로
var POUR_TOTAL = POUR_TILT + POUR_HOLD + POUR_BACK;   // 약 220ms

function cancelPourAnim(b) {
  if (!b) return;
  if (b.animT1) { clearTimeout(b.animT1); b.animT1 = 0; }
  if (b.animT2) { clearTimeout(b.animT2); b.animT2 = 0; }
  if (b.el) {
    b.el.classList.remove('pouring', 'return');
    b.el.style.transform = '';
  }
}

function cancelAllPourAnims() {
  game.bottles.forEach(cancelPourAnim);
  streamLayer.innerHTML = '';
}

function animatePour(from, to, color) {
  var el = from.el;
  if (!el || !to.el || !el.isConnected) return;
  var gen = game.gen;

  /* 같은 병이 연달아 붓는다면 새 목표로 바로 재조준 (되돌아갔다 다시 기울지 않음) */
  if (from.animT1) { clearTimeout(from.animT1); from.animT1 = 0; }
  if (from.animT2) { clearTimeout(from.animT2); from.animT2 = 0; }

  var pt = tiltTowards(el, to.el);
  showStream(pt, color);

  from.animT1 = setTimeout(function () {
    from.animT1 = 0;
    if (game.gen !== gen || !el.isConnected) return;
    untilt(el);
  }, POUR_TILT + POUR_HOLD);

  from.animT2 = setTimeout(function () {
    from.animT2 = 0;
    if (game.gen !== gen || !el.isConnected) return;
    el.classList.remove('return');
  }, POUR_TOTAL + 40);
}

/* 한 수 붓기: 논리 상태는 이 함수 안에서 '즉시' 확정된다 (기다림 없음) */
function doPour(fromId, toId, amount) {
  var from = game.bottles[fromId], to = game.bottles[toId];
  if (!from || !to || amount <= 0) return;
  var color = from.cells[from.cells.length - 1];

  game.history.push(game.bottles.map(function (b) { return b.cells.slice(); }));
  if (game.history.length > 250) game.history.shift();

  for (var i = 0; i < amount; i++) { from.cells.pop(); to.cells.push(color); }
  game.moves++;

  syncBottle(from, true);
  syncBottle(to, true);
  updateHud();
  Sound.pour();
  animatePour(from, to, color);

  if (isComplete(to)) setTimeout(function () { Sound.done(); }, 150);

  if (isWin(game.bottles)) { onWin(); return; }
  if (isComplete(to)) {
    setStatus(to.tall ? '가운데 병에 ' + COLOR_NAMES[to.goal] + ' ' + to.cap + '칸을 다 모았어요!'
                      : '한 병 완성 — 뚜껑을 닫았어요');
  } else if (to.tall) {
    setStatus('가운데 병에 ' + COLOR_NAMES[to.goal] + ' ' + to.cells.length + '/' + to.cap + '칸 — ' +
              (to.cap - to.cells.length) + '칸 남았어요');
  }
}

function onBottleClick(id) {
  if (game.won) return;
  Sound.unlock();

  var b = game.bottles[id];
  if (!b) return;
  if (isComplete(b)) return;            // 완성된 병은 뚜껑이 닫혀 잠김 — 선택 불가

  // 아무것도 안 고른 상태
  if (game.selected === null) {
    if (!b.cells.length) { Sound.fail(); shakeEl(b.el); setStatus('빈 병은 고를 수 없어요'); return; }
    selectBottle(id);
    return;
  }

  // 같은 병 다시 누르면 취소
  if (game.selected === id) { clearSelected(); return; }

  var from = game.bottles[game.selected];
  var amount = pourAmount(from, b);

  if (amount > 0) {
    var fromId = game.selected;
    clearSelected();
    doPour(fromId, id, amount);     // 즉시 확정 — 연출이 끝나기를 기다리지 않음
    return;
  }

  // 못 부으면: 새 병을 선택하거나 해제
  clearSelected();
  Sound.fail();
  shakeEl(b.el);
  if (b.cells.length >= b.cap) setStatus('병이 가득 찼어요');
  else if (b.goal !== null && b.goal !== undefined) setStatus('가운데 긴 병에는 ' + COLOR_NAMES[b.goal] + '만 부을 수 있어요');
  else setStatus('맨 위 색이 같아야 부을 수 있어요');

  if (b.cells.length) selectBottle(id);
}

function undo() {
  if (!game.history.length) return;
  game.gen++;                        // 진행 중인 붓기 연출·클리어 예약을 모두 무효화
  cancelAllPourAnims();
  if (game.won) { game.won = false; overlay.classList.add('hidden'); }

  var snap = game.history.pop();
  game.bottles.forEach(function (b, i) { b.cells = snap[i].slice(); });
  game.moves = Math.max(0, game.moves - 1);
  clearSelected();
  renderAll(false);
  updateHud();
  Sound.pick();
  setStatus('한 수 되돌렸어요');
}

function onWin() {
  game.won = true;
  clearSelected();
  Sound.win();

  var gen = game.gen;
  var next = game.level + 1;
  store('wsp.level', String(next));
  store('wsp.seed', String(Math.floor(Math.random() * 1e9)));

  setTimeout(function () {
    if (game.gen !== gen || !game.won) return;      // 그 사이 되돌리기/새 판으로 무효화됨
    elClearSub.textContent = '레벨 ' + game.level + ' · 이동 ' + game.moves + '회';
    overlay.classList.remove('hidden');
    spawnConfetti();
  }, 330);
}

function spawnConfetti() {
  confettiEl.innerHTML = '';
  for (var i = 0; i < 36; i++) {
    var p = document.createElement('i');
    p.style.left = (4 + Math.random() * 92) + '%';
    p.style.background = COLORS[i % COLORS.length];
    p.style.width = p.style.height = (5 + Math.random() * 8).toFixed(0) + 'px';
    p.style.opacity = (0.65 + Math.random() * 0.35).toFixed(2);
    p.style.animationDuration = (1.9 + Math.random() * 1.6).toFixed(2) + 's';
    p.style.animationDelay = (Math.random() * 0.7).toFixed(2) + 's';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confettiEl.appendChild(p);
  }
}

function startLevel(level, seed) {
  game.gen++;                       // 이전 판의 붓기 연출·클리어 예약 모두 무효화
  cancelAllPourAnims();

  game.level = Math.max(1, level | 0);
  game.seed = (seed >>> 0) || 1;

  var gen = generateLevel(game.level, game.seed);
  gen.bottles.forEach(function (b, i) { b.id = i; });

  game.cfg = gen.cfg;
  game.goal = gen.goal;
  game.solution = gen.moves;
  game.bottles = gen.bottles;
  game.tiers = gen.cfg.tiers;
  game.moves = 0;
  game.history = [];
  game.selected = null;
  game.won = false;

  buildLayout();
  fitStage();
  renderAll(false);
  updateHud();
  overlay.classList.add('hidden');

  store('wsp.level', String(game.level));
  store('wsp.seed', String(game.seed));

  var goalBottle = null;
  game.bottles.forEach(function (b) { if (b.tall) goalBottle = b; });
  setStatus(goalBottle
    ? '가운데 병에 ' + COLOR_NAMES[goalBottle.goal] + ' ' + goalBottle.cap + '칸을 모으면 클리어'
    : '병을 눌러 고른 뒤, 다른 병을 눌러 부으세요');

  window.scrollTo(0, 0);
}

/* =====================================================================
   5. 이벤트 연결 & 시작
   ===================================================================== */
/* 화면 좌표 → 그 자리에 '원래' 있는 병 (붓느라 기울어 자리를 벗어나도 놓치지 않게) */
function bottleAtPoint(x, y) {
  for (var i = 0; i < game.bottles.length; i++) {
    var b = game.bottles[i];
    if (!b.el || !b.el.isConnected) continue;
    var r = b.restRect || (b.restRect = restRect(b.el));
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
  }
  return -1;
}

stageEl.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('.bottle') : null;
  var id = el ? Number(el.dataset.id) : -1;

  /* 제자리에 있는 병을 눌렀다면 그대로 */
  if (id >= 0) {
    var tb = game.bottles[id];
    if (tb && tb.el && !tb.el.classList.contains('pouring') && !tb.el.classList.contains('return')) {
      onBottleClick(id);
      return;
    }
  }
  /* 기울어 날아온 병이 다른 병 자리를 덮고 있어도, 누른 자리의 주인으로 처리 */
  var slotId = bottleAtPoint(ev.clientX, ev.clientY);
  if (slotId >= 0) { onBottleClick(slotId); return; }
  if (id >= 0) onBottleClick(id);
});

$('#btnUndo').addEventListener('click', undo);

$('#btnRestart').addEventListener('click', function () {
  startLevel(game.level, game.seed);
  Sound.pick();
  setStatus('같은 판을 처음부터 다시 시작해요');
});

$('#btnNew').addEventListener('click', function () {
  startLevel(game.level, Math.floor(Math.random() * 1e9) + 1);
  Sound.pick();
  setStatus('새 판을 섞었어요');
});

$('#btnNext').addEventListener('click', function () {
  overlay.classList.add('hidden');
  startLevel(game.level + 1, Math.floor(Math.random() * 1e9) + 1);
  Sound.pick();
});

btnSound.addEventListener('click', function () {
  var muted = Sound.toggle();
  btnSound.classList.toggle('muted', muted);
  btnSound.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
  store('wsp.muted', muted ? '1' : '0');
});

document.addEventListener('visibilitychange', function () {
  if (!document.hidden) Sound.unlock();
});

var resizeTimer = 0;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { fitStage(); }, 120);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
/* iOS Safari 는 스크롤·툴바 접힘에 따라 visualViewport 가 따로 변한다 */
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize);
  window.visualViewport.addEventListener('scroll', onResize);
}

(function init() {
  btnSound.classList.toggle('muted', Sound.isMuted());

  var savedLevel = parseInt(store('wsp.level') || '1', 10);
  if (!isFinite(savedLevel) || savedLevel < 1) savedLevel = 1;
  var savedSeed = parseInt(store('wsp.seed') || '0', 10);
  if (!isFinite(savedSeed) || savedSeed <= 0) savedSeed = Math.floor(Math.random() * 1e9) + 1;

  startLevel(savedLevel, savedSeed);
})();

/* ---- 개발/검증용 디버그 훅 (화면에는 영향 없음) ---- */
window.__wsp = {
  go: function (level, seed) { startLevel(level, seed || Math.floor(Math.random() * 1e9) + 1); },
  /* 검증용: 이 판의 정답 수순을 그대로 재생해 클리어 화면까지 연출 */
  solve: function () {
    var ms = game.solution || [], i, amt, steps = 0;
    for (i = ms.length - 1; i >= 0; i--) {
      amt = pourAmount(game.bottles[ms[i][1]], game.bottles[ms[i][0]]);
      if (amt > 0) { doPour(ms[i][1], ms[i][0], amt); steps++; }
    }
    return { won: game.won, moves: game.moves, steps: steps };
  },
  state: function () {
    return {
      level: game.level, seed: game.seed, moves: game.moves, won: game.won,
      pouring: game.bottles.filter(function (b) { return !!b.animT1 || !!b.animT2; }).length,
      tilted: game.bottles.filter(function (b) { return b.el && (b.el.classList.contains('pouring') || b.el.classList.contains('return')); }).length,
      goal: game.goal,
      bottles: game.bottles.map(function (b) { return { id: b.id, cells: b.cells.slice(), cap: b.cap, tall: b.tall, goal: b.goal, done: isComplete(b) }; }),
      win: isWin(game.bottles)
    };
  },
  /* 생성기 전수 검증: 모든 레벨/시드의 판이 '실제 규칙'으로 풀리는지 확인 */
  selfTest: function (levels, seeds) {
    levels = levels || 12; seeds = seeds || 30;
    var report = [], allOk = true, minSteps = Infinity, maxSteps = 0, sumSteps = 0;
    var fails = [], cases = 0, sumMixed = 0, sumDone = 0, slowestMs = 0, sumMs = 0;
    var levelSpec = [];
    for (var L = 1; L <= levels; L++) {
      var cfgL = levelConfig(L);
      var spec = { level: L, normal: cfgL.normalBottles, tall: cfgL.tallCap, colors: cfgL.colors,
                   tiers: cfgL.tiers, units: cfgL.units };
      if (L <= 4 || L === 5 || L === 9 || L === 10 || L === 19 || L === 20 || L === 36 || L === levels) levelSpec.push(spec);
      for (var s = 1; s <= seeds; s++) {
        var seed = s * 7919 + L * 104729;
        var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
        var g = generateLevel(L, seed);
        var ms = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
        if (ms > slowestMs) slowestMs = ms;
        sumMs += ms;
        cases++;
        if (!g) { allOk = false; if (fails.length < 8) fails.push({ level: L, seed: seed, null: true }); continue; }

        var signs = g.bottles.map(function (b) { return { cells: b.cells.slice(), cap: b.cap, tall: b.tall, goal: b.goal, levelGoal: b.levelGoal }; });
        var alreadyWon = isWin(signs);

        /* 1) 병 구성: 일반 병 수, 긴 병 용량, 색별 칸 수 */
        var tallStart = -1, emptyBottles = 0, goalCells = 0, normals = 0, i2, j2;
        var perColor = {};
        for (i2 = 0; i2 < signs.length; i2++) {
          var b2 = signs[i2];
          if (b2.tall) { tallStart = b2.cells.length; continue; }
          normals++;
          if (!b2.cells.length) emptyBottles++;
          for (j2 = 0; j2 < b2.cells.length; j2++) {
            var col = b2.cells[j2];
            perColor[col] = (perColor[col] || 0) + 1;
            if (col === g.goal) goalCells++;
          }
        }
        var emptyOk = !g.cfg.tall || emptyBottles === 0;          // 3레벨부터 시작 시 빈 일반 병 0개
        var symOk = normals % 2 === 0 && normals === g.cfg.normalBottles;  // 좌우 같은 병 수
        var shapeOk = normals === g.cfg.normalBottles &&
                      (!g.cfg.tall || (tallStart === 0 && goalCells === g.cfg.tallCap)) &&
                      (!g.cfg.tall || signs.length === g.cfg.normalBottles + 1);
        if (!g.cfg.tall) shapeOk = normals === g.cfg.normalBottles && !alreadyWon;

        /* 2) 색별 칸 수가 counts×4 와 정확히 맞는가 */

    { id: 'light',  label: '조명', hint: '천장에서 내려오는 등',    def: 'light_bulb' },
    { id: 'deco',   label: '소품', hint: '방 한쪽에 두는 소품',     def: 'deco_none' },
    { id: 'hat',    label: '모자', hint: '대표 친구가 쓰는 모자',   def: 'hat_none' },
    { id: 'outfit', label: '의상', hint: '대표 친구가 입는 옷',     def: 'outfit_rag' }
  ];
  var DECO_SEC = SLOTS;

  /* 이전 저장(등·조명이 prop 칸에 있던 시절)을 새 칸 이름으로 옮긴다 */

  };

  /* ---------- 밸런스 ---------- */
  /* 예전에는 판당 45 + 7×레벨(41레벨이면 332코인)이라 금방 쌓였다.
     이제 15코인에서 시작해 3레벨마다 1코인씩, 최대 30코인까지만 준다. */
  var BASE_COIN = 15, LEVEL_STEP = 3, MAX_COIN = 30;
  var WELCOME_PER_LEVEL = 8, WELCOME_CAP = 240;

  function clearReward(level) {
    return Math.min(MAX_COIN, BASE_COIN + Math.floor((Math.max(1, level) - 1) / LEVEL_STEP));
  }
  function defaultEquipped() {
    var o = {}, i;
    for (i = 0; i < SLOTS.length; i++) o[SLOTS[i].id] = SLOTS[i].def;
    return o;
  }

  var RS = { coins: 0, grade: 1, pets: [], lead: 0, owned: {}, equipped: defaultEquipped() };
  var curTab = 'pets';
  var decoSlot = 'wall';

  /* ---------- 저장 ---------- */
  function num(v, d) { var n = parseInt(v, 10); return isFinite(n) ? n : d; }
  function readJSON(key, d) { try { var v = JSON.parse(store(key) || 'null'); return (v && typeof v === 'object') ? v : d; } catch (e) { return d; } }
  function save() {
    store('wsp.coins', String(RS.coins));
    store('wsp.room.grade', String(RS.grade));
    store('wsp.room.owned', JSON.stringify(RS.owned));
    store('wsp.room.equipped', JSON.stringify(RS.equipped));
    store('wsp.room.pets', JSON.stringify(RS.pets));
    store('wsp.room.lead', String(RS.lead));
  }
  function load() {
    RS.coins = Math.max(0, num(store('wsp.coins'), 0));
    var gRaw = num(store('wsp.room.grade'), 1);
    if (store('wsp.room.rgv') !== '2') {
      RS.grade = GRADE_OLD[Math.min(5, Math.max(1, gRaw))] || 1;
      store('wsp.room.rgv', '2');
    } else {
      RS.grade = Math.min(GRADE_MAX, Math.max(1, gRaw));
    }

    /* 보유 아이템 — 예전 prop_* 이름도 새 이름으로 옮겨 그대로 보유 처리 */
    var rawOwned = readJSON('wsp.room.owned', {}), k;
    RS.owned = {};
    for (k in rawOwned) if (rawOwned[k]) RS.owned[ALIAS[k] || k] = 1;

    /* 장착 — 저장된 값이 지금 칸에 맞는 아이템일 때만 살리고, 아니면 그 칸의 기본값 */
    var rawEq = readJSON('wsp.room.equipped', {}), picked = {}, v;
    for (k in rawEq) {
      v = rawEq[k];
      if (typeof v !== 'string') continue;
      v = ALIAS[v] || v;
      var sit = itemById(v);
      if (sit) picked[sit.slot] = v;
    }
    RS.equipped = {};
    for (k = 0; k < SLOTS.length; k++) {
      var sl = SLOTS[k];
      RS.equipped[sl.id] = picked[sl.id] || sl.def;
    }

    var i;
    for (i = 0; i < ITEMS.length; i++) if (ITEMS[i].price === 0) RS.owned[ITEMS[i].id] = 1;

    /* ---- 1회성: 예전 버전에서 실수로 사 버린 조명 환불 ---- */
    if (store('wsp.room.rf1') === null) {
      var OLD_LAMP = { light_stand: 180, light_neon: 900, light_chandelier: 1800 }, j, sum = 0, names = [];
      for (j in OLD_LAMP) {
        if (!RS.owned[j]) continue;
        delete RS.owned[j];
        sum += OLD_LAMP[j];
        var lit = itemById(j);
        names.push(lit ? lit.name : j);
      }
      if (sum > 0) {
        RS.coins += sum;
        var eqL = RS.equipped.light;
        if (OLD_LAMP[eqL]) RS.equipped.light = 'light_bulb';
        refundPending = sum;
        refundNames = names.join(' · ');
      }
      store('wsp.room.rf1', '1');
    }

    /* 펫 목록 — 새 저장 형식(wsp.room.pets), 없으면 예전 1마리 저장에서 이사 */
    var pets = readJSON('wsp.room.pets', null);
    RS.pets = [];
    if (Object.prototype.toString.call(pets) === '[object Array]') {
      for (i = 0; i < pets.length && RS.pets.length < 5; i++) {
        var p = pets[i];
        if (!p || typeof p !== 'object') continue;
        var b = breedById(p.breed);
        if (!b) continue;
        RS.pets.push({ id: num(p.id, i + 1), breed: b.id, name: cleanName(p.name, b.def) });
      }
    } else {
      var legacy = store('wsp.room.char');
      if (legacy === 'cat' || legacy === 'dog') {

        RS.pets = [{ id: 1, breed: lb, name: breedById(lb).def }];
      }
    }
    RS.lead = Math.min(Math.max(0, num(store('wsp.room.lead'), 0)), Math.max(0, RS.pets.length - 1));

    /* 처음 꾸미기 세이브가 만들어질 때 — 지금까지 깬 레벨만큼 환영 소급 보너스(상한) */
    if (store('wsp.room.welcome') === null) {
      var lv = Math.max(1, num(store('wsp.level'), 1));
      var bonus = Math.min(WELCOME_CAP, Math.max(0, (lv - 1) * WELCOME_PER_LEVEL));
      if (bonus > 0) { RS.coins += bonus; welcomePending = bonus; }
      store('wsp.room.welcome', '1');
    }
    save();
  }

         '이름을 눌러 직접 바꿀 수 있어요.</p>';
    if (!n) {
      s += '<p class="room-hint">위 <b>첫 친구 무료 입양</b> 버튼을 눌러 고양이·강아지 중 한 마리를 맞이해 보세요.</p>';
      return s;
    }
    s += '<div class="pets">';
    for (i = 0; i < n; i++) {
      var p = RS.pets[i], b = breedById(p.breed) || BREEDS[0];
      s += '<div class="petcard' + (i === lead ? ' on' : '') + '">' +
        '<div class="av"><img src="' + ASSET + breedImg(p.breed) + '" alt=""></div>' +
        '<div class="info">' +
          '<input class="pname" type="text" maxlength="8" value="' + esc(p.name) + '" data-name="' + i + '" aria-label="' + b.name + ' 이름" autocomplete="off" spellcheck="false" enterkeyhint="done">' +
          '<small>' + b.name + (i === lead ? ' · 대표 친구 (모자·의상 착용)' : '') + '</small>' +
        '</div>' +
        (i === lead ? '<span class="leadbadge">대표</span>' : '<button class="leadbtn" data-lead="' + i + '">대표로</button>') +
      '</div>';
    }
    s += '</div>';
    if (n < cap) s += '<p class="room-hint"><b>입양</b> 탭에서 새 품종을 맞이할 수 있어요.</p>';
    else if (RS.grade < GRADE_MAX) s += '<p class="room-hint">지금 방은 가득 찼어요. <b>방</b> 탭에서 이사하면 ' + RG[RS.grade].cap + '마리까지 늘어나요.</p>';
    else s += '<p class="room-hint">궁궐에는 다섯 친구까지 함께 살 수 있어요.</p>';
    return s;
  }

  function renderBody(keepScroll) {
    var box = el('roomBody');
    if (!box) return;
    var sc = keepScroll ? box.scrollTop : 0;
    var s = '', i;
    if (curTab === 'pets') {
      s = petRoster();
    } else if (curTab === 'adopt') {
      var cats = BREEDS.filter(function (b) { return b.kind === 'cat'; });
      var dogs = BREEDS.filter(function (b) { return b.kind === 'dog'; });
      if (petsAtCap() && RS.grade < GRADE_MAX) {
        s += '<p class="room-hint">지금 방은 <b>' + capacity() + '마리</b>까지예요. <b>방</b> 탭에서 이사하면 더 입양할 수 있어요.</p>';
      } else if (!RS.pets.length) {
        s += '<p class="room-hint">첫 친구는 <b>무료</b>예요. 고양이·강아지 중 마음에 드는 품종을 골라 주세요.</p>';
      } else {
        s += '<p class="room-hint">코인을 모아 새 품종을 입양해요. 같은 품종은 한 마리까지 함께 살 수 있어요.</p>';
      }
      s += '<div class="sec-h">🐱 고양이 <span>8품종</span></div><div class="grid breeds">' + cats.map(breedCard).join('') + '</div>';
      s += '<div class="sec-h">🐶 강아지 <span>8품종</span></div><div class="grid breeds">' + dogs.map(breedCard).join('') + '</div>';
    } else if (curTab === 'room') {
      s += '<p class="room-hint">판을 깰 때마다 코인을 모아 방을 넓혀요. 방이 넓을수록 함께 살 수 있는 친구도 늘어요.</p>';
      RG.forEach(function (g) {
        var has = RS.grade >= g.n, next = g.n === RS.grade + 1;
        var priceTxt = g.n === 1 ? '기본 방' : (has ? '이미 이사함' : COIN + ' ' + fmt(g.price));
        var cls = 'roomup' + (has ? ' on' : '') + (!has && !next ? ' locked' : '');
        s += '<div class="' + cls + '" data-grade="' + g.n + '">' +
          '<div class="pv">' + sceneSvg({ grade: g.n, pets: RS.pets.slice(0, g.cap), lead: leadIndex(), hat: 'hat_none', outfit: 'outfit_rag', bed: 'bed_box', tone: 'tone_none', wall: 'wall_old', frame: 'frame_empty', rug: 'rug_none', light: 'light_bulb', deco: 'deco_none' }) + '</div>' +
          '<div class="info"><b>' + g.n + '단계 · ' + g.name + '</b><small>' + g.sub + ' · 친구 ' + g.cap + '마리</small>' +
          '<span class="pr' + (has ? ' ok' : (next ? '' : ' no')) + '">' + priceTxt + '</span></div>' +
        '</div>';
      });
    } else if (curTab === 'deco') {
      var cur = null, j;
      for (j = 0; j < SLOTS.length; j++) if (SLOTS[j].id === decoSlot) cur = SLOTS[j];
      if (!cur) { cur = SLOTS[0]; decoSlot = cur.id; }
      s += '<div class="deco-chips">' + SLOTS.map(function (sec) {
        return '<button class="dchip' + (sec.id === decoSlot ? ' on' : '') + '" data-slot="' + sec.id + '">' +
                 sec.label + '<i>' + itemsOf(sec.id).length + '</i></button>';
      }).join('') + '</div>';
      s += '<p class="room-hint"><b>' + cur.label + '</b> · ' + cur.hint + '. 사지 않은 아이템을 누르면 방에 먼저 보여 주고, <b>자물쇠</b>가 채워진 채로 미리보기돼요.</p>';
      s += '<div class="sec-h">' + cur.label + ' <span>' + itemsOf(cur.id).length + '종</span></div><div class="grid">' +
           itemsOf(cur.id).map(itemCard).join('') + '</div>';
    } else {
      var list = itemsOf(curTab);
      s += '<div class="deco-chips">' + SLOTS.map(function (sec) {
        return '<button class="dchip' + (sec.id === curTab ? ' on' : '') + '" data-slot="' + sec.id + '">' + sec.label + '</button>';
      }).join('') + '</div>';
      s += '<div class="grid">' + list.map(itemCard).join('') + '</div>';
    }
    box.innerHTML = s;
    box.scrollTop = sc;
  }

  function renderAll() {
    renderHud();
    renderScene();
    renderTabs();
    renderBody(true);
    var g = RG[RS.grade - 1];
    if (el('roomGradeName')) el('roomGradeName').textContent = g.n + '단계 · ' + g.name;
  }

  /* ---------- 동작 ---------- */
  function equip(it) { RS.equipped[it.slot] = it.id; save(); renderAll(); }

  function buyOrEquip(id) {
    var it = itemById(id);
    if (!it) return;
    if (owned(it)) {
      if (RS.equipped[it.slot] === it.id) { toast('이미 착용 중이에요'); return; }
      equip(it);
      Sound.pick();
      toast(it.name + ' 착용!');
      return;
    }
    /* 미구입 아이템은 절대 바로 사지 않는다 — 방에 미리보기만 띄우고, 구매는 잠금 배너의 버튼으로만 */
    setPreview(it);
    if (levelLocked(it)) toast('Lv.' + (it.req || 1) + ' 달성 시 살 수 있어요 · 지금은 미리보기');
  }

  function buyGrade(n) {
    var g = RG[n - 1];
    if (!g) return;
    if (RS.grade >= n) { toast('이미 ' + g.n + '단계 ' + g.name + '에 살고 있어요'); return; }
    if (n !== RS.grade + 1) { toast('방은 한 단계씩 올릴 수 있어요'); return; }
    if (!confirmArm('grade:' + n, '한 번 더 누르면 ' + fmt(g.price) + '코인으로 ' + g.name + '으로 이사')) return;
    if (RS.coins < g.price) {
      toast('코인이 ' + fmt(g.price - RS.coins) + '개 부족해요 · 판을 깨서 모아 보세요');
      Sound.fail();
      return;
    }
    RS.coins -= g.price;
    RS.grade = n;
    save();
    renderAll();
    Sound.win();
    toast(g.n + '단계 ' + g.name + (n === GRADE_MAX ? ' 입성! 🏰 마지막 방이에요' : '으로 이사! 친구 ' + g.cap + '마리까지'));
  }

  function adopt(id) {
    var b = breedById(id);
    if (!b) return 0;
    if (hasBreed(b.id)) { toast(b.name + '는 이미 함께 살고 있어요'); Sound.pick(); return 0; }
    if (petsAtCap()) {
      if (RS.grade < GRADE_MAX) toast('지금 방은 ' + capacity() + '마리까지예요 · 방을 넓히면 ' + RG[RS.grade].cap + '마리까지');
      else toast('궁궐은 다섯 친구까지 함께 살 수 있어요');
      Sound.fail();
      return 0;
    }
    var pr = adoptPrice(b);
    if (!confirmArm('pet:' + b.id, '한 번 더 누르면 ' + fmt(pr) + '코인으로 ' + b.name + ' 입양')) return 0;
    if (RS.coins < pr) {
      toast('코인이 ' + fmt(pr - RS.coins) + '개 부족해요 · 판을 깨서 모아 보세요');
      Sound.fail();
      return 0;
    }
    RS.coins -= pr;
    RS.pets.push({ id: nextPetId(), breed: b.id, name: b.def });
    if (RS.pets.length === 1) RS.lead = 0;
    save();
    curTab = 'pets';
    renderAll();
    boxTop();
    Sound.done();
    toast(pr === 0 ? b.name + ' 첫 입양! 무료로 가족이 됐어요' : b.name + ' 입양 완료! 이름을 지어 주세요');
    return 1;
  }

  function renamePet(i, val) {
    var p = RS.pets[i];
    if (!p) return;
    var b = breedById(p.breed) || BREEDS[0];
    p.name = cleanName(val, b.def);
    save();
    renderScene();
  }

  function setLead(i) {
    if (!RS.pets[i]) return;
    if (leadIndex() === i) return;
    RS.lead = i;
    save();
    renderAll();
    Sound.pick();
    toast(RS.pets[i].name + '가 대표 친구예요');
  }

  function boxTop() { var b = el('roomBody'); if (b) b.scrollTop = 0; }

  function open() {
    var r = el('room');
    if (!r) return;
    r.classList.add('open');
    r.setAttribute('aria-hidden', 'false');
    renderAll();
    preload();
    if (welcomePending) {
      var w = welcomePending;
      welcomePending = 0;
      setTimeout(function () { toast('레벨 기록 환영 선물 · 코인 ' + fmt(w) + '개 도착!'); }, 320);
    }
  }
  function close() {
    clearPreview();
    var r = el('room');
    if (!r) return;
    r.classList.remove('open');
    r.setAttribute('aria-hidden', 'true');
  }
  function isOpen() { var r = el('room'); return !!r && r.classList.contains('open'); }

  /* 이미지 미리 받기 (방 5장 + 펫 16종) */
  var preloaded = false;
  function preload() {
    if (preloaded) return;
    preloaded = true;
    var i, im;
    for (i = 1; i <= 5; i++) { im = new Image(); im.src = ASSET + 'room_' + i + '.webp'; }
    for (i = 0; i < BREEDS.length; i++) { im = new Image(); im.src = ASSET + BREEDS[i].id + '.webp'; }
  }

  /* ---------- 클리어 코인 ---------- */
  /* 이동 횟수가 적을수록 보너스 — 기준(game.solution 길이) 대비 비율로 판정 */
  function clearBonus(moves, par) {
    if (!par || !moves) return 0;
    var r = moves / par;
    if (r <= 1.0) return 10;
    if (r <= 1.12) return 6;
    if (r <= 1.3) return 2;
    return 0;
  }

  function award(level, seed, moves, par) {
    var key = level + ':' + seed;
    var bonus = clearBonus(moves, par);
    var gain = clearReward(level) + bonus;
    var first = key !== lastAwardKey;
    if (first) {
      lastAwardKey = key;
      RS.coins += gain;
      save();
      renderHud();
    }
    var out = el('clearCoins');
    if (out) out.textContent = first ? fmt(gain) : '0';
    var br = el('clearBonusRow'), bo = el('clearBonus');
    if (bo) bo.textContent = fmt(bonus);
    if (br) br.hidden = !(first && bonus > 0);
    var chip = document.querySelector('.coin-gain');
    if (chip) chip.style.display = first ? '' : 'none';
    return first ? gain : 0;
  }

  /* ---------- 이벤트 ---------- */
  function bind() {
    if (el('roomBack')) el('roomBack').addEventListener('click', function () { close(); Sound.pick(); });
    if (el('roomTabs')) el('roomTabs').addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('[data-tab]') : null;
      if (!b) return;
      clearPreview();
      curTab = b.dataset.tab;
      Sound.pick();
      renderTabs();
      renderBody();
    });
    if (el('roomBody')) el('roomBody').addEventListener('click', function (ev) {
      var t = ev.target;
      if (t.closest && t.closest('.pname')) return;
      var chip = t.closest ? t.closest('[data-slot]') : null;
      if (chip) { decoSlot = chip.dataset.slot; clearPreview(); Sound.pick(); renderBody(true); return; }
      var it = t.closest ? t.closest('[data-item]') : null;
      if (it) { buyOrEquip(it.dataset.item); return; }
      var br = t.closest ? t.closest('[data-breed]') : null;
      if (br) { adopt(br.dataset.breed); return; }
      var ld = t.closest ? t.closest('[data-lead]') : null;
      if (ld) { setLead(parseInt(ld.dataset.lead, 10)); return; }
      var gr = t.closest ? t.closest('[data-grade]') : null;
      if (gr) { buyGrade(parseInt(gr.dataset.grade, 10)); return; }
      if (t.id === 'btnAdoptFirst' || (t.closest && t.closest('#btnAdoptFirst'))) {
        curTab = 'adopt'; renderTabs(); renderBody(); Sound.pick();
      }
    });
    /* 이름 입력 — 타이핑할 때마다 방 안 이름표도 같이 바뀐다 */
    if (el('roomBody')) el('roomBody').addEventListener('input', function (ev) {
      var t = ev.target;
      if (!t || !t.dataset || t.dataset.name === undefined) return;
      var v = t.value;
      if (v.length > 8) { v = v.slice(0, 8); t.value = v; }
      renamePet(parseInt(t.dataset.name, 10), v);
    });
    if (el('roomBody')) el('roomBody').addEventListener('change', function (ev) {
      var t = ev.target;
      if (!t || !t.dataset || t.dataset.name === undefined) return;
      var i = parseInt(t.dataset.name, 10);
      /* 빈 이름은 품종 기본 이름으로 되돌리고, 그 외에는 화면 갱신 없이 값만 다듬는다
         (입력 직후 탭·버튼 한 번에 눌리도록 목록 DOM을 다시 그리지 않음) */
      renamePet(i, t.value);
      t.value = RS.pets[i] ? RS.pets[i].name : '';
    });
    if (el('roomBody')) el('roomBody').addEventListener('keydown', function (ev) {
      var t = ev.target;
      if (t && t.dataset && t.dataset.name !== undefined && ev.key === 'Enter') { ev.preventDefault(); t.blur(); }
    });
    var tapPet = function (ev) {
      var g = ev.target.closest ? ev.target.closest('.pet') : null;
      if (!g) return;
      g.classList.remove('happy');
      void g.offsetWidth;
      g.classList.add('happy');
      Sound.pick();
    };
    if (el('roomStage')) el('roomStage').addEventListener('click', tapPet);
    /* 미리보기 잠금 배너 — 구매·닫기·바깥 탭 */
    if (el('stageLock')) el('stageLock').addEventListener('click', function () { clearPreview(); });
    if (el('lkBar')) el('lkBar').addEventListener('click', function (ev) {
      var t = ev.target;
      if (t.closest && t.closest('#lkBuy')) { buyPreview(); return; }
      if (t.closest && t.closest('#lkClose')) { clearPreview(); return; }
    });
    if (el('btnHome')) el('btnHome').addEventListener('click', function () { Sound.unlock(); open(); Sound.pick(); });
    if (el('btnCoins')) el('btnCoins').addEventListener('click', function () { Sound.unlock(); open(); Sound.pick(); });
    if (el('btnRoomFromClear')) el('btnRoomFromClear').addEventListener('click', function () { open(); Sound.pick(); });
  }

  /* ---------- 시작 ---------- */
  function init() {
    load();
    bind();
    renderHud();
    if (refundPending) {
      var rp = refundPending, rn = refundNames;
      refundPending = 0;
      setTimeout(function () {
        toast('실수 구매 조명 환불 완료 (+' + fmt(rp) + '코인)' + (rn ? ' · ' + rn : ''));
      }, 700);
    }
  }

  return { init: init, open: open, close: close, isOpen: isOpen, award: award, render: renderAll,
           adopt: adopt, rename: renamePet, setLead: setLead,
           state: function () {
             return { coins: RS.coins, grade: RS.grade, gradeName: RG[RS.grade - 1].name, cap: capacity(),
                      level: playerLevel(), pets: RS.pets.slice(), lead: leadIndex(),
                      owned: RS.owned, equipped: RS.equipped, preview: preview };
           },
           _rs: RS, _rg: RG, _items: ITEMS, _breeds: BREEDS, _slots: SLOTS,
           _bonus: clearBonus,
           _preview: function (id) { var it = itemById(id); if (it) setPreview(it); return preview; },
           _buy: function () { buyPreview(); return RS.coins; } };
})();

/* ---- 퍼즐과 연결: 클리어 코인 + 시작 ---- */
(function () {
  var baseWin = onWin;
  onWin = function () {
    var lv = game.level, seed = game.seed, mv = game.moves;
    var par = (game.solution && game.solution.length) || 0;
    baseWin();
    Room.award(lv, seed, mv, par);
  };
})();
Room.init();

/* ---- 검증용 훅 (화면에는 영향 없음) ---- */
if (window.__wsp) {
  window.__wsp.room = {
    open: function () { Room.open(); },
    close: function () { Room.close(); },
    state: function () { return Room.state(); },
    render: function () { Room.render(); },
    coins: function (n) { var rs = Room._rs; rs.coins = Math.max(0, n | 0); store('wsp.coins', String(rs.coins)); Room.render(); return rs.coins; },
    give: function (n) { var rs = Room._rs; rs.coins += n | 0; store('wsp.coins', String(rs.coins)); Room.render(); return rs.coins; },
    adopt: function (id) { return Room.adopt(id); },
    rename: function (i, n) { Room.rename(i, n); return Room.state(); },
    lead: function (i) { Room.setLead(i); return Room.state(); },
    tab: function (id) {
      var btn = document.querySelector('#roomTabs [data-tab="' + id + '"]');
      if (btn) btn.click();
      return id;
    },
    /* 펫·아이템·방 상태를 한 번에 (검증용) */
    dress: function (o) {
      o = o || {};
      var rs = Room._rs, i, breeds = o.breeds || ['cat_cheese'];
      rs.pets = [];
      for (i = 0; i < breeds.length; i++) {
        var b = null, j;
        for (j = 0; j < Room._breeds.length; j++) if (Room._breeds[j].id === breeds[i]) b = Room._breeds[j];
        if (b) rs.pets.push({ id: i + 1, breed: b.id, name: (o.names && o.names[i]) || b.def });
      }
      rs.lead = o.lead || 0;
      for (i = 0; i < Room._items.length; i++) rs.owned[Room._items[i].id] = 1;
      rs.grade = o.grade || 20;
      rs.equipped.hat = o.hat || 'hat_crown';
      rs.equipped.outfit = o.outfit || 'outfit_cape';
      rs.equipped.bed = o.bed || 'bed_canopy';
      rs.equipped.wall = o.wall || 'wall_gold';
      rs.equipped.frame = o.frame || 'frame_palace';
      rs.equipped.rug = o.rug || 'rug_gold';
      rs.equipped.light = o.light || 'light_chandelier';
      rs.equipped.deco = o.deco || 'deco_aquarium';
      rs.equipped.tone = o.tone || 'tone_amber';
      if (o.coins != null) rs.coins = o.coins;
      store('wsp.room.pets', JSON.stringify(rs.pets));
      store('wsp.room.lead', String(rs.lead));
      store('wsp.room.owned', JSON.stringify(rs.owned));
      store('wsp.room.grade', String(rs.grade));
      store('wsp.room.equipped', JSON.stringify(rs.equipped));
      store('wsp.coins', String(rs.coins));
      Room.render();
      return Room.state();
    },
    preview: function (id) { return Room._preview(id); },
    buy: function () { return Room._buy(); },
    bonus: function (moves, par) { return Room._bonus(moves, par); },
    reset: function () {
      var keys = ['wsp.coins', 'wsp.room.grade', 'wsp.room.char', 'wsp.room.owned', 'wsp.room.equipped',
                  'wsp.room.welcome', 'wsp.room.pets', 'wsp.room.lead', 'wsp.room.rgv', 'wsp.room.rf1'];
      keys.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
      location.reload();
    }
  };
}

/* @@ROOM-JS-END @@ */
</script>
</body>
</html>
