  }

  function predictChips(a, b) {
    const kinds = [['coat', 'traitCoat'], ['pattern', 'traitPattern'], ['horn', 'traitHorn'], ['wing', 'traitWing']];
    const mut = 9;
    return kinds.map(([k, label]) => {
      const x = a[k], y = b[k];
      if (x === y) {
        return '<span class="hint-chip"><b>' + t(label) + '</b> ' + traitName(k, x) + ' ' + (100 - mut) + '%</span>';
      }
      return '<span class="hint-chip"><b>' + t(label) + '</b> ' + traitName(k, x) + ' 45% · ' + traitName(k, y) + ' 45%</span>';
    }).join('') +
      '<span class="hint-chip">' + t('mutation') + ' ' + mut + '%</span>' +
      '<span class="hint-chip">' + t('hintAurora') + '</span>';
  }

  function breedPair(a, b, cost, fromNPC) {
    cost = cost || 3;
    if (state.carrots < cost) { toast(t('noCarrot')); return; }
    if (state.eggs.length >= MAX_EGGS) { toast(t('nestFull')); return; }
    if (state.horses.length >= state.slots && fromNPC) { toast(t('slotsFull')); return; }
    state.carrots -= cost;
    const genome = breedGenome(a, b);
    const grade = HA.gradeFromTraits(genome);
    const ord = HA.GRADES[grade].order;
    const egg = {
      id: 'e' + Date.now().toString(36) + Math.floor(Math.random() * 99),
      genome, seed: Math.floor(Math.random() * 1e9),
      parents: [horseLabel(a), horseLabel(b)],
      t: 0, need: 18 + ord * 4, ready: false,
      stats: {
        speed: Math.round((a.stats.speed + b.stats.speed) / 2 + rand(-4, 5) + ord * 2),
        grace: Math.round((a.stats.grace + b.stats.grace) / 2 + rand(-4, 5) + ord * 2),
        charm: Math.round((a.stats.charm + b.stats.charm) / 2 + rand(-4, 5) + ord * 2)
      }
    };
    state.eggs.push(egg);
    updateCurrency(); queueSave();
    toast(t('eggLaid'));
    state.sel.a = null; state.sel.b = null;
    setTab('nest');
  }

  /* ---------------- 둥지 ---------------- */
  let nestTimer = null;
  function renderNest() {
    const body = $('nest-body');
    $('t-nest').textContent = t('nestTitle');
    $('s-nest').textContent = t('nestSub');
    if (!state.eggs.length) {
      body.innerHTML = '<div class="empty-state">' + t('nestEmpty').replace(/\n/g, '<br>') + '</div>';
      clearInterval(nestTimer); nestTimer = null;
      return;
    }
    body.innerHTML = '<div class="egg-grid' + (state.eggs.length === 1 ? ' one' : '') + '" id="egg-grid"></div>';
    const grid = body.querySelector('#egg-grid');
    for (const egg of state.eggs) {
      const card = el('div', 'egg-card');
      card.dataset.id = egg.id;
      card.innerHTML = '<canvas id="egg-cv-' + egg.id + '"></canvas>' +
        '<div class="egg-name">' + t('eggMystery') + '</div>' +
        '<div class="egg-time" style="color:var(--dim);margin-top:1px">' + t('eggOf', { a: egg.parents[0], b: egg.parents[1] }) + '</div>' +
        '<div class="egg-time" id="egg-t-' + egg.id + '"></div>' +
        '<div class="egg-bar"><i id="egg-b-' + egg.id + '" style="width:0%"></i></div>' +
        '<div class="hatch-later">' + t('tapHatch') + '</div>';
      card.addEventListener('click', () => tapEgg(egg));
      grid.appendChild(card);
    }
    const now0 = Date.now();
    for (const egg of state.eggs) {
      if (egg.last) {
        const dtSec = Math.min(3600, (now0 - egg.last) / 1000) * 0.35;
        egg.t += dtSec;
        egg.progress = Math.min(1, (egg.progress || 0) + dtSec / egg.need * 0.55);
      }
      egg.last = now0;
    }
    const paint = () => {
      for (const egg of state.eggs) {
        const cv = document.getElementById('egg-cv-' + egg.id);
        if (!cv) continue;
        const box = cv.getBoundingClientRect();
        if (!box.width) continue;
        const { ctx, w, h } = fitCanvas(cv, box.width, box.height);
        ctx.clearRect(0, 0, w, h);
        HA.drawEgg(ctx, { x: w / 2, y: h * 0.95, scale: Math.min(w, h) / 105, t: egg.t, progress: egg.progress || 0, genome: egg.genome, seed: egg.seed });
        const bar = document.getElementById('egg-b-' + egg.id);
        const timeEl = document.getElementById('egg-t-' + egg.id);
        if (bar) bar.style.width = Math.round((egg.progress || 0) * 100) + '%';
        if (timeEl) {
          const left = Math.max(0, egg.need - egg.t);
          timeEl.textContent = egg.progress >= 1 ? t('readyNow') : (left > 0 ? Math.ceil(left) + 's' : t('tapHatch'));
        }
      }
    };
    paint();
    clearInterval(nestTimer);
    nestTimer = setInterval(() => {
      if (state.tab !== 'nest') { clearInterval(nestTimer); nestTimer = null; return; }
      let changed = false;
      for (const egg of state.eggs) {
        egg.t += 0.5;
        egg.progress = Math.min(1, (egg.progress || 0) + 0.5 / egg.need * 0.55);
        egg.last = Date.now();
        changed = true;
      }
      if (changed) paint();
    }, 500);
  }

  function tapEgg(egg) {
    egg.t += 0.4;
    egg.progress = Math.min(1, (egg.progress || 0) + 0.075);
    const cv = document.getElementById('egg-cv-' + egg.id);
    if (cv) {
      const box = cv.getBoundingClientRect();
      spawnHearts(box.left + box.width / 2, box.top + box.height / 2, 1, '#ffe6b3');
    }
    if (egg.progress >= 1) {
      hatchEgg(egg);
    } else {
      const bar = document.getElementById('egg-b-' + egg.id);
      if (bar) bar.style.width = Math.round(egg.progress * 100) + '%';
      queueSave();
    }
  }

  function hatchEgg(egg) {
    if (state.horses.length >= state.slots) { toast(t('slotsFull')); return; }
    const idx = state.eggs.indexOf(egg);
    if (idx >= 0) state.eggs.splice(idx, 1);
    const horse = makeHorse(egg.genome, {
      baseStats: egg.stats, level: 1,
      px: rand(0.15, 0.85), py: rand(0.2, 0.9), seed: egg.seed
    });
    state.horses.push(horse);
    markSeen(horse);
    state.stats.born++;
    state.records.unshift({ id: horse.id, name: horse.name, grade: HA.gradeFromTraits(horse), at: Date.now() });
    state.records = state.records.slice(0, 12);
    queueSave();
    showHatchFX(horse);
    renderNest();
    updateCurrency();
  }

  /* ---------------- 부화 연출 ---------------- */
  let hatchRAF = null;
  function showHatchFX(horse) {
    const fx = $('hatch-fx');
    fx.classList.add('on');
    $('hatch-kicker').textContent = t('hatchedKicker');
    $('hatch-name').textContent = horseLabel(horse);
    $('hatch-sub').textContent = gradeName(HA.gradeFromTraits(horse)) + ' · ' + horseTraits(horse).slice(0, 2).join(' · ');
    $('hatch-ok').textContent = t('hatchOpen');
    const cv = $('hatch-canvas');
    const box = cv.getBoundingClientRect();
    const { ctx, w, h } = fitCanvas(cv, box.width || 390, box.height || 700);
    const particles = [];
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * 6.283, sp = rand(40, 330);
      particles.push({ x: w / 2, y: h * 0.44, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(1, 3.4), life: rand(0.6, 1.6), max: 1.6, c: pick(['#ffe7b0', '#bda6ff', '#9fe8ff', '#ff9ec4']) });
    }
    const start = performance.now();
    const grade = HA.grades ? HA.grades[HA.gradeFromTraits(horse)] : null;
    function frame(ts) {
      const el2 = (ts - start) / 1000;
      ctx.clearRect(0, 0, w, h);
      // 빛 기둥
      const g = ctx.createRadialGradient(w / 2, h * 0.44, 4, w / 2, h * 0.44, w * 0.8);
      g.addColorStop(0, 'rgba(255, 240, 200, ' + (0.35 * Math.max(0, 1 - el2 / 3)) + ')');
      g.addColorStop(1, 'rgba(255, 240, 200, 0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      for (const p of particles) {
        p.x += p.vx / 60; p.y += p.vy / 60; p.vy += 1.6; p.life -= 1 / 60;
        if (p.life <= 0) continue;
        ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (el2 > 0.25) {
        const sc = Math.min(w, h) * 0.00118;
        const gy = h * 0.82;
        const rg2 = ctx.createRadialGradient(w / 2, gy - 90 * sc, 4, w / 2, gy - 90 * sc, 210 * sc);
        rg2.addColorStop(0, 'rgba(255, 236, 190, .28)');
        rg2.addColorStop(1, 'rgba(255, 236, 190, 0)');
        ctx.fillStyle = rg2;
        ctx.beginPath(); ctx.arc(w / 2, gy - 90 * sc, 210 * sc, 0, 6.283); ctx.fill();
        HA.drawHorse(ctx, horse, { x: w / 2 - 96 * sc, y: gy, scale: sc, t: el2, phase: el2 * 2, pose: 'prance', detail: true });
      }
      hatchRAF = requestAnimationFrame(frame);
    }
    cancelAnimationFrame(hatchRAF);
    hatchRAF = requestAnimationFrame(frame);
    $('hatch-ok').onclick = () => {
      fx.classList.remove('on');
      cancelAnimationFrame(hatchRAF);
      setTab('ranch');
    };
  }

  /* ---------------- 레이스 ---------------- */
  const race = { raf: null, running: false, horses: [], dist: 100, t: 0, done: false, cam: 0, finishOrder: [] };

  function renderRace() {
    const body = $('race-body');
    $('t-race').textContent = t('raceTitle');
    $('s-race').textContent = t('raceSub');

      body.innerHTML = '<div class="empty-state">' + t('needHorse') + '</div>';
      return;
    }
    if (!state.sel.race || !state.horses.find(h => h.id === state.sel.race)) state.sel.race = state.horses[0].id;
    const sel = state.horses.find(h => h.id === state.sel.race);
    let html = '<div class="race-stage"><canvas id="race-canvas"></canvas></div>';
    html += '<div class="race-row" id="race-row">';
    for (const h of state.horses) {
      html += '<button class="race-pick' + (h.id === state.sel.race ? ' sel' : '') + '" data-id="' + h.id + '">' +
        '<canvas></canvas><div class="rp-name">' + horseLabel(h) + '</div><div class="rp-spd">' + t('speedShort') + ' ' + h.stats.speed + '</div></button>';
    }
    html += '</div>';
    html += '<div style="display:flex;gap:8px;align-items:center;margin-top:6px">' +
      '<div style="font-size:10.5px;color:var(--dim);flex:1 1 auto">' + t('racePrize', { g: 120, g2: 80, g3: 50 }) + '</div>' +
      '<button class="btn-main" id="start-race" style="width:auto;padding:11px 18px;font-size:13px">' + t('startRace') + '</button></div>';
    html += '<div id="race-result"></div>';

    requestAnimationFrame(() => {
      body.querySelectorAll('.race-pick').forEach(p => {
        const h = state.horses.find(x => x.id === p.dataset.id);

        if (h && cv) thumb(cv, h, { zoom: 1.0 });
      });

    });

        if (race.running) return;
        state.sel.race = p.dataset.id;
        renderRace();
      });
    });
    body.querySelector('#start-race').addEventListener('click', () => startRace());
  }

  function drawRaceIdle(sel) {
    const cv = $('race-canvas');
    if (!cv) return;
    const { ctx, w, h } = fitCanvas(cv, cv.getBoundingClientRect().width, 340);
    drawRaceBg(ctx, w, h, 0);
    const sc = h / 400;
    HA.drawHorse(ctx, sel, { x: w * 0.5 - 92 * sc, y: h * 0.9, scale: sc, t: 1, phase: 0, pose: 'prance', detail: true });
  }

  function drawRaceBg(ctx, w, h, scroll) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#120e2c');
    g.addColorStop(0.55, '#2e2358');
    g.addColorStop(1, '#4b3a6e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // 별
    for (let i = 0; i < 26; i++) {
      const x = ((i * 97 + scroll * 12) % (w + 40)) - 20;
      const y = (i * 53) % (h * 0.6);
      ctx.globalAlpha = 0.25 + ((i * 37) % 60) / 100;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, y, 0.8 + (i % 3) * 0.4, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 구름
    for (let i = 0; i < 7; i++) {
      const x = ((i * 160 - scroll * 26) % (w + 240)) - 120;
      const y = h * (0.24 + (i % 3) * 0.1);
      const r = 34 + (i % 4) * 14;
      const cg = ctx.createRadialGradient(x, y, 2, x, y, r);
      cg.addColorStop(0, 'rgba(255, 235, 255, .16)');
      cg.addColorStop(1, 'rgba(255, 235, 255, 0)');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    }
    // 트랙
    ctx.fillStyle = 'rgba(20, 30, 40, .55)';
    ctx.fillRect(0, h * 0.6, w, h * 0.4);
    for (let lane = 0; lane < 4; lane++) {
      const y = h * (0.63 + lane * 0.085);
      ctx.strokeStyle = 'rgba(180, 200, 255, .12)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, y + 12); ctx.lineTo(w, y + 12); ctx.stroke();
    }
    // 결승선
    const fx = w - 26;
    for (let y = h * 0.6; y < h; y += 8) {
      ctx.fillStyle = (Math.floor(y / 8) % 2) ? 'rgba(255,255,255,.65)' : 'rgba(80,80,140,.55)';
      ctx.fillRect(fx, y, 8, 8);
    }
  }

  function drawRaceCountdown(ctx, w, h) {
    const left = Math.max(0, 2.2 - race.t);
    const n = Math.ceil(left / 0.7);
    ctx.fillStyle = 'rgba(8, 6, 20, .35)';
    ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center';
    ctx.font = '800 54px "Iowan Old Style", Palatino, serif';
    ctx.fillStyle = 'rgba(255, 231, 170, .95)';
    const pulse = 1 + (1 - (left % 0.7) / 0.7) * 0.18;
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(pulse, pulse);
    ctx.fillText(n > 0 ? String(n) : (state.lang === 'ko' ? '출발!' : 'GO!'), 0, 18);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  function startRace() {
    if (race.running) return;
    const me = state.horses.find(h => h.id === state.sel.race);
    if (!me) return;
    const stage = state.horses.filter(h => h.id !== me.id).slice(0, 2);
    const rivals = [];
    while (rivals.length + stage.length < 2) {
      rivals.push(makeHorse({
        coat: pick(COAT_KEYS), pattern: pick(PATTERN_KEYS), horn: pick(HORN_KEYS), wing: pick(WING_KEYS),
        seed: Math.floor(Math.random() * 1e9)
      }, { baseStats: { speed: me.stats.speed + Math.round(rand(-6, 6)), grace: 30, charm: 30 }, name: { ko: '초원마', en: 'Wildrunner' } }));
    }
    const lineup = [me].concat(stage.slice(0, 2), rivals).slice(0, 3).map((h, i) => ({
      horse: h, lane: i, pos: -(2 - i) * 6, speed: 0, surge: 0, boostT: 0, finished: false, time: 0, pace: 0.94 + Math.random() * 0.12, isPlayer: h.id === me.id
    }));
    race.horses = lineup;
    race.t = 0; race.done = false; race.finishOrder = []; race.running = true;
    const body = $('race-body');
    const res = body.querySelector('#race-result');
    if (res) res.innerHTML = '';
    const btn = body.querySelector('#start-race');
    if (btn) { btn.disabled = true; btn.textContent = t('racing'); }
    const cv = $('race-canvas');
    cv.onpointerdown = () => {
      if (!race.running) return;
      const me2 = race.horses.find(x => x.isPlayer);
      if (me2 && me2.boostT <= 0) { me2.boostT = 0.34; me2.surge = 0.9; }
    };
    let last = performance.now();
    let acc = 0;
    function loop(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
      if (!race.running) return;
      race.t += dt; acc += dt;
      const counting = race.t < 2.2;
      if (!counting) {
        for (const r of race.horses) {
          if (r.finished) continue;
          const base = (9.2 + r.horse.stats.speed * 0.125) * r.pace;
          if (r.boostT > 0) { r.boostT -= dt; }
          const boost = r.isPlayer ? (r.boostT > 0 ? 5.2 : 0) : (Math.sin(race.t * 1.7 + r.lane) > 0.62 ? 1.5 : 0);
          const wobble = Math.sin(race.t * 2.1 + r.lane * 2) * 0.7;
          r.speed = base + boost + wobble;
          r.pos += r.speed * dt;
          if (r.pos >= race.dist) { r.finished = true; r.time = race.t; race.finishOrder.push(r); }
        }
      }
      const stage = fitCanvas(cv, cv.getBoundingClientRect().width, 340);
      const sctx = stage.ctx, sw = stage.w, sh = stage.h;
      const lead = Math.max.apply(null, race.horses.map(r => r.pos));
      drawRaceBg(sctx, sw, sh, lead * 5 + race.t * 20);
      const sorted = race.horses.slice().sort((a, b) => b.lane - a.lane);
      for (const r of sorted) {
        const laneY = sh * (0.9 - r.lane * 0.235);
        const scale = (sh / 1080) * (1 + r.lane * 0.04);
        const x = Math.max(12, sw * 0.14 + (r.pos / race.dist) * (sw * 0.74) + (3 - r.lane) * 6);
        sctx.save();
        if (r.isPlayer) {
          const g = sctx.createRadialGradient(x, laneY - 26, 2, x, laneY - 26, 52);
          g.addColorStop(0, 'rgba(255, 226, 160, .22)');
          g.addColorStop(1, 'rgba(255, 226, 160, 0)');
          sctx.fillStyle = g;
          sctx.beginPath(); sctx.arc(x, laneY - 26, 52, 0, 6.283); sctx.fill();
        }
        HA.drawHorse(sctx, r.horse, {
          x: x - 92 * scale, y: laneY, scale, t: race.t * 2 + r.lane,
          phase: race.t * (7 + r.speed * 0.35) + r.lane, facing: 1,
          pose: r.boostT > 0 ? 'prance' : 'walk', detail: true
        });
        sctx.fillStyle = r.isPlayer ? 'rgba(255, 226, 160, .95)' : 'rgba(220, 214, 255, .55)';
        sctx.font = '600 9px -apple-system, sans-serif';
        sctx.fillText((r.isPlayer ? '★ ' : '') + horseLabel(r.horse).slice(0, 9), 12, laneY - 62 * scale + 6);
        sctx.restore();
      }
      if (!counting) {
        sctx.fillStyle = 'rgba(255,255,255,.65)';
        sctx.font = '600 11px -apple-system, sans-serif';
        sctx.fillText(t('tapToRun'), 12, 20);
      }
      if (counting) drawRaceCountdown(sctx, sw, sh);
      if (!counting && (race.finishOrder.length === race.horses.length || race.t > 16)) {
        finishRace();
        return;
      }
      race.raf = requestAnimationFrame(loop);
    }
    cancelAnimationFrame(race.raf);
    race.raf = requestAnimationFrame(loop);
  }

  function finishRace() {
    race.running = false;
    cancelAnimationFrame(race.raf);
    const me = race.horses.find(r => r.isPlayer);
    const order = race.finishOrder.slice();
    if (!order.includes(me)) { order.push(me); }
    const rank = order.indexOf(me) + 1;
    const ord = (n) => (state.lang === 'ko' ? n + '\uC704' : n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'));
    const rewards = rank === 1 ? { g: 120, c: 3 } : rank === 2 ? { g: 80, c: 2 } : rank === 3 ? { g: 50, c: 1 } : { g: 25, c: 1 };
    state.gold += rewards.g; state.carrots += rewards.c;
    state.stats.races++; if (rank === 1) state.stats.wins++;
    queueSave(); updateCurrency();
    const res = $('race-result');
    if (res) {
      res.innerHTML = '<div class="card result-panel"><div class="result-rank">' + (rank === 1 ? t('resultWin') : (state.lang === 'ko' ? t('resultRank', { n: rank }) : ord(rank))) + '</div>' +
        '<div class="result-reward">' + t('reward') + ' · ' + rewards.g + ' gold · ' + rewards.c + ' 🥕</div>' +
        '<button class="btn-main" id="race-again" style="margin-top:10px">' + t('raceAgain') + '</button></div>';
      res.querySelector('#race-again').onclick = () => { renderRace(); };
    }
    const btn = document.querySelector('#start-race');
    if (btn) { btn.disabled = false; btn.textContent = t('startRace'); }
  }

  /* ---------------- 도감 ---------------- */
  function renderCodex() {
    const body = $('codex-body');
    $('t-codex').textContent = t('codexTitle');
    $('s-codex').textContent = t('codexSub');
    const total = COAT_KEYS.length + PATTERN_KEYS.length + HORN_KEYS.length + WING_KEYS.length;
    const found = state.seen.coat.length + state.seen.pattern.length + state.seen.horn.length + state.seen.wing.length;
    const pct = Math.round(found / total * 100);
    const section = (key, labelKey, keys, table, glyph) => {
      let out = '<div class="section-label">' + t(labelKey) + ' <span style="color:var(--dim);letter-spacing:0">' + state.seen[key].length + '/' + keys.length + '</span></div><div class="trait-grid">';
      for (const k of keys) {
        const seen = state.seen[key].includes(k);
        const item = table[k];
        const nm = state.lang === 'en' ? item.en : item.ko;
        out += '<div class="trait-cell' + (seen ? '' : ' locked') + '">' +
          (seen ? '<div class="sw" style="background:' + (table === HA.COATS ? 'radial-gradient(circle at 35% 30%, ' + item.light + ', ' + item.base + ' 60%, ' + item.shade + ')' : (item.hex || '#b9b2a6')) + '"></div><div class="nm">' + nm + '</div>'
                : '<div class="lk">' + glyph + '</div><div class="nm">' + t('unknown') + '</div>') + '</div>';
      }
      out += '</div>';
      return out;
    };
    let html = '';
    html += '<div class="card tight" style="display:flex;align-items:center;gap:12px">' +
      '<div style="flex:1 1 auto"><div class="section-label" style="margin:0">' + t('completion') + '</div>' +
      '<div style="font-size:22px;font-weight:800;color:#ffe4b3">' + pct + '%</div></div>' +
      '<div style="text-align:right;font-size:10px;color:var(--dim);line-height:1.5">' + t('bestGrade') + '<br><span style="font-size:13px;color:#ffe4b3;font-weight:700">' +
      gradeName(bestGrade()) + '</span></div></div>';
    html += section('coat', 'coats', COAT_KEYS, HA.COATS, '●');
    html += section('pattern', 'patterns', PATTERN_KEYS, HA.PATTERNS, '◍');
    html += section('horn', 'horns', HORN_KEYS, HA.HORNS, '✦');
    html += section('wing', 'wings', WING_KEYS, HA.WINGS, '✧');

    html += '<div class="section-label" style="margin-top:14px">' + t('myHorses') + '</div><div class="horse-list">';
    for (const h of state.horses) html += horseRowHTML(h);
    html += '</div>';
    html += '<div class="section-label" style="margin-top:14px">' + t('records') + '</div>';
    if (state.records.length) {
      html += '<div class="card tight">';
      state.records.slice(0, 5).forEach(r => {
        const nm = state.lang === 'en' ? r.name.en : r.name.ko;
        html += '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11.5px"><span style="flex:1 1 auto">' + nm + '</span>' + gradeBadge(r.grade) + '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-state" style="padding:16px">' + t('noRecords') + '</div>';
    }
    body.innerHTML = html;

    requestAnimationFrame(() => {
      body.querySelectorAll('.horse-row').forEach(row => {
        const h = state.horses.find(x => x.id === row.dataset.id);
        const cv = row.querySelector('canvas');
        if (h && cv) thumb(cv, h, { zoom: 1.1 });
      });
    });
    body.querySelectorAll('.horse-row').forEach(row => {
      row.addEventListener('click', () => {
        const h = state.horses.find(x => x.id === row.dataset.id);
        if (h) openHorse(h);
      });
    });
  }

  function bestGrade() {
    let best = 0, key = 'normal';
    for (const h of state.horses) {
      const g = HA.gradeFromTraits(h);
      if (HA.GRADES[g].order > best) { best = HA.GRADES[g].order; key = g; }
    }
    return key;
  }

  /* ---------------- 상점 ---------------- */
  function openShop() {
    const slotPrice = 260 + (state.slots - 3) * 220;
    let html = '<div class="sheet-title">' + t('shopTitle') + '</div>' +
      '<div class="page-sub" style="text-align:center;margin-bottom:12px">' + t('shopSub') + '</div>';
    const item = (id, title, sub, price, disabled) => '<button class="card tight" data-buy="' + id + '" style="width:100%;display:flex;align-items:center;gap:10px;text-align:' + 'left' + ';' + (disabled ? 'opacity:.45;' : '') + '">' +
      '<div style="flex:1 1 auto"><div style="font-size:13px;font-weight:700">' + title + '</div><div style="font-size:10px;color:var(--dim);margin-top:2px">' + sub + '</div></div>' +
      '<div class="pill gold" style="font-size:11px">' + price + '</div></button>';
    html += item('c5', t('shopCarrot5'), '🥕×5', 90);
    html += item('c15', t('shopCarrot15'), '🥕×15', 230);
    html += item('slot', t('shopSlot'), (state.slots >= 8 ? t('shopSlotMax') : '+1'), slotPrice, state.slots >= 8);
    html += '<button class="btn-main ghost" id="open-settings" style="margin-top:14px;font-size:12px;padding:10px">' + t('settings') + '</button>';
    openSheet(html, {
      onMount(body) {
        body.querySelectorAll('[data-buy]').forEach(btn => {
          btn.onclick = () => buy(btn.dataset.buy, slotPrice);
        });
        body.querySelector('#open-settings').onclick = openSettings;
      }
    });
  }

  function buy(kind, slotPrice) {
    if (kind === 'c5') {
      if (state.gold < 90) { toast(t('notEnoughGold')); return; }
      state.gold -= 90; state.carrots += 5;
    } else if (kind === 'c15') {
      if (state.gold < 230) { toast(t('notEnoughGold')); return; }
      state.gold -= 230; state.carrots += 15;
    } else if (kind === 'slot') {
      if (state.slots >= 8) return;
      if (state.gold < slotPrice) { toast(t('notEnoughGold')); return; }
      state.gold -= slotPrice; state.slots++;
    }
    updateCurrency(); queueSave(); toast(t('bought'));
    closeSheet();
    if (state.tab === 'breed') renderBreed();
    if (state.tab === 'codex') renderCodex();
  }

  function openSettings() {
    const html = '<div class="sheet-title">' + t('settings') + '</div>' +
      '<div class="card tight" style="display:flex;align-items:center;justify-content:space-between">' +
      '<span style="font-size:12px">' + (state.lang === 'ko' ? '언어 / Language' : 'Language') + '</span>' +
      '<button class="pill" id="lang-in-sheet" style="font-size:11px">' + (state.lang === 'ko' ? '한국어 → English' : 'English → 한국어') + '</button></div>' +
      '<button class="btn-main ghost" id="do-reset" style="margin-top:12px;color:#ffb3c8">' + t('reset') + '</button>';
    openSheet(html, {
      onMount(body) {
        body.querySelector('#lang-in-sheet').onclick = () => { toggleLang(); openSettings(); };
        body.querySelector('#do-reset').onclick = () => {
          if (!confirm(t('resetConfirm'))) return;
          try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
          location.reload();
        };
      }
    });
  }

  /* ---------------- 언어 ---------------- */
  function toggleLang() {
    state.lang = state.lang === 'ko' ? 'en' : 'ko';
    document.documentElement.lang = state.lang;
    applyStaticText();
    buildTabs();
    if (state.tab === 'breed') renderBreed();
    if (state.tab === 'nest') renderNest();
    if (state.tab === 'race') renderRace();
    if (state.tab === 'codex') renderCodex();
    if (state.tab === 'ranch') { $('#ranch-hint').textContent = t('ranchHint'); }
    queueSave();
  }

  function applyStaticText() {
    $('#brand-sub').textContent = t('brandSub');
    $('#lang-btn').textContent = t('langBtn');
    $('#ranch-hint').textContent = t('ranchHint');
    $('#welcome-copy').textContent = t('welcomeCopy');
    $('#welcome-start').textContent = t('welcomeStart');
    $('#hc-feed').textContent = t('chipFeed');
    $('#hc-open').textContent = t('chipOpen');
  }

  /* ---------------- 환영 ---------------- */
  function showWelcome() {
    const w = $('welcome');
    w.classList.remove('off');
    const cv = $('welcome-canvas');
    const { ctx, w: cw, h: ch } = fitCanvas(cv, cv.getBoundingClientRect().width, 240);
    const horse = state.horses[0] || makeHorse({ coat: 'galaxy', pattern: 'starfall', horn: 'crystal', wing: 'prism', seed: 99 });
    let t0 = performance.now();
    function frame(ts) {
      if (w.classList.contains('off')) return;
      const time = (ts - t0) / 1000;
      ctx.clearRect(0, 0, cw, ch);
      const g = ctx.createRadialGradient(cw / 2, ch * 0.5, 4, cw / 2, ch * 0.5, cw * 0.7);
      g.addColorStop(0, 'rgba(170, 140, 255, .25)');
      g.addColorStop(1, 'rgba(170, 140, 255, 0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
      for (let i = 0; i < 22; i++) {
        const a = time * 0.4 + i * 1.7;
        ctx.globalAlpha = 0.25 + Math.abs(Math.sin(time * 1.4 + i)) * 0.5;
        ctx.fillStyle = '#fff';
        HA.star(ctx, cw / 2 + Math.cos(a) * (70 + (i % 4) * 22), ch * 0.46 + Math.sin(a * 1.2) * 60, 1 + (i % 3) * 0.7);
      }
      ctx.globalAlpha = 1;
      HA.drawHorse(ctx, horse, { x: cw / 2 - 168 * 0.78, y: ch * 0.96, scale: 0.78, t: time, phase: time * 1.2, pose: 'prance', detail: true });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    $('#welcome-start').onclick = () => {
      w.classList.add('off');
      state.seenWelcome = true; save();
      setTimeout(() => { buildScene(); requestAnimationFrame(ranchFrame); }, 40);
    };
  }

  /* ---------------- 부트 ---------------- */
  function boot() {
    const had = load();
    if (!had) initNew();
    if (!state.npc) refreshNPC();
    if (!state.npc.wing) state.npc.wing = 'swan';
    document.documentElement.lang = state.lang;
    applyStaticText();
    buildTabs();
    updateCurrency();
    if (state.lang === 'ko' && navigator.language && !navigator.language.toLowerCase().startsWith('ko')) {
      // 언어 설정은 저장값을 따른다
    }

    $('lang-btn').onclick = toggleLang;
    $('pill-gold').onclick = openShop;
    $('pill-carrot').onclick = openShop;
    $('pill-heart').onclick = openShop;
    $('sheet-close').onclick = closeSheet;
    $('sheet-backdrop').onclick = closeSheet;

    const cv = $('ranch-canvas');
    cv.addEventListener('pointerdown', tapRaidRanch, { passive: true });

    window.addEventListener('resize', () => {
      if (state.tab === 'ranch') buildScene();
      if (state.tab === 'race' && !race.running) renderRace();
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

    if (!state.seenWelcome) {
      showWelcome();
    } else {
      $('#welcome').classList.add('off');
      setTab('ranch');
      requestAnimationFrame(() => { buildScene(); requestAnimationFrame(ranchFrame); });
    }
  }

  function tapRaidRanch(ev) { tapRanch(ev); }

  window.__SKY = { state: state, race: race, ranch: ranch };
  window.addEventListener('load', boot);
  if (document.readyState === 'complete') boot();
})();
</script>
</body>
</html>
