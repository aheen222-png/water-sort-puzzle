<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140f2e'/%3E%3Cpath d='M32 10l6 14 15 2-11 11 3 15-13-7-13 7 3-15-11-11 15-2z' fill='%23f3cd7d'/%3E%3C/svg%3E">
<title>Skyhoof</title>
<style>:root {
  --bg0: #0a0918;
  --bg1: #1b1538;
  --bg2: #33255c;
  --panel: rgba(26, 21, 52, .92);
  --panel-2: rgba(38, 31, 74, .92);
  --line: rgba(196, 176, 255, .18);
  --gold: #f3cd7d;
  --gold-2: #c99a3f;
  --ink: #f6f1ff;
  --dim: #b6abce;
  --rose: #ff9ec4;
  --mint: #9fe6d8;
  --tab-h: 62px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg0); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
#app {
  position: relative; display: flex; flex-direction: column;
  height: 100dvh; max-height: 100dvh; overflow: hidden;
  padding-top: env(safe-area-inset-top);
  background: radial-gradient(120% 80% at 50% 0%, #2a1f52 0%, #150f2e 55%, #0a0918 100%);
}
#app::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(90% 50% at 70% 8%, rgba(160, 120, 255, .18), transparent 60%),
              radial-gradient(70% 40% at 20% 0%, rgba(255, 170, 120, .1), transparent 60%);
}

/* ---------- 상단바 ---------- */
#topbar {
  position: relative; z-index: 6;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px 6px;
  min-height: 52px;
}
.brand { display: flex; align-items: center; gap: 7px; margin-right: auto; }
.brand-mark {
  width: 26px; height: 26px; display: grid; place-items: center;
  font-size: 15px; color: #20163c; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff6d8, #f3cd7d 45%, #b8842c);
  box-shadow: 0 0 14px rgba(243, 205, 125, .55);
}
.brand-name {
  font-family: "Iowan Old Style", "Palatino", "Times New Roman", serif;
  font-size: 17px; letter-spacing: .14em; font-weight: 600;
  background: linear-gradient(180deg, #fff7e2, #e8c375 60%, #b98b3a);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  line-height: 1;
}
.brand-sub {
  display: block; font-family: -apple-system, sans-serif; font-size: 8.5px;
  letter-spacing: .18em; color: rgba(214, 200, 255, .55); margin-top: 3px;
}
.currencies { display: flex; gap: 5px; align-items: center; }
.pill {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 8px 5px 6px; border-radius: 999px;
  background: rgba(18, 14, 38, .62);
  border: 1px solid var(--line);
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.pill svg { width: 15px; height: 15px; display: block; }
.pill.gold { color: #ffdf9e; }
.pill.carrot { color: #ffbd8f; }
.pill.heart { color: #ffabcd; }
#lang-btn {
  padding: 5px 7px; border-radius: 9px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  color: #dcd2ff; border: 1px solid var(--line); background: rgba(18, 14, 38, .62);
}

/* ---------- 화면 ---------- */
main { position: relative; flex: 1 1 auto; min-height: 0; z-index: 2; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
.screen.active { display: flex; }

/* ---------- 목장 ---------- */
#screen-ranch { overflow: hidden; }
#ranch-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#ranch-hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  font-size: 11px; color: rgba(238, 230, 255, .62); white-space: nowrap;
  padding: 6px 12px; border-radius: 999px; background: rgba(12, 9, 28, .45);
  border: 1px solid rgba(200, 180, 255, .12); backdrop-filter: blur(4px);
  transition: opacity .6s;
}
#horse-chip {
  position: absolute; left: 12px; right: 12px; bottom: 46px;
  display: none; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(34, 27, 66, .82), rgba(20, 16, 42, .9));
  border: 1px solid var(--line);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  backdrop-filter: blur(10px);
}
#horse-chip.on { display: flex; animation: chipIn .25s ease; }
@keyframes chipIn { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
#horse-chip .hc-name { font-size: 13.5px; font-weight: 700; }
#horse-chip .hc-meta { font-size: 10px; color: var(--dim); margin-top: 2px; }
#horse-chip .hc-actions { margin-left: auto; display: flex; gap: 6px; }
.btn-mini {
  padding: 6px 9px; border-radius: 10px; font-size: 11px; font-weight: 700;
  background: rgba(243, 205, 125, .14); color: #ffdf9e; border: 1px solid rgba(243, 205, 125, .3);
}
.btn-mini.alt { background: rgba(160, 140, 255, .16); color: #d9ccff; border-color: rgba(160, 140, 255, .3); }

/* ---------- 공통 패널 화면 ---------- */
.page { display: flex; flex-direction: column; height: 100%; padding: 2px 14px 10px; }
.page-head { padding: 2px 2px 8px; }
.page-title { font-family: "Iowan Old Style", "Palatino", serif; font-size: 19px; letter-spacing: .04em; }
.page-sub { font-size: 11px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
.scroll::-webkit-scrollbar { width: 0; }

.card {
  border-radius: 18px; padding: 12px; margin-bottom: 10px;
  background: linear-gradient(180deg, rgba(40, 32, 78, .72), rgba(22, 17, 45, .78));
  border: 1px solid var(--line);
}
.card.tight { padding: 10px; }

/* 교배 */
.slot-row { display: flex; align-items: center; gap: 8px; }
.slot {
  flex: 1 1 0; min-width: 0; border-radius: 16px; padding: 8px;
  background: rgba(12, 9, 30, .55); border: 1px dashed rgba(200, 180, 255, .25);
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 118px;
  justify-content: center;
}
.slot.filled { border-style: solid; border-color: rgba(243, 205, 125, .35); background: rgba(24, 18, 50, .7); }
.slot canvas { width: 86px; height: 74px; }
.slot .slot-name { font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.slot .slot-sub { font-size: 9px; color: var(--dim); }
.slot .empty-ico { font-size: 22px; opacity: .45; }
.slot .empty-txt { font-size: 10.5px; color: var(--dim); }
.vs { font-size: 10px; color: var(--gold); font-weight: 700; letter-spacing: .08em; }
.trait-hint { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.hint-chip {
  font-size: 10px; padding: 4px 7px; border-radius: 8px;
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08);
  color: #d9d0f5;
}
.hint-chip b { color: #fff; font-weight: 700; }
.btn-main {
  width: 100%; padding: 13px; border-radius: 15px; font-size: 14px; font-weight: 800; letter-spacing: .02em;
  color: #241729; background: linear-gradient(180deg, #ffe9ad, #f3cd7d 55%, #d8a94e);
  box-shadow: 0 6px 18px rgba(216, 169, 78, .3), inset 0 1px 0 rgba(255, 255, 255, .6);
}
.btn-main:disabled { background: rgba(255, 255, 255, .07); color: rgba(240, 232, 255, .35); box-shadow: none; border: 1px solid var(--line); }
.btn-main.ghost {
  background: rgba(255, 255, 255, .06); color: var(--ink);
  border: 1px solid var(--line); box-shadow: none;
}
.btn-main .cost { font-weight: 700; opacity: .8; font-size: 12px; }

/* 도감 */
.section-label { font-size: 11px; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; margin: 4px 0 8px; }
.trait-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.trait-cell {
  position: relative; border-radius: 13px; padding: 7px 4px 6px;
  background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .07);
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  min-height: 74px; justify-content: center;
}
.trait-cell.locked { opacity: .42; }
.trait-cell .sw { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 -4px 8px rgba(0,0,0,.35); }
.trait-cell .nm { font-size: 9px; line-height: 1.2; color: #e8e0ff; }
.trait-cell .lk { font-size: 14px; opacity: .6; }

/* 둥지 */
.egg-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.egg-grid.one { grid-template-columns: 1fr; }
.egg-grid.one .egg-card canvas { height: 190px; }
.egg-card {
  position: relative; border-radius: 18px; padding: 10px 8px 12px; text-align: center;
  background: radial-gradient(120% 90% at 50% 0%, rgba(120, 96, 220, .22), rgba(16, 12, 34, .85));
  border: 1px solid var(--line);
}
.egg-card canvas { width: 100%; height: 128px; display: block; }
.egg-card .egg-name { font-size: 11.5px; font-weight: 700; margin-top: -4px; }
.egg-card .egg-time { font-size: 10px; color: var(--gold); margin-top: 3px; }
.egg-bar { height: 5px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 7px; }
.egg-bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #b7a4ff, #ffd9a0); }
.hatch-later { margin-top: 6px; font-size: 9.5px; color: var(--dim); }
.empty-state { text-align: center; padding: 34px 10px; color: var(--dim); font-size: 12px; line-height: 1.7; }

/* 레이스 */
.race-stage { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
#race-canvas { display: block; width: 100%; height: 340px; }
.race-row { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; }
.race-pick {
  flex: 0 0 auto; width: 84px; border-radius: 14px; padding: 6px; text-align: center;
  background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08);
}
.race-pick.sel { border-color: var(--gold); background: rgba(243, 205, 125, .14); }
.race-pick canvas { width: 100%; height: 56px; display: block; }
.race-pick .rp-name { font-size: 10px; font-weight: 700; margin-top: -2px; }
.race-pick .rp-spd { font-size: 9px; color: var(--dim); }
.result-panel { text-align: center; padding: 10px 4px 2px; }
.result-rank { font-family: "Iowan Old Style", serif; font-size: 34px; color: var(--gold); line-height: 1; }
.result-reward { font-size: 12px; color: #ffe6b3; margin-top: 6px; }

/* 목록 */
.horse-list { display: flex; flex-direction: column; gap: 8px; }
.horse-row {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 15px;
  background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .07);
}
.horse-row canvas { width: 62px; height: 54px; flex: 0 0 auto; }
.horse-row .hr-main { min-width: 0; flex: 1 1 auto; }
.horse-row .hr-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.horse-row .hr-sub { font-size: 9.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grade-badge {
  font-size: 9px; font-weight: 800; letter-spacing: .06em; padding: 3px 6px; border-radius: 7px;
  border: 1px solid currentColor; text-transform: uppercase;
}

/* 하단 탭 */
#tabbar {
  position: relative; z-index: 6; display: flex; height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: linear-gradient(180deg, rgba(14, 10, 30, .55), rgba(10, 8, 24, .94) 45%);
  border-top: 1px solid rgba(190, 170, 255, .14);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.tab {
  flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 9.5px; color: rgba(214, 204, 246, .5); letter-spacing: .02em;
}
.tab .ico { width: 22px; height: 22px; display: block; opacity: .75; }
.tab.active { color: #ffe3a8; }
.tab.active .ico { opacity: 1; filter: drop-shadow(0 0 6px rgba(243, 205, 125, .65)); }
.tab .badge-dot {
  position: absolute; transform: translate(14px, -10px);
  width: 6px; height: 6px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 6px var(--rose);
}

/* 시트 */
#sheet-backdrop {
  position: absolute; inset: 0; z-index: 20; background: rgba(6, 4, 16, .62);
  opacity: 0; pointer-events: none; transition: opacity .22s;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
#sheet-backdrop.on { opacity: 1; pointer-events: auto; }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
  max-height: 86%; display: flex; flex-direction: column;
  transform: translateY(102%); transition: transform .28s cubic-bezier(.22,.9,.24,1);
  background: linear-gradient(180deg, #2a2156, #150f2f 70%);
  border-radius: 24px 24px 0 0; border-top: 1px solid rgba(210, 190, 255, .3);
  box-shadow: 0 -20px 50px rgba(0, 0, 0, .6);
  padding-bottom: env(safe-area-inset-bottom);
}
#sheet.on { transform: none; }
.sheet-handle { width: 42px; height: 4px; border-radius: 99px; background: rgba(220, 205, 255, .3); margin: 9px auto 4px; }
.sheet-body { overflow-y: auto; padding: 6px 16px 22px; }
.sheet-title { font-family: "Iowan Old Style", serif; font-size: 18px; text-align: center; margin: 2px 0 12px; }
.sheet-close { position: absolute; right: 12px; top: 12px; font-size: 18px; color: var(--dim); padding: 4px 8px; }

/* 말 상세 */
.detail-hero {
  position: relative; border-radius: 20px; padding: 8px 8px 4px; margin-bottom: 10px;
  background: radial-gradient(100% 80% at 50% 10%, rgba(140, 110, 255, .26), rgba(12, 9, 28, .2) 70%);
  border: 1px solid var(--line);
}
.detail-hero canvas { width: 100%; height: 180px; display: block; }
.detail-name-row { display: flex; align-items: baseline; gap: 8px; justify-content: center; margin-top: -6px; }
.detail-name { font-family: "Iowan Old Style", serif; font-size: 21px; letter-spacing: .02em; }
.detail-traits { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 8px 0 10px; }
.stat-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 11px; }
.stat-row .sl { width: 62px; color: var(--dim); }
.stat-bar { flex: 1 1 auto; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .09); overflow: hidden; }
.stat-bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #9a7bff, #ffd8a0); }
.stat-row .sv { width: 26px; text-align: right; color: #ffe4b3; font-weight: 700; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn-act {
  padding: 11px 8px; border-radius: 14px; font-size: 12px; font-weight: 700; text-align: center;
  background: rgba(255, 255, 255, .06); border: 1px solid var(--line);
}
.btn-act b { display: block; font-size: 9.5px; color: var(--dim); font-weight: 600; margin-top: 3px; }
.btn-act:disabled { opacity: .4; }

/* 선택 그리드 */
.pick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pick-card {
  border-radius: 16px; padding: 6px; text-align: center;
  background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08);
}
.pick-card canvas { width: 100%; height: 74px; display: block; }
.pick-card .pc-name { font-size: 11px; font-weight: 700; margin-top: -2px; }
.pick-card .pc-sub { font-size: 9px; color: var(--dim); }

/* 토스트 */
#toast {
  position: absolute; left: 50%; top: 62px; transform: translate(-50%, -14px);
  z-index: 40; padding: 9px 15px; border-radius: 12px; font-size: 12px; font-weight: 600;
  background: rgba(24, 18, 48, .95); border: 1px solid rgba(243, 205, 125, .35);
  color: #ffe9bd; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .5); max-width: 84%; text-align: center;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* 부화 연출 */
#hatch-fx {
  position: absolute; inset: 0; z-index: 30; display: none; place-items: center;
  background: radial-gradient(60% 50% at 50% 45%, rgba(90, 60, 180, .75), rgba(6, 4, 16, .985));
}
#hatch-fx.on { display: grid; }
#hatch-fx canvas { width: 100%; height: 100%; position: absolute; inset: 0; }
.hatch-inner { position: relative; text-align: center; z-index: 2; transform: translateY(-16vh); }
.hatch-inner .hk { font-size: 11px; letter-spacing: .3em; color: #ffe0a8; }
.hatch-inner .hn { font-family: "Iowan Old Style", serif; font-size: 26px; margin: 6px 0 2px; }
.hatch-inner .hs { font-size: 11.5px; color: var(--dim); }
.hatch-inner .hbtn { margin-top: 16px; padding: 11px 26px; }

/* 환영 */
#welcome {
  position: absolute; inset: 0; z-index: 50; display: grid; place-items: center;
  background: radial-gradient(70% 60% at 50% 40%, #2b1f5c, #0a0718 80%);
  transition: opacity .5s;
}
#welcome.off { opacity: 0; pointer-events: none; }
.welcome-inner { text-align: center; padding: 20px; width: 100%; max-width: 340px; }
.welcome-title {
  font-family: "Iowan Old Style", "Palatino", serif; font-size: 40px; letter-spacing: .16em;
  background: linear-gradient(180deg, #fff8e6, #f0c877 55%, #a97a2b);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(243, 205, 125, .35));
}
.welcome-sub { font-size: 11px; letter-spacing: .32em; color: #bda9ef; margin-top: 4px; }
#welcome-canvas { width: 100%; height: 240px; display: block; margin: 8px 0 4px; }
.welcome-copy { font-size: 12px; color: #ded4ff; line-height: 1.6; margin-bottom: 16px; text-wrap: balance; padding: 0 6px; }
.welcome-start { padding: 13px 32px; }

.hidden { display: none !important; }
.fade-in { animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">SKYHOOF<span class="brand-sub" id="brand-sub">스카이후프 · 천마 목장</span></span>
    </div>
    <div class="currencies">
      <button class="pill gold" id="pill-gold" aria-label="gold">
        <svg viewBox="0 0 24 24"><defs><radialGradient id="cg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff4c8"/><stop offset=".55" stop-color="#f3cd7d"/><stop offset="1" stop-color="#b1822f"/></radialGradient></defs><circle cx="12" cy="12" r="8.4" fill="url(#cg)"/><circle cx="12" cy="12" r="8.4" fill="none" stroke="#ffeab5" stroke-width="1" opacity=".7"/><path d="M12 7.6l1.35 2.9 3.05.36-2.25 2.1.6 3.04L12 14.5l-2.75 1.5.6-3.04-2.25-2.1 3.05-.36z" fill="#8a5f16" opacity=".55"/></svg>
        <span id="gold-val">0</span>
      </button>
      <button class="pill carrot" id="pill-carrot" aria-label="carrots">
        <svg viewBox="0 0 24 24"><defs><linearGradient id="cr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc08a"/><stop offset="1" stop-color="#e2652c"/></linearGradient></defs><path d="M9 8.5c3.2-1.4 6.4-.4 7.6 1.6 1.2 2-.2 4.6-3.4 6.4-2.6 1.5-5.5 2.3-6.6 1.6-1-.7-.4-3.3 1-5.9C8 10.7 8.4 9 9 8.5z" fill="url(#cr)"/><path d="M14.6 4.2c.5 1.3.4 2.4-.1 3.2M12.7 3.4c.2 1.4 0 2.6-.7 3.5M16.6 5.4c.4 1 .4 1.9 0 2.7" stroke="#8ed56b" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span id="carrot-val">0</span>

    [50, -76], [46, -88], [48, -100], [56, -108],
    [78, -104], [104, -102], [124, -106],
    [130, -120], [136, -138], [143, -154]
  ];
  const HORSE = spline(HORSE_PTS, true);

  const HEAD_CLIP = spline([[146, -160], [154, -157], [163, -147], [169, -136], [173, -128], [176, -123], [173, -119], [166, -118], [156, -123], [147, -130], [140, -135], [141, -148]], true);
  const NECK_CLIP = spline([[124, -106], [130, -120], [136, -138], [143, -154], [146, -160], [140, -135], [144, -123], [148, -109], [151, -97], [152, -88], [140, -96]], true);
  const BODY_CLIP = spline([[152, -88], [158, -82], [161, -73], [156, -64], [140, -58], [116, -57], [92, -58], [72, -62], [58, -68], [50, -76], [46, -88], [48, -100], [56, -108], [78, -104], [104, -102], [124, -106], [132, -100]], true);

  const CREST_PTS = [[124, -106], [130, -120], [136, -138], [143, -154], [146, -160]];
  const TOPLINE_PTS = [[124, -106], [104, -102], [78, -104], [56, -108], [48, -100]];
  const FACE_PTS = [[154, -157], [163, -147], [169, -136], [173, -128]];
  const THROAT_PTS = [[140, -135], [144, -123], [148, -109], [152, -88]];
  const MANE_CLIP = spline([[116, -104], [126, -112], [130, -120], [136, -138], [143, -154], [147, -162], [158, -158], [162, -94], [108, -94]], true);

  /* ---------- 그라디언트 ---------- */
  const gradCache = new Map();
  function bodyGrad(ctx, coat) {
    const key = 'b' + coat;
    if (gradCache.has(key)) return gradCache.get(key);
    const p = COATS[coat] || COATS.white;
    const g = ctx.createLinearGradient(0, -170, 0, -54);
    g.addColorStop(0, p.light);
    g.addColorStop(0.18, p.light);
    g.addColorStop(0.38, p.base);
    g.addColorStop(0.74, p.base);
    g.addColorStop(0.92, p.shade);
    g.addColorStop(1, p.deep);
    gradCache.set(key, g);
    return g;
  }
  function maneGrad(ctx, coat) {
    const key = 'm' + coat;
    if (gradCache.has(key)) return gradCache.get(key);
    const p = COATS[coat] || COATS.white;
    const g = ctx.createLinearGradient(150, -180, 60, -112);
    g.addColorStop(0, p.maneLight);
    g.addColorStop(0.4, p.mane);
    g.addColorStop(1, p.shade);
    gradCache.set(key, g);
    return g;
  }

  /* ---------- 몸 ---------- */
  function drawBody(ctx, g, t, phase, detail) {
    const p = COATS[g.coat] || COATS.white;
    const R = rng(g.seed || 1);

    ctx.fillStyle = bodyGrad(ctx, g.coat);
    ctx.fill(HORSE);
    ctx.save(); ctx.clip(BODY_CLIP); shadeBody(ctx, g, p, R, detail); ctx.restore();
    ctx.save(); ctx.clip(NECK_CLIP); shadeNeck(ctx, g, p, R, detail); ctx.restore();
    ctx.save(); ctx.clip(HEAD_CLIP); shadeHead(ctx, g, p, R, detail); ctx.restore();

    ctx.strokeStyle = 'rgba(22,14,40,.3)';
    ctx.lineWidth = 1.4;
    ctx.stroke(HORSE);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.45)';
    ctx.lineWidth = 1.3;
    ctx.stroke(spline(TOPLINE_PTS, false));
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.stroke(spline(CREST_PTS, false));
    ctx.strokeStyle = 'rgba(255,255,255,.14)';
    ctx.lineWidth = 1;
    ctx.stroke(spline(THROAT_PTS, false));

    ctx.strokeStyle = 'rgba(0,0,0,.09)';
    ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.moveTo(62, -60); ctx.quadraticCurveTo(48, -74, 56, -94); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(74, -57); ctx.quadraticCurveTo(62, -70, 68, -90); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(148, -88); ctx.quadraticCurveTo(140, -102, 128, -106); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,.05)';
    ctx.beginPath(); ctx.moveTo(84, -55); ctx.quadraticCurveTo(110, -51, 136, -56); ctx.stroke();

    drawArmor(ctx, g, t, detail);
    drawEye(ctx, g);
  }

  function shadeHead(ctx, g, p, R, detail) {
    const fore = ctx.createLinearGradient(148, -162, 172, -126);
    fore.addColorStop(0, 'rgba(255,255,255,.42)');
    fore.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fore;
    ctx.fillRect(138, -166, 46, 50);
    const cheek = ctx.createRadialGradient(156, -138, 1, 156, -138, 14);
    cheek.addColorStop(0, 'rgba(255,255,255,.45)');
    cheek.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = cheek;
    ctx.fillRect(142, -152, 32, 32);
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath();
    ctx.moveTo(150, -128);
    ctx.quadraticCurveTo(162, -118, 172, -117);
    ctx.quadraticCurveTo(162, -122, 151, -132);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.14)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(156, -124);
    ctx.quadraticCurveTo(166, -119, 174, -119);
    ctx.stroke();
    drawPattern(ctx, g, R, detail);
    if (g.coat === 'galaxy') drawGalaxy(ctx, R, detail);
  }

  function shadeBody(ctx, g, p, R, detail) {
    const hl = ctx.createLinearGradient(0, -112, 0, -72);
    hl.addColorStop(0, 'rgba(255,255,255,.38)');
    hl.addColorStop(0.5, 'rgba(255,255,255,.1)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fill(HORSE);

    const glow = (cx, cy, rx, ry, col, a) => {
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(rx, ry);
      const rg = ctx.createRadialGradient(0, 0, 1, 0, 0, 1);
      rg.addColorStop(0, col);
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = a;
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(0, 0, 1, 0, 6.283); ctx.fill();
      ctx.restore();
    };
    glow(148, -86, 30, 24, p.light, 0.5);
    glow(66, -84, 32, 26, p.light, 0.42);
    glow(104, -84, 36, 24, p.light, 0.14);

    const belly = ctx.createLinearGradient(0, -74, 0, -56);
    belly.addColorStop(0, 'rgba(0,0,0,0)');
    belly.addColorStop(1, p.deep);
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = belly;
    ctx.fillRect(40, -78, 126, 28);
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(0,0,0,.07)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(140, -104);
    ctx.quadraticCurveTo(152, -88, 148, -66);
    ctx.stroke();

    drawPattern(ctx, g, R, detail);
    if (g.coat === 'galaxy') drawGalaxy(ctx, R, detail);
  }

  function shadeNeck(ctx, g, p, R, detail) {
    const sh = ctx.createLinearGradient(138, -132, 100, -100);
    sh.addColorStop(0, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(0,0,0,.28)');
    ctx.fillStyle = sh;
    ctx.fill(HORSE);
    ctx.strokeStyle = 'rgba(0,0,0,.08)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(132, -130);
    ctx.quadraticCurveTo(142, -116, 150, -100);
    ctx.stroke();
    drawPattern(ctx, g, R, detail);
    if (g.coat === 'galaxy') drawGalaxy(ctx, R, detail);
  }

  function drawGalaxy(ctx, R, detail) {
    const neb = [[78, -80, 34, 'rgba(120,80,235,.42)'], [130, -72, 30, 'rgba(70,140,240,.35)'], [120, -126, 20, 'rgba(200,110,255,.4)'], [148, -60, 22, 'rgba(255,110,200,.22)']];
    for (const [x, y, r, c] of neb) {
      const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, c);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    if (!detail) return;
    ctx.save();
    ctx.globalAlpha = 0.26;
    ctx.translate(100, -82); ctx.rotate(0.42);
    const mg = ctx.createLinearGradient(-70, 0, 70, 0);
    mg.addColorStop(0, 'rgba(255,255,255,0)');
    mg.addColorStop(0.5, 'rgba(210,190,255,.9)');
    mg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.ellipse(0, 0, 72, 12, 0, 0, 6.283); ctx.fill();
    ctx.restore();
    for (let i = 0; i < 60; i++) {
      ctx.globalAlpha = 0.3 + R() * 0.7;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(42 + R() * 122, -158 + R() * 100, 0.35 + R() * 0.85, 0, 6.283); ctx.fill();
    }
    for (let i = 0; i < 7; i++) {
      ctx.globalAlpha = 0.7 + R() * 0.3;
      ctx.fillStyle = '#fff';
      star(ctx, 46 + R() * 110, -154 + R() * 92, 1 + R() * 1.4);
    }
    ctx.globalAlpha = 1;
  }

  function drawPattern(ctx, g, R, detail) {
    if (!detail) return;
    if (g.pattern === 'dapple') {
      for (let i = 0; i < 16; i++) {
        const x = 54 + R() * 100, y = -104 + R() * 44, r = 3.5 + R() * 6;
        const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, 'rgba(255,255,255,.4)');
        rg.addColorStop(0.55, 'rgba(255,255,255,.14)');
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      }
    } else if (g.pattern === 'starfall') {
      for (let i = 0; i < 28; i++) {
        const x = 48 + R() * 112, y = -158 + R() * 100, s = 0.8 + R() * 2;
        const rg = ctx.createRadialGradient(x, y, 0, x, y, s * 3.8);
        rg.addColorStop(0, 'rgba(255,255,255,.95)');
        rg.addColorStop(0.3, 'rgba(255,246,200,.5)');
        rg.addColorStop(1, 'rgba(255,240,180,0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(x, y, s * 3.8, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        star(ctx, x, y, s);
      }
    } else if (g.pattern === 'lightning') {
      const bolts = [[78, -104, 32], [112, -96, 28], [92, -66, 22]];
      for (const [bx, by, len] of bolts) {
        ctx.strokeStyle = 'rgba(255,255,255,.75)';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(bx, by);
        let x = bx, y = by;
        for (let i = 0; i < 4; i++) { x += (R() - 0.5) * len * 0.5; y += len / 4; ctx.lineTo(x, y); }
        ctx.stroke();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = 'rgba(160,220,255,.9)';
        ctx.lineWidth = 4.6;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    } else if (g.pattern === 'gradient') {
      const gr = ctx.createLinearGradient(40, -116, 164, -54);
      gr.addColorStop(0, 'rgba(255,255,255,.26)');
      gr.addColorStop(0.42, 'rgba(255,255,255,0)');
      gr.addColorStop(1, 'rgba(0,0,0,.14)');
      ctx.fillStyle = gr;
      ctx.fillRect(38, -168, 128, 120);
    }
  }

  function star(ctx, x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4 - Math.PI / 2;
      const rr = i % 2 ? r * 0.32 : r * 1.5;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawEye(ctx, g) {
    const p = COATS[g.coat] || COATS.white;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.1)';
    ctx.beginPath(); ctx.ellipse(160, -142, 5.6, 4.2, -0.35, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1d140e';
    ctx.beginPath(); ctx.ellipse(160.3, -142.1, 3.5, 3.0, -0.35, 0, 6.283); ctx.fill();
    const iris = ctx.createRadialGradient(160.5, -143, 0.4, 160.5, -142.4, 2.8);
    iris.addColorStop(0, p.eye);
    iris.addColorStop(1, '#120c08');
    ctx.fillStyle = iris;
    ctx.beginPath(); ctx.ellipse(160.4, -142.1, 2.6, 2.25, -0.35, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(161.7, -143.6, 1, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(159.2, -140.8, 0.55, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(20,12,8,.6)';
    ctx.lineWidth = 1.05;
    ctx.beginPath();
    ctx.moveTo(155, -144.4);
    ctx.quadraticCurveTo(159.2, -146.6, 164.6, -143.6);
    ctx.stroke();
    const bl = ctx.createRadialGradient(157, -134, 0, 157, -134, 8);
    bl.addColorStop(0, 'rgba(255,255,255,.24)');
    bl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bl;
    ctx.fillRect(149, -142, 16, 16);
    ctx.fillStyle = 'rgba(35,20,15,.5)';
    ctx.beginPath(); ctx.ellipse(171.6, -124.4, 1.9, 1.3, 0.5, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(60,35,25,.36)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(174.4, -120.4);
    ctx.quadraticCurveTo(169.8, -118.6, 166.6, -119.2);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 귀 ---------- */
  function drawEars(ctx, g, t) {
    const p = COATS[g.coat] || COATS.white;
    const sway = Math.sin(t * 1.6) * 1.2;
    const ear = (bx, by, tx, ty, w, fill, alpha) => {
      ctx.globalAlpha = alpha == null ? 1 : alpha;
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(bx - w, by);
      ctx.quadraticCurveTo(bx - w * 0.45, ty + (by - ty) * 0.38, tx, ty);
      ctx.quadraticCurveTo(bx + w * 0.9, ty + (by - ty) * 0.5, bx + w, by);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.2)';
      ctx.beginPath();
      ctx.moveTo(bx - w * 0.3, by - 2);
      ctx.quadraticCurveTo(bx - w * 0.05, ty + (by - ty) * 0.42, tx + 0.4, ty + 2);
      ctx.quadraticCurveTo(bx + w * 0.42, ty + (by - ty) * 0.52, bx + w * 0.45, by - 2);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    };
    ear(143, -159, 136 + sway, -173, 4.0, p.shade, 0.95);
    ear(149, -161, 145.5 + sway * 0.8, -175, 3.5, p.base, 1);
  }

  /* ---------- 갈기 ---------- */
  function drawMane(ctx, g, t) {
    const p = COATS[g.coat] || COATS.white;
    const R = rng((g.seed || 3) + 77);
    const grd = maneGrad(ctx, g.coat);
    const galaxy = g.coat === 'galaxy';

    ctx.save();
    ctx.clip(MANE_CLIP);
    ctx.fillStyle = p.mane;
    ctx.beginPath();
    ctx.moveTo(124, -105);
    ctx.quadraticCurveTo(130, -132, 141, -154);
    ctx.quadraticCurveTo(149, -165, 158, -166);
    ctx.quadraticCurveTo(147, -165, 136, -155);
    ctx.quadraticCurveTo(122, -136, 116, -108);
    ctx.closePath();
    ctx.fill();

    const locks = [
      { root: [126, -112], c: [143, -118], tip: [151, -130], w: 8.5 },
      { root: [130, -128], c: [146, -134], tip: [154, -147], w: 9 },
      { root: [136, -143], c: [150, -151], tip: [156, -163], w: 8.5 },
      { root: [144, -153], c: [155, -160], tip: [159, -171], w: 7.5 },
      { root: [134, -136], c: [120, -146], tip: [114, -158], w: 7 },
      { root: [128, -120], c: [112, -128], tip: [104, -139], w: 8 }
    ];
    for (let i = 0; i < locks.length; i++) {
      const L = locks[i];
      const sway = Math.sin(t * 1.6 + i * 0.7) * 2.2;
      const c = [L.c[0] - sway * 0.4, L.c[1]];
      const tip = [L.tip[0] - sway, L.tip[1]];
      ctx.fillStyle = grd;
      ctx.globalAlpha = 0.97;
      ctx.fill(flowLock(ctx, L.root, c, tip, L.w, L.w * 0.45, 14));
      ctx.strokeStyle = p.maneLight;
      ctx.globalAlpha = 0.32;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(L.root[0] - 1, L.root[1]);
      ctx.quadraticCurveTo(c[0] - 1, c[1] + 2, tip[0] - 1, tip[1] + 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < locks.length; i++) {
      const L = locks[i];
      const sway = Math.sin(t * 1.9 + i) * 2;
      ctx.fillStyle = grd;
      ctx.globalAlpha = 0.9;
      ctx.fill(flowLock(ctx, [L.root[0] - 2, L.root[1] + 3], [L.c[0] - 2, L.c[1] + 5], [L.tip[0] - 3 - sway, L.tip[1] + 6], L.w * 0.62, L.w * 0.3, 12));
      ctx.globalAlpha = 1;
    }

    const fs = Math.sin(t * 1.8) * 1.4;
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(147, -161);
    ctx.quadraticCurveTo(156, -154, 157 + fs, -141);
    ctx.quadraticCurveTo(161, -149, 158, -158);
    ctx.quadraticCurveTo(153, -164, 149, -165);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = p.maneLight;
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(148, -160);
    ctx.quadraticCurveTo(154, -150, 155 + fs, -142);
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (galaxy) {
      for (let i = 0; i < 10; i++) {
        ctx.globalAlpha = 0.4 + R() * 0.5;
        ctx.fillStyle = '#fff';
        star(ctx, 104 + R() * 56, -172 + R() * 62, 1 + R() * 1.5);
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  /* ---------- 꼬리 ---------- */
  function drawTail(ctx, g, t, phase) {
    const p = COATS[g.coat] || COATS.white;
    const R = rng((g.seed || 5) + 991);
    const bx = 46, by = -102;
    const sway = Math.sin(t * 1.5 + (phase || 0) * 0.25) * 5;
    const grd = ctx.createLinearGradient(bx, by, bx + 30, by + 70);
    grd.addColorStop(0, p.mane);
    grd.addColorStop(0.5, p.mane);
    grd.addColorStop(1, p.maneLight);

    ctx.fillStyle = p.mane;
    ctx.beginPath(); ctx.ellipse(bx + 3, by - 2, 10, 13, 0.35, 0, 6.283); ctx.fill();

    // 꼬리 볼륨
    ctx.fillStyle = grd;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.moveTo(bx + 5, by - 8);
    ctx.quadraticCurveTo(bx - 22, by + 8, bx - 28, by + 40);
    ctx.quadraticCurveTo(bx - 30, by + 66, bx - 18, by + 88);
    ctx.quadraticCurveTo(bx - 2, by + 70, bx + 6, by + 40);
    ctx.quadraticCurveTo(bx + 12, by + 12, bx + 5, by - 8);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    const locks = [
      { c: [bx - 16, by + 18], tip: [bx - 22, by + 44], w: 8 },
      { c: [bx - 22, by + 34], tip: [bx - 28, by + 66], w: 9 },
      { c: [bx - 20, by + 50], tip: [bx - 20, by + 84], w: 8.5 },
      { c: [bx - 12, by + 60], tip: [bx - 6, by + 92], w: 7 },
      { c: [bx - 2, by + 58], tip: [bx + 8, by + 86], w: 5.5 }
    ];
    for (let i = 0; i < locks.length; i++) {
      const L = locks[i];
      const sw = sway * (0.5 + i * 0.12);
      ctx.fillStyle = grd;
      ctx.globalAlpha = 0.96;
      ctx.fill(flowLock(ctx, [bx - 2, by + (i - 2.5) * 3], [L.c[0] + sw * 0.4, L.c[1] + sw * 0.5], [L.tip[0] + sw, L.tip[1] + sw], L.w, L.w * 0.5, 14));
      ctx.strokeStyle = 'rgba(255,255,255,.3)';
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(bx, by + (i - 2.5) * 3);
      ctx.quadraticCurveTo(L.c[0] + 2, L.c[1] + sw * 0.5, L.tip[0] + 2, L.tip[1] + sw);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- 다리 ---------- */
  function legShape(top, mid, bot, wTop, wMid, wBot) {
    const pts = [], widths = [];
    const N = 18;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const seg = t < 0.5 ? 0 : 1;
      const u = seg === 0 ? t / 0.5 : (t - 0.5) / 0.5;
      const a = seg === 0 ? top : mid, b = seg === 0 ? mid : bot;
      const m0x = seg === 0 ? (mid[0] - top[0]) * 0.45 : (bot[0] - top[0]) * 0.45;
      const m0y = seg === 0 ? (mid[1] - top[1]) * 0.45 : (bot[1] - top[1]) * 0.45;
      const m1x = seg === 0 ? (bot[0] - top[0]) * 0.45 : (bot[0] - mid[0]) * 0.9;
      const m1y = seg === 0 ? (bot[1] - top[1]) * 0.45 : (bot[1] - mid[1]) * 0.9;
      const u2 = u * u, u3 = u2 * u;
      const x = (2 * u3 - 3 * u2 + 1) * a[0] + (u3 - 2 * u2 + u) * m0x + (-2 * u3 + 3 * u2) * b[0] + (u3 - u2) * m1x;
      const y = (2 * u3 - 3 * u2 + 1) * a[1] + (u3 - 2 * u2 + u) * m0y + (-2 * u3 + 3 * u2) * b[1] + (u3 - u2) * m1y;
      const w = seg === 0 ? lerp(wTop, wMid, u) : lerp(wMid, wBot, Math.pow(u, 0.85));
      pts.push([x, y]);
      widths.push(w);
    }
    const left = [], right = [];
    for (let i = 0; i < pts.length; i++) {
      const prev = pts[Math.max(0, i - 1)], next = pts[Math.min(pts.length - 1, i + 1)];
      let dx = next[0] - prev[0], dy = next[1] - prev[1];
      const n = Math.hypot(dx, dy) || 1;
      const nx = -dy / n, ny = dx / n;
      left.push([pts[i][0] + nx * widths[i], pts[i][1] + ny * widths[i]]);
      right.push([pts[i][0] - nx * widths[i], pts[i][1] - ny * widths[i]]);
    }
    const p = new Path2D();
    p.moveTo(left[0][0], left[0][1]);
    for (let i = 1; i < left.length; i++) p.lineTo(left[i][0], left[i][1]);
    const last = pts[pts.length - 1];
    p.quadraticCurveTo(last[0] + 1, last[1] + 5.5, right[right.length - 1][0], right[right.length - 1][1]);
    for (let i = right.length - 1; i >= 0; i--) p.lineTo(right[i][0], right[i][1]);
    const first = pts[0];
    p.quadraticCurveTo(first[0], first[1] - 7, left[0][0], left[0][1]);
    p.closePath();
    return p;
  }

  function drawLeg(ctx, g, which, phase, detail, pose) {
    const p = COATS[g.coat] || COATS.white;
    const far = which.indexOf('far') >= 0;
    const hind = which.indexOf('hind') >= 0;
    const raised = pose === 'prance' && which === 'front-near';

    let top, mid, bot;
    if (raised) {
      top = [148, -94]; mid = [168, -68]; bot = [156, -50];
    } else if (hind) {
      top = [far ? 56 : 66, -94];
      mid = [far ? 44 : 54, -48];
      bot = [far ? 52 : 62, -14];
    } else {
      top = [far ? 140 : 150, -96];
      mid = [far ? 141 : 152, -46];
      bot = [far ? 141 : 152, -14];
    }

    const ph = phase + (far ? Math.PI : 0) + (hind ? 0.55 : 0);
    const sw = Math.sin(ph);
    const swing = raised ? 0 : sw * (hind ? 0.16 : 0.2);

    ctx.save();
    ctx.translate(top[0], top[1]);
    ctx.rotate(swing);
    ctx.translate(-top[0], -top[1]);
    if (!raised) ctx.translate(sw * (hind ? 7 : 9), 0);

    const shade = far ? p.deep : p.shade;
    const main = far ? p.shade : p.base;
    const gUp = ctx.createLinearGradient(top[0] - 14, top[1], top[0] + 10, mid[1]);
    gUp.addColorStop(0, far ? p.shade : p.light);
    gUp.addColorStop(0.45, main);
    gUp.addColorStop(1, shade);
    ctx.fillStyle = gUp;
    const shape = legShape(top, mid, bot, hind ? 18 : 15, hind ? 8.4 : 7.2, 4.8);
    ctx.fill(shape);

    if (hind) {
      ctx.fillStyle = main;
      ctx.beginPath(); ctx.ellipse(mid[0], mid[1], 6.4, 6.6, 0.2, 0, 6.283); ctx.fill();
    }

    if (detail) {
      ctx.strokeStyle = far ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.26)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(top[0] - 3, top[1] + 8);
      ctx.quadraticCurveTo(mid[0] - 2, mid[1] - 10, mid[0] - 1.5, mid[1]);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.1)';
      ctx.beginPath();
      ctx.moveTo(mid[0] + 3, mid[1] + 4);
      ctx.quadraticCurveTo(bot[0] + 2.6, bot[1] - 16, bot[0] + 2, bot[1] - 6);
      ctx.stroke();
    }

    const hx = bot[0], hy = bot[1];
    const hg = ctx.createLinearGradient(hx - 4, hy - 10, hx + 4, hy + 2);
    hg.addColorStop(0, p.hoof);
    hg.addColorStop(0.6, p.hoof);
    hg.addColorStop(1, 'rgba(0,0,0,.65)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(hx - 4.8, hy - 8);
    ctx.quadraticCurveTo(hx - 6.4, hy - 0.5, hx - 3.9, hy + 1.8);
    ctx.quadraticCurveTo(hx, hy + 3, hx + 4.4, hy + 1.8);
    ctx.quadraticCurveTo(hx + 6.2, hy - 0.5, hx + 4.8, hy - 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 0.7;
    ctx.stroke();

    if (detail && !far) {
      ctx.fillStyle = p.mane;
      ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.ellipse(bot[0] + 1, bot[1] - 4, 4.2, 4.8, 0.2, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  /* ---------- 날개 ---------- */
  function wingColors(g) {
    switch (g.wing) {
      case 'swan': return { a: '#ffffff', b: '#fdfaf2', c: '#ded4c4', edge: 'rgba(255,255,255,.95)', glow: 'rgba(255,250,235,.7)' };
      case 'obsidian': return { a: '#54476f', b: '#241d38', c: '#120e1e', edge: 'rgba(190,160,255,.8)', glow: 'rgba(130,90,220,.5)' };
      case 'dragon': return { a: '#6b4880', b: '#2b1a3c', c: '#150c20', edge: 'rgba(215,150,255,.8)', glow: 'rgba(180,90,240,.5)' };
      case 'flame': return { a: '#ffd88a', b: '#ff8a3c', c: '#c93a12', edge: 'rgba(255,228,170,.95)', glow: 'rgba(255,130,50,.55)' };
      case 'prism': return { a: '#ffd7f4', b: '#8ee6ff', c: '#6a4fd0', edge: 'rgba(255,255,255,.95)', glow: 'rgba(150,200,255,.55)' };
      case 'twin': return { a: '#f6faff', b: '#d6e4f7', c: '#a0b8d8', edge: 'rgba(255,255,255,.95)', glow: 'rgba(220,240,255,.6)' };
      default: return { a: '#fff', b: '#eee', c: '#ccc', edge: '#fff', glow: 'rgba(255,255,255,.5)' };
    }
  }

  function feather(ctx, base, ang, len, w, bend) {
    const dx = Math.cos(ang), dy = -Math.sin(ang);
    const nx = -dy, ny = dx;
    const tip = [base[0] + dx * len + nx * bend, base[1] + dy * len + ny * bend];
    const c1 = [base[0] + dx * len * 0.3 + nx * w, base[1] + dy * len * 0.3 + ny * w];
    const c2 = [base[0] + dx * len * 0.72 + nx * w * 0.92, base[1] + dy * len * 0.72 + ny * w * 0.92];
    const c3 = [base[0] + dx * len * 0.7 - nx * w * 0.15, base[1] + dy * len * 0.7 - ny * w * 0.15];
    const p = new Path2D();
    p.moveTo(base[0] + nx * w * 0.4, base[1] + ny * w * 0.4);
    p.quadraticCurveTo(c1[0], c1[1], c2[0], c2[1]);
    p.quadraticCurveTo((c2[0] + tip[0]) / 2 + nx * w * 0.28, (c2[1] + tip[1]) / 2 + ny * w * 0.28, tip[0], tip[1]);
    p.quadraticCurveTo(c3[0] - nx * w * 0.12, c3[1] - ny * w * 0.12, base[0] - nx * w * 0.2, base[1] - ny * w * 0.2);
    p.closePath();
    return p;
  }

  function crystalBlade(ctx, base, ang, len, w) {
    const dx = Math.cos(ang), dy = -Math.sin(ang);
    const nx = -dy, ny = dx;
    const tip = [base[0] + dx * len, base[1] + dy * len];
    const m1 = [base[0] + dx * len * 0.45 + nx * w, base[1] + dy * len * 0.45 + ny * w];
    const m2 = [base[0] + dx * len * 0.8 + nx * w * 0.55, base[1] + dy * len * 0.8 + ny * w * 0.55];
    const p = new Path2D();
    p.moveTo(base[0] + nx * w * 0.25, base[1] + ny * w * 0.25);
    p.quadraticCurveTo(m1[0], m1[1], m2[0], m2[1]);
    p.lineTo(tip[0], tip[1]);
    p.quadraticCurveTo(m2[0] - nx * w * 0.9, m2[1] - ny * w * 0.9, base[0] - nx * w * 0.25, base[1] - ny * w * 0.25);
    p.closePath();
    return p;
  }

  function drawCrystalWing(ctx, g, t, phase) {
    const flap = Math.sin(t * 1.6 + (phase || 0) * 0.3) * 0.03;
    const A = [138, -98], B = [104, -132], C = [64, -152];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const grad = ctx.createLinearGradient(A[0], A[1], C[0], C[1]);
    grad.addColorStop(0, 'rgba(110,80,220,.35)');
    grad.addColorStop(0.35, 'rgba(120,190,255,.55)');
    grad.addColorStop(0.7, 'rgba(220,150,255,.6)');
    grad.addColorStop(1, 'rgba(255,225,250,.75)');
    const N = 10;
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1);
      const bx = quad(A[0], B[0], C[0], u);
      const by = quad(A[1], B[1], C[1], u);
      const ang = ((196 - 28 * u)) * Math.PI / 180 + flap;
      const len = 34 + 54 * Math.pow(u, 0.7);
      const w = 7.5 + u * 2.5;
      const pth = crystalBlade(ctx, [bx, by], ang, len, w);
      ctx.globalAlpha = 0.5 + u * 0.28;
      ctx.fillStyle = grad;
      ctx.fill(pth);
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 1.1;
      ctx.stroke(pth);
    }
    for (let i = 0; i < 6; i++) {
      const u = i / 5;
      const bx = quad(A[0], B[0], C[0], u * 0.7);
      const by = quad(A[1], B[1], C[1], u * 0.7);
      const pth = crystalBlade(ctx, [bx, by], ((200 - 22 * u) * Math.PI) / 180 + flap, 26 + 16 * u, 5 + u * 2);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = 'rgba(190,240,255,.55)';
      ctx.fill(pth);
    }
    const rg = ctx.createRadialGradient(A[0], A[1], 2, A[0], A[1], 40);
    rg.addColorStop(0, 'rgba(200,240,255,.7)');
    rg.addColorStop(1, 'rgba(120,160,255,0)');
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = rg;
    ctx.fillRect(A[0] - 42, A[1] - 42, 84, 84);
    ctx.restore();
  }

  function drawWingFan(ctx, g, t, phase) {
    const c = wingColors(g);
    const flap = Math.sin(t * 1.9 + (phase || 0) * 0.3) * 0.03;
    const A = [138, -98], B = [106, -134], C = [66, -154];
    const grad = ctx.createLinearGradient(A[0], A[1], C[0], C[1]);
    grad.addColorStop(0, c.c);
    grad.addColorStop(0.35, c.b);
    grad.addColorStop(0.8, c.a);
    grad.addColorStop(1, c.a);

    ctx.save();
    for (let row = 0; row < 3; row++) {
      const count = row === 0 ? 10 : row === 1 ? 8 : 6;
      for (let i = 0; i < count; i++) {
        const u = i / (count - 1);
        const uu = clamp(u * 0.9 + row * 0.03, 0, 1);
        const bx = quad(A[0], B[0], C[0], uu);
        const by = quad(A[1], B[1], C[1], uu);
        const ang = ((198 - 34 * uu) + (row === 1 ? 3 : row === 2 ? 7 : 0)) * Math.PI / 180 + flap;
        const len = (20 + 40 * Math.pow(uu, 0.85)) * (row === 0 ? 1 : row === 1 ? 0.66 : 0.4);
        const w = (row === 0 ? 7.6 : row === 1 ? 6.6 : 5.2) * (1 - uu * 0.15);
        ctx.fillStyle = grad;
        ctx.globalAlpha = row === 0 ? 0.93 : 0.97;
        const pth = feather(ctx, [bx, by], ang, len, w, 2.4);
        ctx.fill(pth);
        if (row === 0) {
          ctx.strokeStyle = c.edge;
          ctx.globalAlpha = 0.2;
          ctx.lineWidth = 0.8;
          ctx.stroke(pth);
        }
        ctx.globalAlpha = 1;
      }
    }
    ctx.fillStyle = c.c;
    ctx.beginPath();
    ctx.moveTo(A[0] - 3, A[1] + 6);
    ctx.quadraticCurveTo(A[0] + 8, A[1] - 16, B[0] - 2, B[1] - 2);
    ctx.quadraticCurveTo(B[0] + 4, B[1] + 8, A[0] - 5, A[1] + 7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = c.edge;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(A[0] - 2, A[1] + 4);
    ctx.quadraticCurveTo(A[0] + 4, A[1] - 22, B[0] - 1, B[1]);
    ctx.quadraticCurveTo((B[0] + C[0]) / 2 - 1, (B[1] + C[1]) / 2 - 2, C[0], C[1]);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawDragonWing(ctx, g, t, phase) {
    const c = wingColors(g);
    const base = [138, -96];
    const flap = Math.sin(t * 1.7 + (phase || 0) * 0.3) * 3;
    ctx.save();
    const grad = ctx.createLinearGradient(base[0], base[1], base[0] - 58, base[1] + 20);
    grad.addColorStop(0, c.c);
    grad.addColorStop(0.45, c.b);
    grad.addColorStop(1, c.a);
    const fingers = [
      [base[0] - 24, base[1] - 66 + flap],
      [base[0] - 56, base[1] - 30 + flap * 0.8],
      [base[0] - 60, base[1] + 8 + flap * 0.5],
      [base[0] - 34, base[1] + 26]
    ];
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.94;
    ctx.beginPath();
    ctx.moveTo(base[0] + 2, base[1] + 2);
    for (let i = 0; i < fingers.length; i++) {
      const f = fingers[i];
      const prev = i === 0 ? base : fingers[i - 1];
      ctx.quadraticCurveTo((prev[0] + f[0]) / 2 + 4, (prev[1] + f[1]) / 2 + 6, f[0], f[1]);
      const mx = (f[0] * 0.5 + base[0] * 0.5), my = (f[1] * 0.5 + base[1] * 0.5);
      ctx.quadraticCurveTo(mx - 6, my + 12, mx * 0.9 + 4, my * 0.9 + 14);
    }
    ctx.quadraticCurveTo(base[0] - 30, base[1] + 30, base[0] + 2, base[1] + 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = c.edge;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(25,12,35,.7)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (const f of fingers) {
      ctx.beginPath();
      ctx.moveTo(base[0] + 1, base[1] + 2);
      ctx.quadraticCurveTo((base[0] + f[0]) / 2 - 1, (base[1] + f[1]) / 2 - 8, f[0], f[1]);
      ctx.stroke();
    }
    ctx.fillStyle = c.edge;
    for (const f of fingers) {
      ctx.beginPath(); ctx.ellipse(f[0], f[1], 2.4, 3, 0.4, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = c.c;
    ctx.beginPath(); ctx.ellipse(base[0] - 1, base[1] + 2, 8, 10, -0.3, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  function drawWing(ctx, g, t, phase, layer) {
    if (!g.wing || g.wing === 'none') return;
    if (g.wing === 'dragon') {
      if (layer === 'front') drawDragonWing(ctx, g, t, phase);
      return;
    }
    if (g.wing === 'prism') {
      if (layer === 'back') {
        ctx.save(); ctx.globalAlpha = 0.35; ctx.translate(-9, 7); ctx.scale(0.9, 0.9);
        drawCrystalWing(ctx, g, t, phase + 0.4); ctx.restore();
        return;
      }
      drawCrystalWing(ctx, g, t, phase);
      const R = rng((g.seed || 4) + 5);
      for (let i = 0; i < 12; i++) {
        const a = t * 0.8 + i * 0.9;
        const x = 100 + Math.cos(a) * (30 + R() * 26);
        const y = -134 + Math.sin(a * 1.3) * (22 + R() * 18);
        ctx.globalAlpha = 0.35 + Math.sin(t * 3 + i) * 0.35;
        ctx.fillStyle = '#fff';
        star(ctx, x, y, 1 + R() * 1.8);
      }
      ctx.globalAlpha = 1;
      return;
    }
    if (layer === 'back') {
      ctx.save();
      ctx.globalAlpha = 0.42;
      ctx.translate(-9, 7);
      ctx.scale(0.9, 0.9);
      drawWingFan(ctx, g, t * 0.95, phase + 0.5);
      ctx.restore();
      return;
    }
    drawWingFan(ctx, g, t, phase);
    if (g.wing === 'twin') {
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.translate(-4, 14);
      ctx.rotate(-0.22);
      ctx.scale(0.7, 0.7);
      drawWingFan(ctx, g, t * 1.1, phase + 1.2);
      ctx.restore();
    }
    if (g.wing === 'flame') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.18 + Math.sin(t * 3) * 0.05;
      const pg = ctx.createLinearGradient(120, -160, 70, -90);
      pg.addColorStop(0, '#ffe6a4');
      pg.addColorStop(0.5, '#ff9a3c');
      pg.addColorStop(1, '#ff5a1e');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.ellipse(104, -126, 40, 36, 0.5, 0, 6.283); ctx.fill();
      ctx.restore();
    }
  }

  function drawWingGlow(ctx, g, t) {
    if (g.wing === 'none' || g.wing === 'swan' || g.wing === 'twin') return;
    const c = wingColors(g);
    const rg = ctx.createRadialGradient(108, -126, 2, 108, -126, 58);
    rg.addColorStop(0, c.glow);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3 + Math.sin(t * 2.4) * 0.07;
    ctx.fillStyle = rg;
    ctx.fillRect(50, -186, 122, 122);
    ctx.restore();
  }

  /* ---------- 뿔 ---------- */
  function drawHorn(ctx, g, t) {
    if (!g.horn || g.horn === 'none') return;
    const kind = g.horn;
    const cols = {
      ivory: ['#fffdf4', '#efe3c6', '#c8b48c'],
      gold: ['#fff6c0', '#f2c65f', '#a5741d'],
      crystal: ['#ffffff', '#c8f2ff', '#8f7cf0']
    }[kind];
    const base = [152, -156];
    const tip = kind === 'crystal' ? [166, -198] : [167, -194];
    ctx.save();
    const rg = ctx.createRadialGradient(tip[0] - 4, tip[1] + 10, 1, tip[0] - 4, tip[1] + 10, 24);
    rg.addColorStop(0, kind === 'gold' ? 'rgba(255,225,140,.8)' : kind === 'crystal' ? 'rgba(200,245,255,.85)' : 'rgba(255,250,225,.55)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(tip[0] - 28, tip[1] - 20, 54, 56);

    const grad = ctx.createLinearGradient(base[0], base[1], tip[0], tip[1]);
    grad.addColorStop(0, cols[2]);
    grad.addColorStop(0.4, cols[1]);
    grad.addColorStop(1, cols[0]);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(base[0] - 7, base[1] + 2);
    ctx.quadraticCurveTo(base[0] + 1, base[1] - 20, tip[0], tip[1]);
    ctx.quadraticCurveTo(base[0] + 13, base[1] - 14, base[0] + 6, base[1] + 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = kind === 'crystal' ? 'rgba(150,190,255,.55)' : 'rgba(110,80,40,.3)';
    ctx.lineWidth = 0.9;
    for (let i = 1; i <= 6; i++) {
      const u = i / 7.4;
      const y = lerp(base[1], tip[1], u);
      const x = lerp(base[0] + 1, tip[0], u);
      const w = 6.2 * (1 - u);
      ctx.beginPath();
      ctx.moveTo(x - w, y + 1.6);
      ctx.quadraticCurveTo(x, y - 1.6, x + w, y + 0.2);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(base[0] - 3, base[1] - 3);
    ctx.quadraticCurveTo(base[0] + 4, base[1] - 18, tip[0] - 1.6, tip[1] + 4);
    ctx.stroke();
    if (kind === 'crystal') {
      ctx.globalAlpha = 0.55 + Math.sin(t * 3) * 0.2;
      ctx.fillStyle = '#fff';
      star(ctx, tip[0] + 2, tip[1] + 3, 3.6);
      star(ctx, base[0] + 6, base[1] - 16, 2.2);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  /* ---------- 흐르는 갈기/꼬리 잠금 ---------- */
  function flowLock(ctx, p0, p1, p2, w0, w1, steps) {
    const N = steps || 12;
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const mt = 1 - t;
      const x = mt * mt * p0[0] + 2 * mt * t * p1[0] + t * t * p2[0];
      const y = mt * mt * p0[1] + 2 * mt * t * p1[1] + t * t * p2[1];
      pts.push([x, y]);

    const left = [], right = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const prev = pts[Math.max(0, i - 1)], next = pts[Math.min(N, i + 1)];
      let dx = next[0] - prev[0], dy = next[1] - prev[1];
      const n = Math.hypot(dx, dy) || 1;
      const nx = -dy / n, ny = dx / n;

      right.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
    }
    const p = new Path2D();
    p.moveTo(left[0][0], left[0][1]);
    for (let i = 1; i <= N; i++) p.lineTo(left[i][0], left[i][1]);
    p.lineTo(pts[N][0], pts[N][1]);
    for (let i = N; i >= 0; i--) p.lineTo(right[i][0], right[i][1]);
    p.closePath();
    return p;

  function drawAura(ctx, g, t, detail) {
    const grade = gradeFromTraits(g);

    gl.addColorStop(1, 'rgba(255,255,255,0)');

    ctx.fillRect(-62, -96, 124, 116);

      for (let i = 0; i < 16; i++) {
        ctx.globalAlpha = 0.45 + R() * 0.55;
        ctx.fillStyle = '#fff';

        ctx.fillStyle = p.shade;
        ctx.beginPath(); ctx.arc(-18 + R() * 36, -68 + R() * 54, 2 + R() * 3, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    const cracks = [
      [0.34, 'M -2 -74 L -7 -58 L 2 -50 L -4 -38'],
      [0.62, 'M -2 -74 L -7 -58 L 2 -50 L -4 -38 M 6 -44 L 14 -36 L 8 -26'],
      [0.84, 'M -2 -74 L -7 -58 L 2 -50 L -4 -38 M 6 -44 L 14 -36 L 8 -26 M -20 -30 L -10 -22 L -14 -12']

    hg.addColorStop(1, 'rgba(255,255,255,0)');

<script>/* Skyhoof — 게임 본체 */
(function () {
  'use strict';
  const HA = window.HorseArt;
  const SAVE_KEY = 'skyhoof.save.v1';
  const MAX_EGGS = 4;

  function t(key, vars) {

    if (vars) for (const k in vars) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);

  }
  const traitName = (kind, key) => {

    const item = tables[kind][key];
    return item ? (state.lang === 'en' ? item.en : item.ko) : key;
  };
  const gradeName = (g) => state.lang === 'en' ? HA.GRADES[g].en : HA.GRADES[g].ko;

  /* ---------------- 상태 ---------------- */
  const NAME_PAIRS = [
    ['별빛', 'Starlight'], ['은하', 'Galaxy'], ['서리', 'Frost'], ['노을', 'Dusk'],
    ['천둥', 'Thunder'], ['달빛', 'Moonlight'], ['바람', 'Zephyr'], ['설원', 'Snowfield'],
    ['금빛', 'Golden'], ['화염', 'Ember'], ['빙하', 'Glacier'], ['유성', 'Meteor'],
    ['청람', 'Indigo'], ['홍련', 'Lotus'], ['백야', 'White Night'], ['여명', 'Dawn'],
    ['구름', 'Cloud'], ['이슬', 'Dew'], ['안개', 'Mist'], ['오로라', 'Aurora'],
    ['혜성', 'Comet'], ['진주', 'Pearl'], ['심연', 'Abyss'], ['황혼', 'Twilight'],

    ['세라핌', 'Seraphim'], ['아르카', 'Arka'], ['벨루스', 'Bellus'], ['티르', 'Tyr'],

  let uid = 1;

  function nameFor(used) {

  const state = {
    lang: 'ko',
    gold: 0, carrots: 0, hearts: 0, slots: 3,

  function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 220); }

  function weightedPick(entries) {

    for (const e of entries) { r -= e[1]; if (r <= 0) return e[0]; }

  const ranch = { cv: null, ctx: null, w: 0, h: 0, bg: null, stars: [], flies: [], hearts: [], last: 0, time: 0, ready: false };

  function buildScene() {
    const cv = $('ranch-canvas');
    if (!cv) return;
    const box = cv.getBoundingClientRect();
    const { ctx, w, h } = fitCanvas(cv, box.width, box.height);
    ranch.cv = cv; ranch.ctx = ctx; ranch.w = w; ranch.h = h;
    ranch.stars = Array.from({ length: 80 }, () => ({ x: Math.random() * w, y: Math.random() * h * 0.55, r: Math.random() * 1.5 + 0.3, p: Math.random() * 6.28, s: rand(0.6, 2.2) }));
    ranch.motes = Array.from({ length: 26 }, () => ({ x: Math.random() * w, y: h * 0.35 + Math.random() * h * 0.6, p: Math.random() * 6.28, s: rand(0.15, 0.5), r: rand(0.6, 1.8) }));
    ranch.flies = Array.from({ length: 14 }, () => ({ x: Math.random() * w, y: h * 0.55 + Math.random() * h * 0.4, p: Math.random() * 6.28, s: rand(0.3, 0.9), a: rand(0.3, 0.8) }));
    // 배경 캐시
    const off = document.createElement('canvas');
    const r = dpr();
    off.width = Math.round(w * r); off.height = Math.round(h * r);
    const b = off.getContext('2d');
    b.setTransform(r, 0, 0, r, 0, 0);
    paintBackground(b, w, h);
    ranch.bg = off;
    ranch.ready = true;
  }

  function paintBackground(b, w, h) {
    const horizon = h * 0.56;
    const sky = b.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, '#0a0820');
    sky.addColorStop(0.4, '#1c1442');
    sky.addColorStop(0.72, '#3b2a68');
    sky.addColorStop(1, '#7d5686');
    b.fillStyle = sky; b.fillRect(0, 0, w, horizon + 2);

    // 달
    const mx = w * 0.78, my = h * 0.16, mr = Math.min(w, h) * 0.055;
    const mg = b.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 5.5);
    mg.addColorStop(0, 'rgba(255, 243, 214, .55)');
    mg.addColorStop(0.28, 'rgba(255, 226, 190, .18)');
    mg.addColorStop(1, 'rgba(255, 220, 180, 0)');
    b.fillStyle = mg; b.fillRect(mx - mr * 6, my - mr * 6, mr * 12, mr * 12);
    const moon = b.createRadialGradient(mx - mr * 0.3, my - mr * 0.35, mr * 0.1, mx, my, mr);
    moon.addColorStop(0, '#fffdf4');
    moon.addColorStop(1, '#f0dfb8');
    b.fillStyle = moon;
    b.beginPath(); b.arc(mx, my, mr, 0, 6.283); b.fill();

    // 오로라
    for (let i = 0; i < 3; i++) {
      const g = b.createLinearGradient(0, h * 0.2, 0, h * 0.56);
      const hue = ['120, 255, 220', '170, 150, 255', '255, 170, 220'][i];
      g.addColorStop(0, 'rgba(' + hue + ', 0)');
      g.addColorStop(0.5, 'rgba(' + hue + ', .10)');
      g.addColorStop(1, 'rgba(' + hue + ', 0)');
      b.fillStyle = g;
      b.beginPath();
      b.moveTo(0, h * 0.56);
      b.bezierCurveTo(w * 0.2, h * (0.28 + i * 0.04), w * 0.62, h * (0.5 - i * 0.05), w, h * 0.3);
      b.lineTo(w, h * 0.56);
      b.closePath();
      b.fill();
    }

    // 먼 산맥
    const ridge = (baseY, amp, color, seed) => {
      b.fillStyle = color;
      b.beginPath();
      b.moveTo(0, baseY);
      const n = 9;
      for (let i = 0; i <= n; i++) {
        const x = (w / n) * i;
        const y = baseY - amp * (0.35 + Math.abs(Math.sin(i * 1.7 + seed)) * 0.9);
        b.lineTo(x, y);
      }
      b.lineTo(w, baseY + 30); b.lineTo(0, baseY + 30); b.closePath(); b.fill();
    };
    ridge(h * 0.56, h * 0.1, '#241a4a', 0.7);
    ridge(h * 0.575, h * 0.06, '#1b1338', 2.1);

    // 떠 있는 섬
    const island = (x, y, s, alpha) => {
      b.save();
      b.globalAlpha = alpha;
      b.fillStyle = '#1a1336';
      b.beginPath();
      b.moveTo(x - 26 * s, y);
      b.quadraticCurveTo(x, y + 20 * s, x + 26 * s, y);
      b.quadraticCurveTo(x + 10 * s, y - 7 * s, x, y - 7 * s);
      b.quadraticCurveTo(x - 10 * s, y - 7 * s, x - 26 * s, y);
      b.fill();
      b.fillStyle = '#2f5a48';
      b.beginPath(); b.ellipse(x, y - 4 * s, 25 * s, 6 * s, 0, 0, 6.283); b.fill();
      b.fillStyle = 'rgba(150, 255, 210, .25)';
      b.beginPath(); b.ellipse(x, y - 6 * s, 18 * s, 3 * s, 0, 0, 6.283); b.fill();
      b.restore();
    };
    island(w * 0.2, h * 0.36, 0.9, 0.85);
    island(w * 0.86, h * 0.44, 0.62, 0.6);

    // 초원
    const meadow = b.createLinearGradient(0, horizon - 10, 0, h);
    meadow.addColorStop(0, '#2c4c3d');
    meadow.addColorStop(0.35, '#1c3a2c');
    meadow.addColorStop(1, '#0d2219');
    b.fillStyle = meadow;
    b.beginPath();
    b.moveTo(0, horizon + 4);
    b.bezierCurveTo(w * 0.3, horizon - 18, w * 0.68, horizon + 12, w, horizon - 6);
    b.lineTo(w, h); b.lineTo(0, h); b.closePath();
    b.fill();

    // 안개 띠
    const fog = b.createLinearGradient(0, horizon - 12, 0, horizon + 40);
    fog.addColorStop(0, 'rgba(180, 160, 220, 0)');
    fog.addColorStop(0.5, 'rgba(190, 175, 235, .16)');
    fog.addColorStop(1, 'rgba(190, 175, 235, 0)');
    b.fillStyle = fog; b.fillRect(0, horizon - 12, w, 54);

    // 풀
    for (let i = 0; i < 150; i++) {
      const x = Math.random() * w;
      const y = horizon + 10 + Math.random() * (h - horizon - 10);
      const len = 3 + Math.random() * 9;
      const sway = (Math.random() - 0.5) * 4;
      b.strokeStyle = 'rgba(' + (80 + Math.random() * 60) + ', ' + (150 + Math.random() * 70) + ', ' + (120 + Math.random() * 50) + ', ' + (0.16 + Math.random() * 0.24) + ')';
      b.lineWidth = 1;
      b.beginPath();
      b.moveTo(x, y);
      b.quadraticCurveTo(x + sway, y - len * 0.6, x + sway * 1.6, y - len);
      b.stroke();
    }

    // 울타리
    const fenceY = h * 0.74;
    b.strokeStyle = 'rgba(120, 96, 76, .55)';
    b.fillStyle = 'rgba(86, 66, 52, .5)';
    for (let x = -10; x < w + 20; x += 46) {
      const hh = 26 + Math.sin(x) * 2;
      b.fillRect(x, fenceY - hh, 5, hh);
      b.beginPath(); b.arc(x + 2.5, fenceY - hh, 2.5, 0, 6.283); b.fill();
    }
    b.fillRect(0, fenceY - 19, w, 3.5);
    b.fillRect(0, fenceY - 7, w, 3.5);

    // 은은한 빛무리 (중앙)
    const glow = b.createRadialGradient(w * 0.5, h * 0.62, 10, w * 0.5, h * 0.62, w * 0.7);
    glow.addColorStop(0, 'rgba(180, 230, 255, .06)');
    glow.addColorStop(1, 'rgba(180, 230, 255, 0)');
    b.fillStyle = glow; b.fillRect(0, 0, w, h);
  }

  const groundY = (py) => ranch.h * (0.6 + py * 0.33);
  const horseScale = (py) => 0.36 + py * 0.54;

  function ranchFrame(ts) {
    if (!ranch.ready) return;
    if (state.tab !== 'ranch' || document.hidden) { ranch.last = ts; requestAnimationFrame(ranchFrame); return; }
    const dt = Math.min(0.05, (ts - (ranch.last || ts)) / 1000);
    ranch.last = ts;
    ranch.time += dt;
    const {  ctx, w, h } = ranch;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(ranch.bg, 0, 0, w, h);

    // 별 반짝임
    for (const s of ranch.stars) {
      const a = 0.25 + Math.abs(Math.sin(ranch.time * s.s + s.p)) * 0.7;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 오로라 흐름
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 2; i++) {
      const g = ctx.createLinearGradient(0, h * 0.2, 0, h * 0.56);
      const hue = i ? '170, 150, 255' : '120, 255, 220';
      g.addColorStop(0, 'rgba(' + hue + ', 0)');
      g.addColorStop(0.55, 'rgba(' + hue + ', .07)');
      g.addColorStop(1, 'rgba(' + hue + ', 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.56);
      const off = Math.sin(ranch.time * 0.12 + i) * 0.08;
      ctx.bezierCurveTo(w * (0.22 + off), h * (0.3 + i * 0.04), w * (0.6 - off), h * (0.48 - i * 0.04), w, h * 0.32);
      ctx.lineTo(w, h * 0.56); ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // 반딧불
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const f of ranch.flies) {
      const x = f.x + Math.sin(ranch.time * f.s + f.p) * 16;
      const y = f.y + Math.cos(ranch.time * f.s * 0.8 + f.p) * 10;
      const a = f.a * (0.45 + 0.55 * Math.abs(Math.sin(ranch.time * 1.4 + f.p)));
      const g = ctx.createRadialGradient(x, y, 0, x, y, 6);
      g.addColorStop(0, 'rgba(220, 255, 210, ' + a + ')');
      g.addColorStop(1, 'rgba(160, 255, 200, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.283); ctx.fill();
    }
    ctx.restore();

    // 떠도는 티끌
    ctx.save();
    for (const m of ranch.motes) {
      const x = m.x + Math.sin(ranch.time * m.s + m.p) * 22;
      const y = m.y - (ranch.time * 5 * m.s) % 40;
      ctx.globalAlpha = 0.12 + 0.25 * Math.abs(Math.sin(ranch.time * 0.7 + m.p));
      ctx.fillStyle = '#dfe9ff';
      ctx.beginPath(); ctx.arc(x, y, m.r, 0, 6.283); ctx.fill();
    }
    ctx.restore();

    // 말 업데이트
    const list = state.horses.slice().sort((a, b) => a.py - b.py);
    for (const horse of state.horses) {
      horse.px += (horse.facing * horse.pace * dt * 0.035);
      if (horse.px > 0.94) { horse.px = 0.94; horse.facing = -1; }
      if (horse.px < 0.04) { horse.px = 0.04; horse.facing = 1; }
      horse.drawPhase = (horse.drawPhase || 0) + dt * (1.6 + horse.pace);
    }
    // 겹침 완화
    for (let i = 0; i < state.horses.length; i++) {
      for (let j = i + 1; j < state.horses.length; j++) {
        const A = state.horses[i], B = state.horses[j];
        const dx = B.px - A.px, dy = (B.py - A.py) * 1.4;
        const d = Math.hypot(dx, dy);
        if (d < 0.16 && d > 0.0001) {
          const push = (0.16 - d) * 0.9;
          const ux = dx / d, uy = dy / d;
          A.px = clamp(A.px - ux * push, 0.04, 0.94);
          B.px = clamp(B.px + ux * push, 0.04, 0.94);
          A.py = clamp(A.py - uy * push, 0.05, 0.95);
          B.py = clamp(B.py + uy * push, 0.05, 0.95);
        }
      }
    }
    for (const horse of list) {
      const sc = horseScale(horse.py);
      const gy = groundY(horse.py);
      const hx = clamp(horse.px * w, 96 * sc + 4, w - 80 * sc - 4);
      horse._x = hx; horse._y = gy; horse._sc = sc;
      // 발밑 빛
      ctx.save();
      const rg = ctx.createRadialGradient(hx, gy, 2, hx, gy, 60 * sc);
      rg.addColorStop(0, 'rgba(190, 230, 255, .12)');
      rg.addColorStop(1, 'rgba(190, 230, 255, 0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(hx, gy, 60 * sc, 16 * sc, 0, 0, 6.283); ctx.fill();
      ctx.restore();
      HA.drawHorse(ctx, horse, {
        x: hx - 90 * sc, y: gy, scale: sc, t: ranch.time, phase: horse.drawPhase,
        facing: horse.facing, pose: horse.id === state.horses[0].id ? 'prance' : 'walk',
        detail: sc > 0.45
      });
    }

    // 하트 파티클
    for (let i = ranch.hearts.length - 1; i >= 0; i--) {
      const p = ranch.hearts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 26 * dt; p.life -= dt;
      if (p.life <= 0) { ranch.hearts.splice(i, 1); continue; }
      const a = clamp(p.life / p.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.scale(p.s, p.s);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(0, 3);
      ctx.bezierCurveTo(-6, -3, -3, -8, 0, -4.5);
      ctx.bezierCurveTo(3, -8, 6, -3, 0, 3);
      ctx.fill();
      ctx.restore();
    }

    // 선택된 말 링
    const selHorse = state.horses.find(h => h.id === chipHorseId);
    if (selHorse && selHorse._x != null) {
      ctx.save();
      ctx.strokeStyle = 'rgba(243, 205, 125, .55)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(selHorse._x, selHorse._y, 46 * selHorse._sc, 11 * selHorse._sc, 0, 0, 6.283);
      ctx.stroke();
      ctx.restore();
    }

    requestAnimationFrame(ranchFrame);
  }

  function spawnHearts(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      ranch.hearts.push({
        x: x + rand(-16, 16), y: y + rand(-10, 4),
        vx: rand(-14, 14), vy: rand(-52, -26),
        life: rand(0.7, 1.3), max: 1.3, s: rand(0.8, 1.6), color: color || '#ff9ec4'
      });
    }
  }

  /* ---------------- UI 공통 ---------------- */
  let chipHorseId = null;

  function updateCurrency() {
    $('gold-val').textContent = state.gold.toLocaleString();
    $('carrot-val').textContent = state.carrots;
    $('heart-val').textContent = state.hearts;
  }

  let toastTimer = null;
  function toast(msg) {
    const n = $('toast');
    n.textContent = msg;
    n.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => n.classList.remove('on'), 2000);
  }

  function openSheet(html, opts) {
    const body = $('sheet-body');
    body.innerHTML = html;
    $('sheet').classList.add('on');
    $('sheet-backdrop').classList.add('on');
    if (opts && opts.onMount) opts.onMount(body);
  }
  function closeSheet() {
    $('sheet').classList.remove('on');
    $('sheet-backdrop').classList.remove('on');
  }

  function gradeBadge(g) {
    const c = HA.GRADES[g];
    return '<span class="grade-badge" style="color:' + c.color + ';background:' + hexA(c.color, 0.14) + '">' + gradeName(g) + '</span>';
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function horseLabel(h) { return state.lang === 'en' ? h.name.en : h.name.ko; }
  function horseTraits(h) {
    return [traitName('coat', h.coat), traitName('pattern', h.pattern), traitName('horn', h.horn), traitName('wing', h.wing)];
  }

  /* ---------------- 탭 ---------------- */
  const TABS = [
    { id: 'ranch', ico: '<path d="M4 20V9.7c0-1 .4-1.9 1.2-2.5L12 2l6.8 5.2c.8.6 1.2 1.5 1.2 2.5V20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9 20v-5.2c0-1.5 1.3-2.8 3-2.8s3 1.3 3 2.8V20" fill="none" stroke="currentColor" stroke-width="1.7"/>' },
    { id: 'breed', ico: '<path d="M12 20s-7-4.2-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.8-7 9-7 9z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 11h5M12 8.5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' },
    { id: 'nest', ico: '<path d="M12 3c3.2 2.4 5 5 5 8.2C17 15.5 14.8 18 12 18s-5-2.5-5-6.8C7 8 8.8 5.4 12 3z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 20.5h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' },
    { id: 'race', ico: '<path d="M5 21V4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5 5h12l-2.4 4L17 13H5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>' },
    { id: 'codex', ico: '<path d="M4 5.5c3-1.3 5.4-1.3 8 .4 2.6-1.7 5-1.7 8-.4V19c-3-1.3-5.4-1.3-8 .4-2.6-1.7-5-1.7-8-.4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5.9V19.4" stroke="currentColor" stroke-width="1.4"/>' }
  ];

  function buildTabs() {
    const nav = $('tabbar');
    nav.innerHTML = '';
    for (const tabDef of TABS) {
      const b = el('button', 'tab' + (state.tab === tabDef.id ? ' active' : ''));
      b.dataset.tab = tabDef.id;
      b.innerHTML = '<svg class="ico" viewBox="0 0 24 24">' + tabDef.ico + '</svg><span>' + t('tab_' + tabDef.id) + '</span>';
      b.addEventListener('click', () => setTab(tabDef.id));
      nav.appendChild(b);
    }
  }

  function setTab(id) {
    if (race.running && id !== 'race') { race.running = false; cancelAnimationFrame(race.raf); }
    state.tab = id;
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + id));
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    if (id === 'ranch') { buildScene(); }
    if (id === 'breed') renderBreed();
    if (id === 'nest') renderNest();
    if (id === 'race') renderRace();
    if (id === 'codex') renderCodex();
    closeSheet();
    queueSave();
  }

  /* ---------------- 목장 상호작용 ---------------- */
  function tapRanch(ev) {
    const cv = $('ranch-canvas');
    const box = cv.getBoundingClientRect();
    const x = ev.clientX - box.left, y = ev.clientY - box.top;
    let best = null, bestD = 1e9;
    for (const h of state.horses) {
      if (h._x == null) continue;
      const sc = h._sc;
      const dx = (x - h._x) / (82 * sc);
      const dy = (y - (h._y - 58 * sc)) / (86 * sc);
      const d = dx * dx + dy * dy;
      if (d < 2.2 && d < bestD) { best = h; bestD = d; }
    }
    if (best) {
      petHorse(best, x, y);
    } else {
      hideChip();
    }
  }

  function petHorse(h, x, y) {
    const now = performance.now();
    if (!h._petAt || now - h._petAt > 700) {
      h._petAt = now;
      h.affection = Math.min(8, (h.affection || 0) + 1);
      spawnHearts(x, y, 4, '#ff9ec4');
      let gained = false;
      if (h.affection >= 8) {
        h.affection = 0;
        state.hearts += 1; gained = true;
        updateCurrency();
        toast(t('petGain', { h: 1 }));
      } else if (Math.random() < 0.22) {
        const g = 1 + Math.floor(Math.random() * 3);
        state.gold += g; updateCurrency(); queueSave();
        spawnHearts(x, y - 14, 2, '#ffe08a');
      }
      queueSave();
    }
    showChip(h);
  }

  function showChip(h) {
    chipHorseId = h.id;
    $('horse-chip').classList.add('on');
    $('hc-name').textContent = horseLabel(h);
    $('hc-meta').textContent = 'Lv.' + h.level + ' · ' + gradeName(HA.gradeFromTraits(h));
    $('hc-feed').textContent = t('chipFeed');
    $('hc-open').textContent = t('chipOpen');
    $('hc-feed').onclick = () => feedHorse(h);
    $('hc-open').onclick = () => openHorse(h);
    clearTimeout(showChip._t);
    showChip._t = setTimeout(hideChip, 6000);
  }
  function hideChip() {
    chipHorseId = null;
    $('horse-chip').classList.remove('on');
  }

  /* ---------------- 말 상세 ---------------- */
  function openHorse(h) {
    const grade = HA.gradeFromTraits(h);
    const st = h.stats;
    const expNeed = expNeeded(h.level);
    const html = `
      <div class="sheet-title">${horseLabel(h)}</div>
      <div class="detail-hero"><canvas id="detail-cv"></canvas></div>
      <div class="detail-name-row">${gradeBadge(grade)}<span style="font-size:10px;color:var(--dim)">Lv.${h.level}</span></div>
      <div class="detail-traits">${horseTraits(h).map(x => '<span class="hint-chip">' + x + '</span>').join('')}</div>
      <div class="stat-row"><span class="sl">${t('speed')}</span><div class="stat-bar"><i style="width:${clamp(st.speed, 0, 100)}%"></i></div><span class="sv">${st.speed}</span></div>
      <div class="stat-row"><span class="sl">${t('grace')}</span><div class="stat-bar"><i style="width:${clamp(st.grace, 0, 100)}%"></i></div><span class="sv">${st.grace}</span></div>
      <div class="stat-row"><span class="sl">${t('charm')}</span><div class="stat-bar"><i style="width:${clamp(st.charm, 0, 100)}%"></i></div><span class="sv">${st.charm}</span></div>
      <div class="stat-row"><span class="sl">${t('detailExp')}</span><div class="stat-bar"><i style="width:${Math.round(h.exp / expNeed * 100)}%"></i></div><span class="sv">${Math.floor(h.exp)}</span></div>
      <div class="action-grid">
        <button class="btn-act" id="act-feed">${t('actFeed')}<b>${t('actFeedSub')}</b></button>
        <button class="btn-act" id="act-train">${t('actTrain')}<b>${t('actTrainSub')}</b></button>
        <button class="btn-act" id="act-race">${t('actRace')}<b>${t('actRaceSub')}</b></button>

        body.querySelector('#act-train').onclick = () => { trainHorse(h); openHorse(h); };

        body.querySelector('#act-breed').onclick = () => { state.sel.a = h.id; closeSheet(); setTab('breed'); };
      }
    });

  function expNeeded(level) { return 40 + level * 22; }

  function feedHorse(h) {
    if (state.carrots <= 0) { toast(t('noCarrot')); return; }
    state.carrots--;
    h.exp += 26;
    const stat = pick(['speed', 'grace', 'charm']);
    h.stats[stat] = Math.min(99, h.stats[stat] + 1);
    applyLevel(h);
    spawnHearts((h._x || ranch.w / 2), (h._y || ranch.h * 0.7) - 50, 3, '#ffd08a');
    updateCurrency(); queueSave();
    toast(t('statUp', { s: t(stat), n: 1 }));
  }

  function trainHorse(h) {
    if (state.hearts < 3) { toast(t('noHearts')); return; }
    if (state.gold < 20) { toast(t('notEnoughGold')); return; }
    state.hearts -= 3; state.gold -= 20;
    h.exp += 34;
    const stat = pick(['speed', 'grace', 'charm']);
    h.stats[stat] = Math.min(99, h.stats[stat] + 2);
    applyLevel(h);
    updateCurrency(); queueSave();
    toast(t('trainDone') + ' · ' + t('statUp', { s: t(stat), n: 2 }));
  }

  function applyLevel(h) {
    let need = expNeeded(h.level);
    while (h.exp >= need) {
      h.exp -= need;
      h.level++;
      h.stats.speed = Math.min(99, h.stats.speed + 1);
      h.stats.grace = Math.min(99, h.stats.grace + 1);
      h.stats.charm = Math.min(99, h.stats.charm + 1);
      need = expNeeded(h.level);
      toast(t('levelUp', { n: h.level }));
      spawnHearts((h._x || ranch.w / 2), (h._y || ranch.h * 0.7) - 60, 6, '#ffe08a');
    }
    queueSave();
  }

  function slotHTML(h, key) {
    if (h) {
      return '<button class="slot filled" data-slot="' + key + '"><canvas id="slot-cv-' + key + '"></canvas>' +
        '<div class="slot-name">' + horseLabel(h) + '</div><div class="slot-sub">Lv.' + h.level + ' · ' + gradeName(HA.gradeFromTraits(h)) + '</div></button>';
