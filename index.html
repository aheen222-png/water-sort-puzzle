<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d24">
<title>워터 소트 퍼즐</title>
<link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/aheen222-png/water-sort-puzzle/main/apple-touch-icon.png">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/aheen222-png/water-sort-puzzle/main/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="워터 소트">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ================= 기본 ================= */
:root{
  /* 병 폭: 화면 폭/높이 중 작은 쪽에 맞춰 자동 조절 (아이폰 세로 ~ 데스크톱) */
  --bw: clamp(26px, min(11vw, 5.2vh), 62px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; height:100%; max-height:100%; overflow:hidden; overscroll-behavior:none; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  color:#e9efff; background:#060a1c; overflow:hidden; overscroll-behavior:none;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
/* Safari 의 safe-area-inset-bottom 을 px 로 재기 위한 보이지 않는 자 */
#safeProbe{ position:fixed; left:0; bottom:0; width:0; height:env(safe-area-inset-bottom, 0px); visibility:hidden; pointer-events:none; }
#app{
  position:relative; display:flex; flex-direction:column;
  height:100vh; height:100dvh; max-height:100vh; max-height:100dvh; overflow:hidden;
  /* 위/좌/우만 safe-area 를 비우고, 아래쪽 여백은 fitStage() 가 --stage-h 로 정확히 계산한다 */
  padding:max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left));
  background:
    radial-gradient(105% 62% at 50% -8%, rgba(96,116,255,.36), rgba(96,116,255,0) 72%),
    radial-gradient(75% 55% at 50% 108%, rgba(128,64,224,.28), rgba(128,64,224,0) 72%),
    radial-gradient(130% 95% at 50% 42%, #1b2458 0%, #121a45 42%, #0a0e2b 76%, #05081a 100%);
}
/* 배경의 은은한 빛무리 */
#app::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(38% 26% at 50% 30%, rgba(122,150,255,.16), rgba(122,150,255,0) 70%),
    radial-gradient(46% 30% at 50% 74%, rgba(150,90,255,.12), rgba(150,90,255,0) 70%);
  mix-blend-mode:screen;
}

/* ================= 상단 HUD ================= */
.hud{
  position:relative; z-index:12; flex:0 0 auto;
  display:flex; align-items:center; gap:6px;
  padding:2px 4px 0;
}
.hud-mid{ display:flex; align-items:center; gap:5px; margin:0 auto; }
.pill{
  appearance:none; -webkit-appearance:none; border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
  color:#dde6ff; font:inherit; font-size:12.5px; font-weight:650; letter-spacing:-.2px;
  padding:7px 11px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;
  cursor:pointer; white-space:nowrap;
  box-shadow:0 3px 12px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .12s ease, background .18s ease, border-color .18s ease;
}
.pill:active{ transform:scale(.94); background:rgba(255,255,255,.2); }
.pill b{ font-weight:800; color:#fff; }
.pill.stat{ padding:5px 9px; font-size:11.5px; font-weight:600; background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.1); cursor:default; }
.pill.stat:active{ transform:none; background:rgba(255,255,255,.06); }
.pill.stat .dim{ opacity:.62; }
.pill.icon{ width:32px; height:32px; padding:0; justify-content:center; }
.pill.icon svg{ width:17px; height:17px; display:block; }
.pill.icon .slash{ display:none; }
.pill.icon.muted .wave{ display:none; }
.pill.icon.muted .slash{ display:block; }

/* ================= 무대 ================= */
.stage{
  position:relative; z-index:5; flex:1 1 auto; min-height:0;
  box-sizing:border-box;
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center; justify-items:center;
  column-gap:clamp(2px, 1.2vw, 16px);
  width:100%; max-width:840px; margin:0 auto;
  padding:4px clamp(2px, 1.4vw, 12px);
}
.col{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:var(--rowgap, clamp(8px, 2.1vh, 22px)); width:100%; }
.col.center{ width:auto; }

/* 선반 */
.shelf{ display:flex; flex-direction:column; align-items:stretch; width:max-content; max-width:100%; }
.rack{ display:flex; align-items:flex-end; justify-content:center; gap:calc(var(--bw) * .10); padding:0 calc(var(--bw) * .10); }
.plank{
  position:relative; height:calc(var(--bw) * .17); min-height:7px; margin-top:-1px;
  border-radius:4px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 7px, rgba(255,255,255,.055) 7px 14px),
    linear-gradient(180deg, #ddb377 0%, #c8934f 26%, #9d6c36 64%, #7b4f24 100%);
  box-shadow:0 9px 20px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,239,206,.6), inset 0 -1px 0 rgba(0,0,0,.35);
}
.plank::after{
  content:""; position:absolute; left:1px; right:1px; top:100%; height:4px;
  border-radius:0 0 4px 4px;
  background:linear-gradient(180deg, #6d451f, #472a11);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}

/* ================= 병 ================= */
.bottle{
  --cap:4;
  position:relative; width:var(--bw);
  --slot:calc(var(--bw) * .80);
  display:flex; flex-direction:column; align-items:center;
  transform-origin:50% 100%; will-change:transform;
  transition:transform .14s cubic-bezier(.18,.9,.28,1), filter .2s ease;
  cursor:pointer;
}
.bottle.tall{ width:calc(var(--bw) * .90); --slot:var(--tall-slot, calc(var(--bw) * .70)); }

/* 목 */
.neck{
  position:relative; z-index:0; width:44%; height:calc(var(--bw) * .25);
  margin-bottom:-2px; border-radius:4px 4px 0 0;
  background:
    linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.30) 38%, rgba(255,255,255,.03) 82%),
    linear-gradient(180deg, rgba(176,206,255,.22), rgba(34,54,116,.34));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.32), inset 0 2px 0 rgba(255,255,255,.40);
}
.neck::before{
  content:""; position:absolute; left:-2px; right:-2px; top:-2px; height:4px;
  border-radius:3px;
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.14));
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.bottle.tall .neck{ height:calc(var(--bw) * .26); width:42%; }

/* 몸통(유리) */
.body{
  position:relative; width:100%; overflow:hidden;
  height:calc(var(--slot) * var(--cap));
  border-radius:22% 22% 28% 28% / 9% 9% 13% 13%;
  background:
    linear-gradient(90deg, rgba(255,255,255,.20), rgba(255,255,255,.03) 24%, rgba(255,255,255,0) 52%, rgba(255,255,255,.05) 74%, rgba(255,255,255,.22)),
    linear-gradient(180deg, rgba(150,182,255,.13), rgba(96,126,224,.05) 45%, rgba(46,66,150,.10));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 -10px 16px rgba(0,0,0,.22),
    inset 0 8px 12px rgba(255,255,255,.06),
    0 6px 16px rgba(0,0,0,.34);
  transition:box-shadow .28s ease;
}
.bottle.tall .body{ border-radius:18% 18% 22% 22% / 4% 4% 6% 6%; }

/* 액체 */
.band{
  position:absolute; left:1.5px; right:1.5px; z-index:1;
  background-color:var(--c);
  transition:height .13s cubic-bezier(.3,0,.2,1), bottom .13s cubic-bezier(.3,0,.2,1);
  will-change:height;
}
.band::after{
  content:""; position:absolute; inset:0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.26) 0%, rgba(255,255,255,.20) 14%, rgba(255,255,255,.03) 38%, rgba(0,0,0,.06) 68%, rgba(0,0,0,.30) 100%),
    linear-gradient(180deg, rgba(255,255,255,.055), rgba(0,0,0,.05));
}
.band.top::before{
  content:""; position:absolute; left:0; right:0; top:-1px; height:4px; z-index:2;
  background:linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0));
  border-radius:50%;
}
/* 유리 광택 */
.shine{
  position:absolute; inset:0; z-index:3; pointer-events:none; border-radius:inherit;
  background:linear-gradient(90deg,
    rgba(255,255,255,.26) 0%, rgba(255,255,255,.08) 3%, rgba(255,255,255,0) 11%,
    rgba(255,255,255,0) 68%, rgba(255,255,255,.10) 80%, rgba(255,255,255,.24) 97%, rgba(255,255,255,.06) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.26), inset 0 6px 8px rgba(255,255,255,.07), inset 0 -12px 18px rgba(0,0,0,.16);
}
.tick{
  position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--bw) * .40); font-weight:800; color:rgba(255,255,255,.92);
  text-shadow:0 2px 8px rgba(0,0,0,.45); opacity:0; transform:scale(.55);
  transition:opacity .3s ease, transform .3s cubic-bezier(.2,1.5,.4,1);
  pointer-events:none; padding-bottom:calc(var(--bw) * .1);
}

/* 상태 */
.bottle.selected{ transform:translateY(-9px); }
.bottle.selected .body{
  box-shadow:
    inset 0 0 0 2px rgba(176,214,255,.85),
    inset 0 -10px 16px rgba(0,0,0,.2),
    0 0 22px rgba(120,180,255,.62), 0 8px 22px rgba(0,0,0,.4);
}
/* 뚜껑 (완성하면 닫힘) */
.cap{
  position:absolute; left:50%; top:calc(var(--bw) * .00); z-index:5;
  width:52%; height:calc(var(--bw) * .19); min-height:5px;
  border-radius:3px 3px 2px 2px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.38) 30%, rgba(255,255,255,.06) 60%, rgba(0,0,0,.24)),
    linear-gradient(180deg, #f2dbb8 0%, #dcb37f 42%, #bd9057 74%, #9a6f3c 100%);
  box-shadow:0 3px 7px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 0 rgba(0,0,0,.2);
  opacity:0; pointer-events:none;
  transform:translate(-50%,-78%) scale(.78);
  transition:transform .19s cubic-bezier(.2,1.6,.42,1), opacity .12s ease;
}
.bottle.tall .cap{ width:47%; }
.bottle.capped .cap{ opacity:1; transform:translate(-50%,0) scale(1); }
.bottle.capped .neck{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.32), inset 0 2px 0 rgba(255,255,255,.40), 0 0 12px rgba(0,0,0,.25); }

/* 가운데 긴 병 = 목표 병 */
.bottle.goal .body{
  box-shadow:
    inset 0 0 0 2px var(--goal),
    inset 0 -10px 16px rgba(0,0,0,.22),
    0 0 16px -4px var(--goal), 0 6px 16px rgba(0,0,0,.34);
}
.goal-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; gap:calc(var(--bw) * .17); }
.goal-badge{
  display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  padding:4px 8px 4px 6px; border-radius:999px;
  font-size:11px; font-weight:750; letter-spacing:-.25px; color:#e9f0ff;
  background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.2);
  box-shadow:0 4px 14px rgba(0,0,0,.34);
}
.goal-badge i{
  width:9px; height:9px; border-radius:50%; background:var(--c);
  box-shadow:0 0 7px var(--c);
}
.goal-badge b{ color:#fff; font-weight:800; }
.goal-badge .goal-count{ font-size:10px; font-weight:800; color:rgba(255,255,255,.72); letter-spacing:.2px; }

.bottle.done .body{
  box-shadow:
    inset 0 0 0 1.5px rgba(186,255,214,.75),
    inset 0 0 20px rgba(150,255,200,.22),
    0 0 20px rgba(110,240,170,.36), 0 6px 16px rgba(0,0,0,.34);
}
.bottle.done .tick{ opacity:1; transform:scale(1); }
.bottle.pouring{ transition:transform .075s cubic-bezier(.25,.85,.3,1); z-index:60; }
.bottle.return{ transition:transform .085s cubic-bezier(.2,.95,.3,1); }
@keyframes shakeX{
  0%,100%{ transform:translateX(0) } 20%{ transform:translateX(-4px) } 45%{ transform:translateX(4px) }
  70%{ transform:translateX(-2px) } 88%{ transform:translateX(2px) }
}
.bottle.shake{ animation:shakeX .26s ease; }

/* 물줄기 */
.stream-layer{ position:fixed; inset:0; z-index:55; pointer-events:none; }
.stream-wrap{ position:fixed; width:0; height:0; transform-origin:top center; }
.stream{
  position:relative; width:5px; margin-left:-2.5px; height:calc(var(--bw) * 1.5);
  border-radius:3px; transform-origin:top center;
  background:linear-gradient(180deg, var(--c) 0%, var(--c) 72%, transparent 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.3));
  animation:streamDrop .22s cubic-bezier(.2,.6,.4,1) forwards;
}
@keyframes streamDrop{
  0%{ transform:scaleY(.15); opacity:0 }
  25%{ opacity:.95 }
  70%{ opacity:.9 }
  100%{ transform:scaleY(1); opacity:0 }
}
.splash{
  position:fixed; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%;
  border:2px solid rgba(255,255,255,.75); animation:splashOut .24s ease-out forwards;
}
@keyframes splashOut{
  0%{ transform:scale(.3); opacity:.9 } 100%{ transform:scale(1.7); opacity:0 }
}

/* ============ 보조 줄 (상태 문구 + 다시하기/새 판) — 무대 위, HUD 아래 ============ */
.bar{
  position:relative; z-index:12; flex:0 0 auto;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:4px 4px 0;
}
.status{
  margin:0; width:100%; text-align:center;
  font-size:11.5px; line-height:16px; height:16px;
  color:rgba(214,226,255,.66); letter-spacing:-.2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:opacity .2s ease;
}
.bar-btns{ display:flex; gap:8px; justify-content:center; }
.pill.sm{ padding:5px 13px; font-size:11.5px; font-weight:650; }

/* ================= 클리어 ================= */
.overlay{
  position:fixed; inset:0; z-index:80; display:grid; place-items:center;
  background:radial-gradient(60% 50% at 50% 45%, rgba(60,80,190,.35), rgba(4,6,18,.78));
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
}
.overlay.hidden{ display:none; }
.card{
  position:relative; width:min(84vw, 330px); padding:26px 22px 22px; border-radius:26px; text-align:center;
  background:linear-gradient(175deg, #29356f, #1a2150 60%, #11163a);
  box-shadow:0 26px 64px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 1px rgba(255,255,255,.09);
  animation:pop .4s cubic-bezier(.2,1.35,.4,1);
}
@keyframes pop{ 0%{ transform:scale(.86); opacity:0 } 100%{ transform:scale(1); opacity:1 } }
.card .emoji{ font-size:34px; line-height:1; margin-bottom:6px; animation:bob 1.6s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
.card h2{ margin:0 0 6px; font-size:21px; letter-spacing:-.5px; }
.card p{ margin:0 0 18px; font-size:12.5px; color:rgba(214,226,255,.72); }
.btn-primary{
  appearance:none; border:0; width:100%; padding:13px 16px; border-radius:15px;
  font:inherit; font-size:15px; font-weight:800; letter-spacing:-.3px; color:#0b1230;
  background:linear-gradient(180deg, #a8f0c8, #4fdca0);
  box-shadow:0 10px 22px rgba(64,220,150,.28), inset 0 1px 0 rgba(255,255,255,.7);
  cursor:pointer; transition:transform .12s ease;
}
.btn-primary:active{ transform:scale(.96); }
.confetti{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.confetti i{ position:absolute; top:-24px; width:9px; height:9px; border-radius:2px; animation:fall linear forwards; }
@keyframes fall{ 0%{ transform:translateY(0) rotate(0deg); opacity:1 } 100%{ transform:translateY(112vh) rotate(720deg); opacity:.85 } }

/* ================= 반응형 보정 ================= */
@media (max-height:640px){
  .bar{ gap:4px; }
  .status{ height:14px; line-height:14px; font-size:10.5px; }
  .pill{ padding:6px 9px; font-size:11.5px; }
  .pill.sm{ padding:5px 11px; font-size:11px; }
}
@media (prefers-reduced-motion:reduce){
  .bottle,.band,.tick,.card,.card .emoji{ transition-duration:.08s !important; animation:none !important; }
}
</style>
</head>
<body>
<div id="safeProbe" aria-hidden="true"></div>
<div id="app">

  <header class="hud">
    <button class="pill icon" id="btnSound" aria-label="소리 끄기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="currentColor" stroke="none"/>
        <path class="wave" d="M15.6 8.6a4.8 4.8 0 0 1 0 6.8"/>
        <path class="wave" d="M18.2 6.3a8.2 8.2 0 0 1 0 11.4"/>
        <path class="slash" d="M15.5 9.2l5.4 5.6M20.9 9.2l-5.4 5.6"/>
      </svg>
    </button>
    <div class="hud-mid">
      <span class="pill stat">레벨 <b id="lvNum">1</b></span>
      <span class="pill stat">이동 <b id="moveNum">0</b></span>
      <span class="pill stat"><span class="dim">완성</span> <b id="doneNum">0</b>/<b id="totalNum">4</b></span>
    </div>
    <button class="pill" id="btnUndo">되돌리기</button>
  </header>

  <div class="bar">
    <p class="status" id="status">병을 눌러 고른 뒤, 다른 병을 눌러 부으세요</p>
    <div class="bar-btns">
      <button class="pill sm" id="btnRestart">다시하기</button>
      <button class="pill sm" id="btnNew">새 판</button>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="col left" id="colLeft"></div>
    <div class="col center" id="colCenter"></div>
    <div class="col right" id="colRight"></div>
  </main>

  <div class="stream-layer" id="streamLayer"></div>

  <div class="overlay hidden" id="overlay">
    <div class="confetti" id="confetti"></div>
    <div class="card">
      <div class="emoji">✨</div>
      <h2>스테이지 클리어!</h2>
      <p id="clearSub">레벨 1 · 12번 만에 완성</p>
      <button class="btn-primary" id="btnNext">다음 레벨 →</button>
    </div>
  </div>

</div>

<script>
"use strict";

/* =====================================================================
   1. 게임 규칙 (DOM 비의존 순수 로직)
   ===================================================================== */
/* @@CORE-START */
/* 색 구분이 또렷하도록 샘플과 같은 6색만 쓴다 (청록·자홍 제외) */
var COLORS = ['#6FDC4A', '#FF5C8A', '#FFD22E', '#3EC5F7', '#9C6BFF', '#FF8A2B'];
var COLOR_NAMES = ['연두', '코랄', '노랑', '하늘', '보라', '주황'];

/* 시드 기반 난수 (같은 레벨 = 같은 판) */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 레벨 설계 (색은 샘플과 같은 6색 고정 — 병 개수와 선반 배치로만 난이도를 올린다)
   · 좌우 선반은 언제나 같은 병 수로 놓는다(좌우 대칭) — 좌우 각 T단 × 한 단에 S병 = 일반 병 2×T×S개
   · 가운데 긴 병은 3레벨부터 1개 (0칸에서 시작, 목표 색만 받는다)
   · 3레벨부터는 시작할 때 텅 빈 일반 병이 하나도 없다.
     액체는 4칸 단위라 선반 병 수가 딱 맞고, 남는 병 2개 몫(8칸)이 섞기용 여유가 된다 →
     시작할 때는 그 8칸이 여러 일반 병의 윗칸에 1~3칸씩 나뉘어 있다.
     배치표 (T×S · 일반병 · 가운데 · 일반 색 수 · 색별 병 수)
         1 : 1×3   6     -      4  1,1,1,1
         2 : 1×4   8     -      6  1,1,1,1,1,1
         3 : 2×2   8    8칸     4  1,1,1,1
         4 : 2×3  12    8칸     5  2,2,2,1,1
         5 : 3×2  12    8칸     5  2,2,2,1,1
         6 : 3×3  18    8칸     5  3,3,3,3,2
         7 : 3×3  18   12칸     5  3,3,3,2,2
         8 : 3×4  24   12칸     5  4,4,4,4,3
         9 : 4×3  24   12칸     5  4,4,4,4,3
      10~12 : 4×3  24   16칸     5  4,4,4,3,3
      13~15 : 4×3  24   12칸     5  5,4,4,3,3
      16~19 : 4×3  24   16칸     5  5,4,3,3,3
      20~24 : 4×3  24   16칸     5  6,3,3,3,3
      25~29 : 4×3  24   16칸     5  6,4,3,3,2
      30+   : 4×3  24   16칸     5  7,3,3,3,2
   · 20레벨 이상은 좌 12병(4단×3병) + 우 12병 + 가운데 1병 = 25병으로 꽉 찬 최대 배치. */
function levelConfig(level) {
  var tiers, per, tallCap, counts, i;
  if (level <= 1)       { tiers = 1; per = 3; tallCap = 0;  counts = [1, 1, 1, 1]; }
  else if (level <= 2)  { tiers = 1; per = 4; tallCap = 0;  counts = [1, 1, 1, 1, 1, 1]; }
  else if (level <= 3)  { tiers = 2; per = 2; tallCap = 8;  counts = [1, 1, 1, 1]; }
  else if (level <= 4)  { tiers = 2; per = 3; tallCap = 8;  counts = [2, 2, 2, 1, 1]; }
  else if (level <= 5)  { tiers = 3; per = 2; tallCap = 8;  counts = [2, 2, 2, 1, 1]; }
  else if (level <= 6)  { tiers = 3; per = 3; tallCap = 8;  counts = [3, 3, 3, 3, 2]; }
  else if (level <= 7)  { tiers = 3; per = 3; tallCap = 12; counts = [3, 3, 3, 2, 2]; }
  else if (level <= 8)  { tiers = 3; per = 4; tallCap = 12; counts = [4, 4, 4, 4, 3]; }
  else if (level <= 9)  { tiers = 4; per = 3; tallCap = 12; counts = [4, 4, 4, 4, 3]; }
  else if (level <= 12) { tiers = 4; per = 3; tallCap = 16; counts = [4, 4, 4, 3, 3]; }
  else if (level <= 15) { tiers = 4; per = 3; tallCap = 12; counts = [5, 4, 4, 3, 3]; }
  else if (level <= 19) { tiers = 4; per = 3; tallCap = 16; counts = [5, 4, 3, 3, 3]; }
  else if (level <= 24) { tiers = 4; per = 3; tallCap = 16; counts = [6, 3, 3, 3, 3]; }
  else if (level <= 29) { tiers = 4; per = 3; tallCap = 16; counts = [6, 4, 3, 3, 2]; }
  else                  { tiers = 4; per = 3; tallCap = 16; counts = [7, 3, 3, 3, 2]; }

  var tall = tallCap > 0;
  var normalBottles = 2 * tiers * per;                            // 좌우 대칭 배치
  var normalColors = counts.length;
  var colors = normalColors + (tall ? 1 : 0);                     // 목표 색 포함
  var filled = 0;
  for (i = 0; i < counts.length; i++) filled += counts[i];
  if (tall) filled += tallCap / 4;                                // 목표 색 몫 병 수
  var spare = normalBottles - filled;                             // 섞기용 여유 병 (보통 2)
  var depth = Math.min(260, 24 + normalBottles * 10);             // 뒤섞는 횟수
  return {
    colors: colors, normalColors: normalColors, tall: tall, tallCap: tallCap,
    counts: counts, spare: spare, tiers: tiers, per: per, normalBottles: normalBottles,
    /* 3레벨부터는 빈 병 없이 시작한다 (여유는 여러 병 윗칸에 나뉜다). 1~2레벨은 튜토리얼 */
    startEmpties: tall ? 0 : spare,
    units: filled - (tall ? tallCap / 4 : 0) + (tall ? 1 : 0),    // 진행도 분모(완성 병 수)
    depth: depth, level: level
  };
}

/* 색별 병 수(counts)를 시드에 맞춰 색에 배분 (매 판 다른 조합) */
function pickCopies(cfg, goal, rng) {
  var copies = {}, list = [], i, t, tmp;
  for (i = 0; i < cfg.colors; i++) if (i !== goal) list.push(i);
  for (i = list.length - 1; i > 0; i--) {              // 시드 셔플
    t = Math.floor(rng() * (i + 1));
    tmp = list[i]; list[i] = list[t]; list[t] = tmp;
  }
  for (i = 0; i < list.length; i++) copies[list[i]] = cfg.counts[i] || 1;
  return copies;
}

/* 완성된 판에서 출발하는 병들 (역연산 섞기의 출발점)
   - 일반 색: 4칸짜리 완성 병을 counts 대로 (3~4병 = 12~16칸)
   - 목표 색: 가운데 긴 병 용량(8·12·16칸)을 가득 채운 완성 상태에서 출발하고,
     긴 병 몫 병(tallCap/4)은 빈 병으로 둔다. (섞을 때 목표 색이 그 빈 병들로 퍼진다)
   - 여유 빈 병 2개. */
function makeBottles(cfg, goal, copies) {
  var out = [], c, e, i, k;
  var hasGoal = (goal !== null && goal !== undefined);
  for (c = 0; c < cfg.colors; c++) {
    if (hasGoal && c === goal) continue;              // 목표 색은 긴 병이 전담
    k = (copies && copies[c]) ? copies[c] : 1;
    for (i = 0; i < k; i++)
      out.push({ cells: new Array(4).fill(c), cap: 4, tall: false, goal: null, levelGoal: hasGoal ? goal : null });
  }
  var emptySlots = cfg.spare + (cfg.tall ? cfg.tallCap / 4 : 0);
  for (e = 0; e < emptySlots; e++)
    out.push({ cells: [], cap: 4, tall: false, goal: null, levelGoal: hasGoal ? goal : null });
  if (cfg.tall)
    out.push({ cells: new Array(cfg.tallCap).fill(goal), cap: cfg.tallCap, tall: true, goal: goal, levelGoal: goal });
  return out;
}

/* 맨 위 같은 색 덩어리 */
function topRun(cells) {
  if (!cells.length) return { color: -1, n: 0 };
  var c = cells[cells.length - 1], n = 0;
  for (var i = cells.length - 1; i >= 0 && cells[i] === c; i--) n++;
  return { color: c, n: n };
}

/* 이 병에서 저 병으로 부을 수 있는 양 (0이면 불가) */
function pourAmount(a, b) {
  if (!a || !b || a === b) return 0;
  if (!a.cells.length) return 0;
  if (isComplete(a)) return 0;              // 완성된 병은 뚜껑이 닫혀 잠김 — 부을 수 없음
  if (a.tall) return 0;                     // 가운데 긴 병은 목표 색을 '받기만' 한다
  if (b.cells.length >= b.cap) return 0;
  var tr = topRun(a.cells);
  if (b.cells.length && b.cells[b.cells.length - 1] !== tr.color) return 0;
  if (b.goal !== null && b.goal !== undefined && tr.color !== b.goal) return 0;   // 긴 병: 목표 색만
  return Math.min(tr.n, b.cap - b.cells.length);
}

/* 실제로 붓기. 부은 칸 수를 반환 */
function applyPour(state, ai, bi) {
  var a = state[ai], b = state[bi], n = pourAmount(a, b);
  if (!n) return 0;
  var color = a.cells[a.cells.length - 1];
  for (var i = 0; i < n; i++) { a.cells.pop(); b.cells.push(color); }
  return n;
}

/* 완성 판정
   · 일반 병: 네 칸이 모두 같은 색. 단 목표 색은 가운데 긴 병에서만 완성되므로,
     일반 병에 가득 찬 목표 색은 '완성'이 아니다 — 뚜껑이 닫히지 않고 긴 병으로 부을 수 있다.
   · 가운데 긴 병: 목표 색으로 용량(8·12·16칸)을 가득 냈을 때만 완성. */
function isComplete(bottle) {
  var cells = bottle.cells, i;
  if (cells.length !== bottle.cap) return false;
  for (i = 1; i < cells.length; i++) if (cells[i] !== cells[0]) return false;
  if (bottle.tall) return cells[0] === bottle.goal;
  var g = bottle.levelGoal;
  if (g !== null && g !== undefined && cells[0] === g) return false;
  return true;
}

/* 클리어 조건: 모든 병이 비었거나, 한 가지 색으로 가득 참 */
function isWin(state) {
  for (var i = 0; i < state.length; i++) {
    if (state[i].cells.length === 0) continue;
    if (!isComplete(state[i])) return false;
  }
  return true;
}

/* 목표를 이룬 색 수 — 일반 색은 4칸 완성, 목표 색은 가운데 긴 병을 가득 채워야 인정 */
function goalColorOf(state) {
  for (var i = 0; i < state.length; i++) if (state[i].tall) return state[i].goal;
  return null;
}

function countSettled(state) {
  var goal = goalColorOf(state);
  var n = 0;
  for (var i = 0; i < state.length; i++) {
    var b = state[i];
    if (b.tall) { if (isComplete(b)) n++; continue; }
    if (!isComplete(b)) continue;
    if (goal !== null && goal !== undefined && b.cells[0] === goal) continue;
    n++;
  }
  return n;
}

/* 한 색이 몇 개 병에 흩어져 있는지 */
function splitColors(state) {
  var map = new Map(), i, j, cells;
  for (i = 0; i < state.length; i++) {
    cells = state[i].cells;
    for (j = 0; j < cells.length; j++) {
      if (!map.has(cells[j])) map.set(cells[j], new Set());
      map.get(cells[j]).add(i);
    }
  }
  var split = 0;
  map.forEach(function (set) { if (set.size > 1) split++; });
  return split;
}

/* ---------------------------------------------------------------
   역방향 섞기: 실제 "붓기"의 정확한 역연산만 사용하므로
   만들어진 판은 항상 풀 수 있다. (되돌리면 곧 정답 순서)
   역연산: 지금 상태의 B 맨 위 c색 k칸을 A로 옮긴다.
           정방향에서는 A→B로 k칸을 붓는 수가 된다.
           A는 비었거나 맨 위 색이 c가 아니어야 한다.
   · 긴 병은 받는 쪽으로도 절대 쓰지 않는다 → 시작 0칸이 섞는 내내 유지된다.
   · 빈 병을 한 번에 가득 채우는 역연산은 만들지 않는다
     (정방향에서 '뚜껑 닫힌 병에서 붓는 수'가 되어 막힌다).
   --------------------------------------------------------------- */
function reverseCandidates(state, skipB, skipA, smallFirst) {
  var out = [], bi, ai, B, A, tr, free, len, maxK, k;
  for (bi = 0; bi < state.length; bi++) {
    if (bi === skipB) continue;
    B = state[bi];
    if (!B.cells.length) continue;                                  // 옮길 액체가 없음
    tr = topRun(B.cells);
    if (B.tall && tr.color !== B.goal) continue;
    for (ai = 0; ai < state.length; ai++) {
      if (ai === bi || ai === skipA) continue;
      A = state[ai];
      if (A.tall) continue;                                         // 긴 병은 받기 전용
      free = A.cap - A.cells.length;
      if (free < 1) continue;
      len = A.cells.length;
      if (len && A.cells[len - 1] === tr.color) continue;           // 역연산 조건
      maxK = Math.min(tr.n, free);
      if (!len && maxK >= A.cap) maxK = A.cap - 1;                  // 빈 병 통째 채우기 금지
      for (k = 1; k <= maxK; k++) {
        /* k가 맨 위 덩어리 전체인데 B에 다른 색이 남으면,
           정방향에서 A→B가 막힌다(맨 위 색 불일치) */
        if (k === tr.n && B.cells.length > k) continue;
        out.push({ b: bi, a: ai, k: k, w: smallFirst ? 1 / (k * k) : k * k });
      }
    }
  }
  return out;
}

function applyReverse(state, m, moves) {
  var color = state[m.b].cells[state[m.b].cells.length - 1], i;
  for (i = 0; i < m.k; i++) state[m.b].cells.pop();
  for (i = 0; i < m.k; i++) state[m.a].cells.push(color);
  if (moves) moves.push([m.b, m.a, m.k]);
}

function pickWeighted(cands, rng) {
  var total = 0, acc = 0, i;
  for (i = 0; i < cands.length; i++) total += cands[i].w;
  var r = rng() * total;
  for (i = 0; i < cands.length; i++) { acc += cands[i].w; if (r <= acc) return cands[i]; }
  return cands[cands.length - 1];
}

/* 가운데 긴 병을 0칸으로: 목표 색을 전부 일반 병으로 옮긴다.
   받을 자리가 없으면 일반 병끼리 한 수 옮겨 자리를 만든다. */
function drainTall(state, tallIdx, moves, rng, budget) {
  var guard = 0, cands, open, ai, A, free, len, maxK, k, n, c;
  while (state[tallIdx].cells.length) {
    if (guard++ > budget) return false;
    cands = [];
    n = state[tallIdx].cells.length;
    c = state[tallIdx].cells[n - 1];
    for (ai = 0; ai < state.length; ai++) {
      if (ai === tallIdx) continue;
      A = state[ai];
      free = A.cap - A.cells.length;
      if (free < 1) continue;
      len = A.cells.length;
      if (len && A.cells[len - 1] === c) continue;
      maxK = Math.min(n, free);
      if (!len && maxK >= A.cap) maxK = A.cap - 1;
      for (k = 1; k <= maxK; k++) cands.push({ b: tallIdx, a: ai, k: k, w: k * k });
    }
    if (cands.length) { applyReverse(state, pickWeighted(cands, rng), moves); continue; }
    open = reverseCandidates(state, tallIdx, tallIdx, true);      // 긴 병은 주고받지 않는다
    if (!open.length) return false;
    applyReverse(state, pickWeighted(open, rng), moves);
  }
  return true;
}

/* 판 섞기: 1) 긴 병을 완전히 비운다 2) 일반 병들만 역연산으로 섞는다 */
function scramble(state, depth, rng) {
  var moves = [], lastFrom = -1, lastTo = -1, step, i, tallIdx = -1, pick, cands, list;
  for (i = 0; i < state.length; i++) if (state[i].tall) { tallIdx = i; break; }

  if (tallIdx >= 0 && !drainTall(state, tallIdx, moves, rng, depth * 8 + 80)) return null;

  for (step = 0; step < depth; step++) {
    cands = reverseCandidates(state, tallIdx, tallIdx);
    list = [];
    for (i = 0; i < cands.length; i++) {
      if (cands[i].b === lastTo && cands[i].a === lastFrom) continue;   // 방금 수 되돌리기 금지
      list.push(cands[i]);
    }
    if (!list.length) break;
    pick = pickWeighted(list, rng);
    applyReverse(state, pick, moves);
    lastFrom = pick.b; lastTo = pick.a;
  }
  return moves;
}

/* 여러 색이 섞여 있는 병 수 (섞임 정도) */
function countMixed(state) {
  var n = 0, i, j, cells;
  for (i = 0; i < state.length; i++) {
    cells = state[i].cells;
    if (state[i].tall || cells.length < 2) continue;
    for (j = 1; j < cells.length; j++) if (cells[j] !== cells[0]) { n++; break; }
  }
  return n;
}

/* 시작 상태에 남은 빈 일반 병 / 1칸짜리 일반 병 수 */
function countEmpty(state) {
  var n = 0, i;
  for (i = 0; i < state.length; i++) if (!state[i].tall && !state[i].cells.length) n++;
  return n;
}
function countThin(state) {
  var n = 0, i;
  for (i = 0; i < state.length; i++) if (!state[i].tall && state[i].cells.length === 1) n++;
  return n;
}

/* 시작 상태에서 빈 일반 병을 없앤다.
   다른 병의 맨 위 색 1~3칸을 빈 병으로 옮기는 '역연산'만 쓰므로 정답 순서는 그대로 유효하다.
   옮기는 병은 1칸 이상 남기고(빈 병을 새로 만들지 않음), 빈 병에 4칸(=완성·잠금)은 넣지 않는다. */
function fillEmptyBottles(state, moves, rng, budget) {
  var guard = 0, i, bi, k, cands, emptyIdx, B, tr, maxK;
  while (guard++ < (budget || 90)) {
    emptyIdx = -1;
    for (i = 0; i < state.length; i++) {
      if (!state[i].tall && !state[i].cells.length) { emptyIdx = i; break; }
    }
    if (emptyIdx < 0) return true;                                  // 빈 병 없음
    cands = [];
    for (bi = 0; bi < state.length; bi++) {
      if (bi === emptyIdx) continue;
      B = state[bi];
      if (B.tall || !B.cells.length) continue;
      tr = topRun(B.cells);
      /* k < tr.n 이어야 정방향에서 '맨 위 색 같음'이 성립하고, k < B.cells.length 이어야 B가 비지 않는다 */
      maxK = Math.min(tr.n - 1, B.cells.length - 1, 3);
      for (k = 1; k <= maxK; k++) cands.push({ b: bi, a: emptyIdx, k: k, w: k === 2 ? 6 : (k === 3 ? 5 : 2) });
    }
    if (!cands.length) return false;                                // 옮길 덩어리가 없음
    applyReverse(state, pickWeighted(cands, rng), moves);
  }
  return false;
}

/* 레벨 생성 (항상 풀 수 있는 판) */
function generateLevel(level, seed) {
  var cfg = levelConfig(level);
  var best = null, bestScore = -Infinity, round, attempt;

  for (round = 0; round < 3; round++) {
    for (attempt = 0; attempt < 60; attempt++) {
      var rng = mulberry32((seed + round * 7919 + Math.imul(attempt, 2654435761)) >>> 0);
      var goal = cfg.tall ? Math.floor(rng() * cfg.colors) : null;   // 가운데 긴 병의 목표 색
      var copies = pickCopies(cfg, goal, rng);
      var state = makeBottles(cfg, goal, copies);

      /* 좌우 선반에 놓일 순서를 먼저 섞어 같은 색 병이 붙어 보이지 않게 (섞기 전에 해야 수 기록이 맞는다) */
      var normals = [], i;
      for (i = 0; i < state.length; i++) if (!state[i].tall) normals.push(state[i]);
      for (i = normals.length - 1; i > 0; i--) {
        var j = Math.floor(rng() * (i + 1));
        var tmp = normals[i]; normals[i] = normals[j]; normals[j] = tmp;
      }
      for (i = 0; i < normals.length; i++) state[i] = normals[i];

      var moves = scramble(state, cfg.depth, rng);
      if (!moves) continue;

      /* 3레벨부터: 시작할 때 빈 일반 병 0개.
         섞다가 남은 빈 병은 다른 병 윗칸(1~3칸)을 옮겨 채운다 → 여유 8칸이 여러 병에 나뉜다 */
      var empties = countEmpty(state);
      if (empties > cfg.startEmpties) {
        if (cfg.startEmpties !== 0) continue;
        if (!fillEmptyBottles(state, moves, rng, 90)) continue;
        empties = countEmpty(state);
        if (empties > 0) continue;
      }

      var tallLen = -1;
      for (i = 0; i < state.length; i++) if (state[i].tall) tallLen = state[i].cells.length;
      if (cfg.tall && tallLen !== 0) continue;                       // 가운데 병은 반드시 0칸으로 시작
      if (isWin(state)) continue;                                    // 이미 완성된 판은 버린다

      var split = splitColors(state);
      var mixed = countMixed(state);
      var done = countSettled(state);
      var thin = countThin(state);
      var score = split * 90 + mixed * 14 + moves.length * 0.8 - done * 30 - thin * 8 + (cfg.startEmpties ? empties * 10 : 0);
      var result = { bottles: state, cfg: cfg, goal: goal, moves: moves, attempt: attempt,
                     split: split, mixed: mixed, done: done, empties: empties, thin: thin, score: score };
      /* 목표: 모든 색이 여러 병에 흩어지고, 처음부터 완성된 병이 없고, 대부분 병이 섞인 상태 */
      if (split >= cfg.colors && done === 0 && mixed >= cfg.normalBottles - 3) return result;
      if (score > bestScore) { bestScore = score; best = result; }
    }
    if (best) break;
  }
  return best;
}

/* 무대에 올릴 순서: 일반 병은 좌/우 선반, 긴 병은 가운데 */
function splitRows(count, rows) {
  var r = Math.max(1, Math.min(rows || Math.ceil(count / 3), count));
  var out = [], rem = count, i;
  for (i = 0; i < r; i++) {
    var take = Math.ceil(rem / (r - i));
    out.push(take); rem -= take;
  }
  return out;
}
/* @@CORE-END */

/* =====================================================================
   2. 사운드 (Web Audio API — 외부 파일 없음)
   ===================================================================== */
function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
    return value;
  } catch (e) { return null; }
}

var Sound = (function () {
  var ctx = null;
  var muted = store('wsp.muted') === '1';

  function ac() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }

  function tone(freq, opt) {
    opt = opt || {};
    if (muted) return;
    var c = ac(); if (!c) return;
    var dur = opt.dur || 0.16, t0 = c.currentTime + (opt.delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = opt.type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (opt.to) o.frequency.exponentialRampToValueAtTime(Math.max(40, opt.to), t0 + dur);
    var vol = opt.vol || 0.06;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.04);
  }

  function splash(dur, vol) {
    if (muted) return;
    var c = ac(); if (!c) return;
    dur = dur || 0.30;
    var n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) {
      var t = i / n;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3) * (0.55 + 0.45 * Math.sin(2 * Math.PI * 26 * t));
    }
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500;
    var g = c.createGain(); g.gain.value = vol || 0.05;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start();
  }

  return {
    unlock: function () { ac(); },
    isMuted: function () { return muted; },
    toggle: function () {
      muted = !muted;
      store('wsp.muted', muted ? '1' : '0');
      if (!muted) { this.pick(); }
      return muted;
    },
    pick: function () { tone(720, { dur: 0.08, type: 'triangle', vol: 0.05, to: 980 }); },
    pour: function () {
      tone(440, { dur: 0.19, type: 'sine', vol: 0.05, to: 300 });
      splash(0.32, 0.055);
      tone(300, { dur: 0.13, type: 'sine', vol: 0.035, to: 400, delay: 0.07 });
    },
    fail: function () { tone(150, { dur: 0.13, type: 'square', vol: 0.03, to: 100 }); },
    done: function () {
      [660, 880, 1170].forEach(function (f, i) { tone(f, { dur: 0.24, type: 'sine', vol: 0.055, delay: i * 0.07 }); });
    },
    win: function () {
      [523, 659, 784, 1046, 1318].forEach(function (f, i) {
        tone(f, { dur: 0.34, type: 'triangle', vol: 0.055, delay: i * 0.09 });
      });
    }
  };
})();

};

/* 병 하나 만들기 */
function makeBottleEl(bottle) {
  var el = document.createElement('div');
  el.className = 'bottle' + (bottle.tall ? ' tall' : '');
  el.dataset.id = String(bottle.id);
  el.style.setProperty('--cap', String(bottle.cap));
  el.innerHTML = '<div class="neck"></div><div class="cap"></div><div class="body"><span class="shine"></span></div><div class="tick">✓</div>';
  bottle.el = el;
  bottle.bands = new Map();
  return el;
}

/* 액체 칸 맞추기 */
function syncBottle(bottle, animate) {
  var el = bottle.el;
  if (!el) return;
  var body = el.querySelector('.body');
  var shine = body.querySelector('.shine');
  var slot = 100 / bottle.cap;
  var bands = bottle.bands;
  var i, c, band;

  for (i = 0; i < bottle.cells.length; i++) {
    c = bottle.cells[i];
    band = bands.get(i);
    if (band && band.dataset.color !== String(c)) { band.remove(); bands.delete(i); band = null; }

    if (!band) {
      band = document.createElement('i');
      band.className = 'band';
      band.dataset.color = String(c);
      band.style.setProperty('--c', COLORS[c]);
      band.style.bottom = (i * slot) + '%';
      band.style.height = animate ? '0%' : slot + '%';
      body.insertBefore(band, shine);
      bands.set(i, band);
      if (animate) {
        void band.offsetHeight;          // 0%에서 시작하도록 강제 리플로우
        band.style.height = slot + '%';
      }
    } else {
      band.style.bottom = (i * slot) + '%';
      band.style.height = slot + '%';
    }
  }

  Array.from(bands.keys()).forEach(function (idx) {
    if (idx >= bottle.cells.length) {
      var b = bands.get(idx);
      bands.delete(idx);
      b.classList.remove('top');
      b.style.height = '0%';
      if (animate) setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 220);
      else if (b.parentNode) b.parentNode.removeChild(b);
    }
  });

  bands.forEach(function (b, idx) { b.classList.toggle('top', idx === bottle.cells.length - 1); });
  var full = isComplete(bottle);
  el.classList.toggle('done', full);
  el.classList.toggle('capped', full);      /* 완성 = 뚜껑 닫힘 */
}

function renderAll(animate) {
  game.bottles.forEach(function (b) {
    if (!b.el) return;
    Array.from(b.el.querySelectorAll('.band')).forEach(function (n) { n.parentNode.removeChild(n); });
    b.bands = new Map();
    syncBottle(b, !!animate);
  });
}

/* 선반 배치: 좌우 선반에 일반 병을 단(tier)별로 나눠 놓고, 가운데에 긴 병 */
function buildLayout() {
  colLeft.innerHTML = ''; colCenter.innerHTML = ''; colRight.innerHTML = '';

  var normals = game.bottles.filter(function (b) { return !b.tall; });
  var tall = game.bottles.filter(function (b) { return b.tall; })[0] || null;

  var nL = Math.ceil(normals.length / 2);
  var groups = [normals.slice(0, nL), normals.slice(nL)];
  var cols = [colLeft, colRight];
  var tiers = game.tiers || (game.cfg ? game.cfg.tiers : 3);

  groups.forEach(function (list, gi) {
    var rows = splitRows(list.length, tiers), k = 0;
    rows.forEach(function (cnt) {
      var shelf = document.createElement('div'); shelf.className = 'shelf';
      var rack = document.createElement('div'); rack.className = 'rack';
      for (var i = 0; i < cnt; i++) rack.appendChild(makeBottleEl(list[k++]));
      var plank = document.createElement('div'); plank.className = 'plank';
      shelf.appendChild(rack); shelf.appendChild(plank);
      cols[gi].appendChild(shelf);
    });
  });

  game.goalCountEl = null;
  if (tall) {
    var wrap = document.createElement('div');
    wrap.className = 'goal-wrap';

    var badge = document.createElement('div');
    badge.className = 'goal-badge';
    badge.innerHTML = '<i></i>목표 <b>' + COLOR_NAMES[tall.goal] + '</b>' +
                      '<span class="goal-count" id="goalCount">0/' + tall.cap + '</span>';
    badge.querySelector('i').style.setProperty('--c', COLORS[tall.goal]);
    game.goalCountEl = badge.querySelector('#goalCount');

    var tel = makeBottleEl(tall);
    tel.classList.add('goal');
    tel.style.setProperty('--goal', COLORS[tall.goal]);

    wrap.appendChild(badge);
    wrap.appendChild(tel);
    colCenter.appendChild(wrap);
  }
}

function updateHud() {
  elLv.textContent = String(game.level);
  elMove.textContent = String(game.moves);

/* 화면에 맞춰 병 크기·선반 단 수 자동 조절 (아이폰 세로 ~ 데스크톱) */
var GX = 0.10;          // 병 사이·양끝 여백 (병 폭 대비)
var BOTTLE_H = 3.62;    // 병 한 개 + 선반 두께 (병 폭 대비)
var BOTTLE_H_4 = 3.40;  // 4단일 때는 병을 한결 납작하게 (아담한 한 화면)
var TALL_SPAN = 1.09;   // 가운데 긴 병이 차지하는 폭 + 간격
var MIN_BW = 21;
/* iPhone Safari 하단 floating 툴바는 화면 맨 아래에서 약 150px 위를 덮는다.
   선반은 언제나 이 여백 위에서 멈춘다 — safe-area-inset-bottom 때문에 실제로는 더 비운다. */
var BOTTOM_MIN = 118;
var BOTTOM_EXTRA = 124;

var appEl = $('#app'), barEl = $('.bar');

function safeBottom() {
  var p = document.getElementById('safeProbe');
  return p ? p.offsetHeight : 0;
}

/* iOS Safari 는 floating 툴바를 화면 위에 겹쳐 띄우므로 innerHeight·dvh 가 실제로 보이는
   높이보다 클 수 있다. 가능한 후보 중 가장 작은(보수적인) 값을 쓴다. */
function viewHeight() {
  var c = [];
  if (window.innerHeight) c.push(window.innerHeight);
  if (document.documentElement && document.documentElement.clientHeight) c.push(document.documentElement.clientHeight);
  if (window.visualViewport && window.visualViewport.height) c.push(window.visualViewport.height);
  if (!c.length) return 640;
  return Math.min.apply(null, c);
}

/* 병·선반이 실제로 놓일 수 있는 높이 — 상단 HUD/버튼줄과 하단 툴바 자리를 뺀 나머지 */
function stageMetrics() {
  var appRect = appEl.getBoundingClientRect();
  var barRect = barEl.getBoundingClientRect();
  var vh = viewHeight();
  var appH = Math.min(appRect.height || vh, vh);
  var top = Math.max(0, (barRect.bottom - appRect.top) + 4);
  var reserve = Math.max(BOTTOM_MIN, safeBottom() + BOTTOM_EXTRA);
  return { vh: vh, top: top, reserve: reserve, avail: Math.max(240, appH - top - reserve) };
}

function planTiers(nL, W, H, tall, badgeH) {
  var pref = game.cfg ? game.cfg.tiers : 3;
  var compact = pref >= 4;                   // 4단 선반은 병을 더 아담하게
  var rowGap = compact ? Math.max(6, Math.min(13, H * 0.014))
                       : Math.max(8, Math.min(22, H * 0.021));
  var roomH = H - (tall ? badgeH + 8 : 10);
  var ratio = compact ? BOTTLE_H_4 : BOTTLE_H;
  var shrink = compact ? 0.93 : 1;
  function bwFor(R) {
    var cols = Math.ceil(nL / R);
    var perSide = cols + (cols + 1) * GX;
    var bwW = (W - (tall ? 18 : 10)) / (2 * perSide + (tall ? TALL_SPAN : 0));
    var bwH = (roomH - (R - 1) * rowGap) / (R * ratio);
    return Math.min(bwW * shrink, bwH * shrink, 78);
  }
  var prefBw = bwFor(pref);
  if (prefBw >= MIN_BW + 1) return { tiers: pref, bw: prefBw, rowGap: rowGap };
  /* 아주 납작한 화면(가로 모드 등)에서는 단 수를 늘리거나 줄여 크기를 지킨다 */
  var best = { tiers: pref, bw: prefBw };
  for (var R = 1; R <= nL; R++) {
    var b = bwFor(R);
    if (b > best.bw + 0.5) best = { tiers: R, bw: b };
  }
  best.rowGap = rowGap;
  return best;
}

/* 병 폭·가운데 긴 병 길이를 화면에 반영 */
function applyBottleSize(bw, tall, badgeH, H) {
  stageEl.style.setProperty('--bw', bw.toFixed(2) + 'px');
  if (!tall) { stageEl.style.removeProperty('--tall-slot'); return; }
  var sideH = Math.max(colLeft.getBoundingClientRect().height, colRight.getBoundingClientRect().height);
  var tallB = null;
  game.bottles.forEach(function (b) { if (b.tall) tallB = b; });
  var cap = tallB ? tallB.cap : 8;
  var slot = (sideH - badgeH - bw * 0.42) / cap;
  /* 무대 높이를 넘지 않게 한 번 더 제한 (가로 모드처럼 세로가 아주 좁은 화면) */
  var maxSlot = H ? (H - badgeH - bw * 0.66) / cap : 1e9;
  slot = Math.min(maxSlot, Math.max(bw * 0.42, Math.min(bw * 1.20, slot)));
  stageEl.style.setProperty('--tall-slot', slot.toFixed(2) + 'px');
}

/* 지금 그려진 선반들이 실제로 차지하는 세로 길이 (실측) */
function columnHeight() {
  return Math.max(
    colLeft.getBoundingClientRect().height,
    colRight.getBoundingClientRect().height,
    colCenter.getBoundingClientRect().height
  );
}

function fitStage(force) {
  if (!appEl || !barEl) return;

  /* 1) 화면에서 실제로 쓸 수 있는 높이를 구해 무대 높이를 px 로 못 박는다 (넘침 원천 차단) */
  var metrics = stageMetrics();
  var avail = metrics.avail;
  stageEl.style.flex = '0 0 auto';
  stageEl.style.height = avail.toFixed(1) + 'px';
  stageEl.style.maxHeight = avail.toFixed(1) + 'px';
  stageEl.style.setProperty('--stage-h', avail.toFixed(1) + 'px');

  var W = stageEl.clientWidth, H = stageEl.clientHeight;
  if (!W || !H) return;

  var tall = !!(game.cfg && game.cfg.tall);
  var normals = 0;
  game.bottles.forEach(function (b) { if (!b.tall) normals++; });
  if (!normals) return;
  var nL = Math.ceil(normals / 2);
  var badgeEl = stageEl.querySelector('.goal-badge');
  var badgeH = badgeEl ? badgeEl.offsetHeight + 8 : (tall ? 24 : 0);

  var plan = planTiers(nL, W, H, tall, badgeH);
  stageEl.style.setProperty('--rowgap', plan.rowGap.toFixed(1) + 'px');

  /* 계획한 단 수가 지금 선반과 다르면 다시 그린다 */
  var curTiers = colLeft.querySelectorAll('.shelf').length || 2;
  if (force || plan.tiers !== curTiers) {
    game.tiers = plan.tiers;
    clearSelected();                 // 요소를 새로 그리므로 선택 표시도 초기화
    buildLayout();
    renderAll(false);
    updateHud();
    badgeEl = stageEl.querySelector('.goal-badge');
    badgeH = badgeEl ? badgeEl.offsetHeight + 8 : (tall ? 24 : 0);
    plan = planTiers(nL, W, H, tall, badgeH);
    stageEl.style.setProperty('--rowgap', plan.rowGap.toFixed(1) + 'px');
  }

  /* 2) 계산값을 적용한 뒤, 실제 그려진 높이를 재서 화면을 넘으면 병을 더 줄인다 */
  var bw = Math.max(MIN_BW, Math.min(plan.bw, 78));
  applyBottleSize(bw, tall, badgeH, H);
  for (var i = 0; i < 4; i++) {
    var drawn = columnHeight();
    if (drawn <= H - 1 || bw <= MIN_BW) break;
    bw = Math.max(MIN_BW, bw * ((H - 1) / drawn) * 0.995);
    applyBottleSize(bw, tall, badgeH, H);
  }

  game.bottles.forEach(function (b) { b.restRect = null; });
}

/* =====================================================================
   4. 조작 & 게임 진행
   ===================================================================== */
function bottleById(id) { return game.bottles[id]; }

function clearSelected() {
  game.bottles.forEach(function (b) { if (b.el) b.el.classList.remove('selected'); });
  game.selected = null;
}

function selectBottle(id) {
  var b = game.bottles[id];
  if (!b) return;
  clearSelected();
  game.selected = id;
  if (b.el) b.el.classList.add('selected');
  Sound.pick();
}

function shakeEl(el) {
  if (!el || el.classList.contains('pouring')) return;   // 기울여 붓는 중에는 흔들지 않음
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  setTimeout(function () { el.classList.remove('shake'); }, 300);
}

/* 병의 '제자리' 위치 — 붓느라 기울어 있어도 원래 상자를 잰다 */
function restRect(el) {
  var cls = el.className;
  var t = el.style.transform, tr = el.style.transition;
  var tilted = el.classList.contains('pouring') || el.classList.contains('return');
  if (tilted) el.classList.remove('pouring', 'return');
  el.style.transition = 'none';
  el.style.transform = 'none';
  var r = el.getBoundingClientRect();
  el.style.transform = t;
  el.style.transition = tr;
  if (tilted) el.className = cls;                       // 같은 프레임 안에서 원래 상태로 복구
  return r;
}

/* 병을 상대 병 위로 기울임 (입구가 상대 병 입구에 오도록 계산) */
function tiltTowards(srcEl, dstEl) {
  var a = restRect(srcEl);
  var b = dstEl.getBoundingClientRect();
  var dir = (b.left + b.width / 2) >= (a.left + a.width / 2) ? 1 : -1;
  var isTall = srcEl.classList.contains('tall');
  var deg = dir * (isTall ? 10 : 30);
  var th = deg * Math.PI / 180;
  var arm = a.height - 6;
  var lipX = a.left + a.width / 2 + Math.sin(th) * arm;
  var lipY = a.top + a.height - Math.cos(th) * arm;
  var targetX = b.left + b.width / 2 + dir * 3;
  var targetY = b.top - 7;
  var tx, ty;
  if (isTall) {
    /* 긴 병은 크게 휘둘리지 않게 제자리에서만 살짝 기울인다 (물줄기가 목표까지 이어진다) */
    tx = dir * a.width * 0.20;
    ty = -a.width * 0.04;
  } else {
    tx = targetX - lipX;      // 입구가 목표 병 입구에 오도록
    ty = targetY - lipY;
  }

  srcEl.classList.remove('return');
  srcEl.classList.add('pouring');
  srcEl.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) rotate(' + deg + 'deg)';

  return {
    x: targetX, y: targetY,
    from: { x: a.left + a.width / 2 + Math.sin(th) * arm + tx,
            y: a.top + a.height - Math.cos(th) * arm + ty }
  };
}

function untilt(el) {
  el.classList.remove('pouring');
  el.classList.add('return');
  el.style.transform = '';
}

function showStream(pt, colorIdx) {
  var wrap = document.createElement('div');
  wrap.className = 'stream-wrap';
  var s = document.createElement('div');
  s.className = 'stream';
  s.style.setProperty('--c', COLORS[colorIdx]);

  var from = pt.from || pt;
  var dx = pt.x - from.x, dy = pt.y - from.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > 10) {                       // 병 입구에서 목표까지 이어지는 물줄기
    wrap.style.left = from.x + 'px';
    wrap.style.top = from.y + 'px';
    wrap.style.transform = 'rotate(' + (Math.atan2(-dx, dy) * 180 / Math.PI).toFixed(1) + 'deg)';
    s.style.height = dist.toFixed(1) + 'px';
  } else {
    wrap.style.left = pt.x + 'px';
    wrap.style.top = pt.y + 'px';
  }
  wrap.appendChild(s);
  streamLayer.appendChild(wrap);

  var ring = document.createElement('div');
  ring.className = 'splash';
  ring.style.left = pt.x + 'px';
  ring.style.top = (pt.y + 12) + 'px';
  streamLayer.appendChild(ring);

  setTimeout(function () {
    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    if (ring.parentNode) ring.parentNode.removeChild(ring);
  }, 260);
}

/* =====================================================================
   붓기 연출 — 논리와 완전히 분리된 논블로킹 애니메이션
   한 병의 연출은 독립적으로 진행/갱신되고, 입력은 절대 기다리지 않는다.
   ===================================================================== */
var POUR_TILT = 70;      // 기울기까지
var POUR_HOLD = 75;      // 기운 채로 붓는 시간
var POUR_BACK = 75;      // 제자리로
var POUR_TOTAL = POUR_TILT + POUR_HOLD + POUR_BACK;   // 약 220ms

function cancelPourAnim(b) {
  if (!b) return;
  if (b.animT1) { clearTimeout(b.animT1); b.animT1 = 0; }
  if (b.animT2) { clearTimeout(b.animT2); b.animT2 = 0; }
  if (b.el) {
    b.el.classList.remove('pouring', 'return');
    b.el.style.transform = '';
  }
}

function cancelAllPourAnims() {
  game.bottles.forEach(cancelPourAnim);
  streamLayer.innerHTML = '';
}

function animatePour(from, to, color) {
  var el = from.el;
  if (!el || !to.el || !el.isConnected) return;
  var gen = game.gen;

  /* 같은 병이 연달아 붓는다면 새 목표로 바로 재조준 (되돌아갔다 다시 기울지 않음) */
  if (from.animT1) { clearTimeout(from.animT1); from.animT1 = 0; }
  if (from.animT2) { clearTimeout(from.animT2); from.animT2 = 0; }

  var pt = tiltTowards(el, to.el);
  showStream(pt, color);

  from.animT1 = setTimeout(function () {
    from.animT1 = 0;
    if (game.gen !== gen || !el.isConnected) return;
    untilt(el);
  }, POUR_TILT + POUR_HOLD);

  from.animT2 = setTimeout(function () {
    from.animT2 = 0;
    if (game.gen !== gen || !el.isConnected) return;
    el.classList.remove('return');
  }, POUR_TOTAL + 40);
}

/* 한 수 붓기: 논리 상태는 이 함수 안에서 '즉시' 확정된다 (기다림 없음) */
function doPour(fromId, toId, amount) {
  var from = game.bottles[fromId], to = game.bottles[toId];
  if (!from || !to || amount <= 0) return;
  var color = from.cells[from.cells.length - 1];

  game.history.push(game.bottles.map(function (b) { return b.cells.slice(); }));
  if (game.history.length > 250) game.history.shift();

  for (var i = 0; i < amount; i++) { from.cells.pop(); to.cells.push(color); }
  game.moves++;

  syncBottle(from, true);
  syncBottle(to, true);
  updateHud();
  Sound.pour();
  animatePour(from, to, color);

  if (isComplete(to)) setTimeout(function () { Sound.done(); }, 150);

  if (isWin(game.bottles)) { onWin(); return; }
  if (isComplete(to)) {
    setStatus(to.tall ? '가운데 병에 ' + COLOR_NAMES[to.goal] + ' ' + to.cap + '칸을 다 모았어요!'
                      : '한 병 완성 — 뚜껑을 닫았어요');
  } else if (to.tall) {
    setStatus('가운데 병에 ' + COLOR_NAMES[to.goal] + ' ' + to.cells.length + '/' + to.cap + '칸 — ' +
              (to.cap - to.cells.length) + '칸 남았어요');
  }
}

function onBottleClick(id) {
  if (game.won) return;
  Sound.unlock();

  var b = game.bottles[id];
  if (!b) return;
  if (isComplete(b)) return;            // 완성된 병은 뚜껑이 닫혀 잠김 — 선택 불가

  // 아무것도 안 고른 상태
  if (game.selected === null) {
    if (!b.cells.length) { Sound.fail(); shakeEl(b.el); setStatus('빈 병은 고를 수 없어요'); return; }
    selectBottle(id);
    return;
  }

  // 같은 병 다시 누르면 취소
  if (game.selected === id) { clearSelected(); return; }

  var from = game.bottles[game.selected];
  var amount = pourAmount(from, b);

  if (amount > 0) {
    var fromId = game.selected;
    clearSelected();
    doPour(fromId, id, amount);     // 즉시 확정 — 연출이 끝나기를 기다리지 않음
    return;
  }

  // 못 부으면: 새 병을 선택하거나 해제
  clearSelected();
  Sound.fail();
  shakeEl(b.el);
  if (b.cells.length >= b.cap) setStatus('병이 가득 찼어요');
  else if (b.goal !== null && b.goal !== undefined) setStatus('가운데 긴 병에는 ' + COLOR_NAMES[b.goal] + '만 부을 수 있어요');
  else setStatus('맨 위 색이 같아야 부을 수 있어요');

  if (b.cells.length) selectBottle(id);
}

function undo() {
  if (!game.history.length) return;
  game.gen++;                        // 진행 중인 붓기 연출·클리어 예약을 모두 무효화
  cancelAllPourAnims();
  if (game.won) { game.won = false; overlay.classList.add('hidden'); }

  var snap = game.history.pop();
  game.bottles.forEach(function (b, i) { b.cells = snap[i].slice(); });
  game.moves = Math.max(0, game.moves - 1);
  clearSelected();
  renderAll(false);
  updateHud();
  Sound.pick();
  setStatus('한 수 되돌렸어요');
}

function onWin() {
  game.won = true;
  clearSelected();
  Sound.win();

  var gen = game.gen;
  var next = game.level + 1;
  store('wsp.level', String(next));
  store('wsp.seed', String(Math.floor(Math.random() * 1e9)));

  setTimeout(function () {
    if (game.gen !== gen || !game.won) return;      // 그 사이 되돌리기/새 판으로 무효화됨
    elClearSub.textContent = '레벨 ' + game.level + ' · ' + game.moves + '번 만에 완성';
    overlay.classList.remove('hidden');
    spawnConfetti();
  }, 330);
}

function spawnConfetti() {
  confettiEl.innerHTML = '';
  for (var i = 0; i < 36; i++) {
    var p = document.createElement('i');
    p.style.left = (4 + Math.random() * 92) + '%';
    p.style.background = COLORS[i % COLORS.length];
    p.style.width = p.style.height = (5 + Math.random() * 8).toFixed(0) + 'px';
    p.style.opacity = (0.65 + Math.random() * 0.35).toFixed(2);
    p.style.animationDuration = (1.9 + Math.random() * 1.6).toFixed(2) + 's';
    p.style.animationDelay = (Math.random() * 0.7).toFixed(2) + 's';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confettiEl.appendChild(p);
  }
}

function startLevel(level, seed) {
  game.gen++;                       // 이전 판의 붓기 연출·클리어 예약 모두 무효화
  cancelAllPourAnims();

  game.level = Math.max(1, level | 0);
  game.seed = (seed >>> 0) || 1;

  var gen = generateLevel(game.level, game.seed);
  gen.bottles.forEach(function (b, i) { b.id = i; });

  game.cfg = gen.cfg;
  game.goal = gen.goal;
  game.bottles = gen.bottles;
  game.tiers = gen.cfg.tiers;
  game.moves = 0;
  game.history = [];
  game.selected = null;
  game.won = false;

  buildLayout();
  fitStage();
  renderAll(false);
  updateHud();
  overlay.classList.add('hidden');

  store('wsp.level', String(game.level));
  store('wsp.seed', String(game.seed));

  var goalBottle = null;
  game.bottles.forEach(function (b) { if (b.tall) goalBottle = b; });
  setStatus(goalBottle
    ? '가운데 병에 ' + COLOR_NAMES[goalBottle.goal] + ' ' + goalBottle.cap + '칸을 모으면 클리어'
    : '병을 눌러 고른 뒤, 다른 병을 눌러 부으세요');

  window.scrollTo(0, 0);
}

/* =====================================================================
   5. 이벤트 연결 & 시작
   ===================================================================== */
/* 화면 좌표 → 그 자리에 '원래' 있는 병 (붓느라 기울어 자리를 벗어나도 놓치지 않게) */
function bottleAtPoint(x, y) {
  for (var i = 0; i < game.bottles.length; i++) {
    var b = game.bottles[i];
    if (!b.el || !b.el.isConnected) continue;
    var r = b.restRect || (b.restRect = restRect(b.el));
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
  }
  return -1;
}

stageEl.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('.bottle') : null;
  var id = el ? Number(el.dataset.id) : -1;

  /* 제자리에 있는 병을 눌렀다면 그대로 */
  if (id >= 0) {
    var tb = game.bottles[id];
    if (tb && tb.el && !tb.el.classList.contains('pouring') && !tb.el.classList.contains('return')) {
      onBottleClick(id);
      return;
    }
  }
  /* 기울어 날아온 병이 다른 병 자리를 덮고 있어도, 누른 자리의 주인으로 처리 */
  var slotId = bottleAtPoint(ev.clientX, ev.clientY);
  if (slotId >= 0) { onBottleClick(slotId); return; }
  if (id >= 0) onBottleClick(id);
});

$('#btnUndo').addEventListener('click', undo);

$('#btnRestart').addEventListener('click', function () {
  startLevel(game.level, game.seed);
  Sound.pick();
  setStatus('같은 판을 처음부터 다시 시작해요');
});

$('#btnNew').addEventListener('click', function () {
  startLevel(game.level, Math.floor(Math.random() * 1e9) + 1);
  Sound.pick();
  setStatus('새 판을 섞었어요');
});

$('#btnNext').addEventListener('click', function () {
  overlay.classList.add('hidden');
  startLevel(game.level + 1, Math.floor(Math.random() * 1e9) + 1);
  Sound.pick();
});

btnSound.addEventListener('click', function () {
  var muted = Sound.toggle();
  btnSound.classList.toggle('muted', muted);
  btnSound.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
  store('wsp.muted', muted ? '1' : '0');
});

document.addEventListener('visibilitychange', function () {
  if (!document.hidden) Sound.unlock();
});

var resizeTimer = 0;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { fitStage(); }, 120);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
/* iOS Safari 는 스크롤·툴바 접힘에 따라 visualViewport 가 따로 변한다 */
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize);
  window.visualViewport.addEventListener('scroll', onResize);
}

(function init() {
  btnSound.classList.toggle('muted', Sound.isMuted());

  var savedLevel = parseInt(store('wsp.level') || '1', 10);
  if (!isFinite(savedLevel) || savedLevel < 1) savedLevel = 1;
  var savedSeed = parseInt(store('wsp.seed') || '0', 10);
  if (!isFinite(savedSeed) || savedSeed <= 0) savedSeed = Math.floor(Math.random() * 1e9) + 1;

  startLevel(savedLevel, savedSeed);
})();

/* ---- 개발/검증용 디버그 훅 (화면에는 영향 없음) ---- */
window.__wsp = {
  go: function (level, seed) { startLevel(level, seed || Math.floor(Math.random() * 1e9) + 1); },
  state: function () {
    return {
      level: game.level, seed: game.seed, moves: game.moves, won: game.won,
      pouring: game.bottles.filter(function (b) { return !!b.animT1 || !!b.animT2; }).length,
      tilted: game.bottles.filter(function (b) { return b.el && (b.el.classList.contains('pouring') || b.el.classList.contains('return')); }).length,
      goal: game.goal,
      bottles: game.bottles.map(function (b) { return { id: b.id, cells: b.cells.slice(), cap: b.cap, tall: b.tall, goal: b.goal, done: isComplete(b) }; }),
      win: isWin(game.bottles)
    };
  },
  /* 생성기 전수 검증: 모든 레벨/시드의 판이 '실제 규칙'으로 풀리는지 확인 */
  selfTest: function (levels, seeds) {
    levels = levels || 12; seeds = seeds || 30;
    var report = [], allOk = true, minSteps = Infinity, maxSteps = 0, sumSteps = 0;
    var fails = [], cases = 0, sumMixed = 0, sumDone = 0, slowestMs = 0, sumMs = 0;
    var levelSpec = [];
    for (var L = 1; L <= levels; L++) {
      var cfgL = levelConfig(L);
      var spec = { level: L, normal: cfgL.normalBottles, tall: cfgL.tallCap, colors: cfgL.colors,
                   tiers: cfgL.tiers, units: cfgL.units };
      if (L <= 4 || L === 5 || L === 9 || L === 10 || L === 19 || L === 20 || L === 36 || L === levels) levelSpec.push(spec);
      for (var s = 1; s <= seeds; s++) {
        var seed = s * 7919 + L * 104729;
        var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
        var g = generateLevel(L, seed);
        var ms = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
        if (ms > slowestMs) slowestMs = ms;
        sumMs += ms;
        cases++;
        if (!g) { allOk = false; if (fails.length < 8) fails.push({ level: L, seed: seed, null: true }); continue; }

        var signs = g.bottles.map(function (b) { return { cells: b.cells.slice(), cap: b.cap, tall: b.tall, goal: b.goal, levelGoal: b.levelGoal }; });
        var alreadyWon = isWin(signs);

        /* 1) 병 구성: 일반 병 수, 긴 병 용량, 색별 칸 수 */
        var tallStart = -1, emptyBottles = 0, goalCells = 0, normals = 0, i2, j2;
        var perColor = {};
        for (i2 = 0; i2 < signs.length; i2++) {
          var b2 = signs[i2];
          if (b2.tall) { tallStart = b2.cells.length; continue; }
          normals++;
          if (!b2.cells.length) emptyBottles++;
          for (j2 = 0; j2 < b2.cells.length; j2++) {
            var col = b2.cells[j2];
            perColor[col] = (perColor[col] || 0) + 1;
            if (col === g.goal) goalCells++;
          }
        }
        var emptyOk = !g.cfg.tall || emptyBottles === 0;          // 3레벨부터 시작 시 빈 일반 병 0개
        var symOk = normals % 2 === 0 && normals === g.cfg.normalBottles;  // 좌우 같은 병 수
        var shapeOk = normals === g.cfg.normalBottles &&
                      (!g.cfg.tall || (tallStart === 0 && goalCells === g.cfg.tallCap)) &&
                      (!g.cfg.tall || signs.length === g.cfg.normalBottles + 1);
        if (!g.cfg.tall) shapeOk = normals === g.cfg.normalBottles && !alreadyWon;

        /* 2) 색별 칸 수가 counts×4 와 정확히 맞는가 */
        var colorOk = true, ci, copiesCheck = {};
        for (i2 = 0; i2 < signs.length; i2++) if (!signs[i2].tall) {
          var top = signs[i2].cells[0];
          if (top === undefined) continue;
          copiesCheck[top] = (copiesCheck[top] || 0) + 1;
        }
        for (ci = 0; ci < g.cfg.colors; ci++) {
          var n = perColor[ci] || 0;
          if (ci === g.goal) { if (n !== g.cfg.tallCap) colorOk = false; }
          else if (n % 4 !== 0 || n < 4) colorOk = false;
        }

        /* 3) 역재생: 실제 규칙으로 풀리는가 */
        var replayOk = true, steps = 0, lockViolation = false;
        for (var i = g.moves.length - 1; i >= 0; i--) {
          var mv = g.moves[i];
          if (isComplete(signs[mv[1]])) lockViolation = true;      // 정방향 출발 병이 뚜껑 닫힘?
          var amt = applyPour(signs, mv[1], mv[0]);                // 역연산이므로 정방향은 A→B
          if (amt !== mv[2]) { replayOk = false; break; }
          steps++;
        }
        var solved = isWin(signs);

        /* 4) 푼 뒤 모습: 긴 병은 목표 색 가득, 일반 병은 4칸 완성 또는 빈 병 */
        var goalOk = true;
        if (g.cfg.tall) {
          var tallB = null;
          for (i2 = 0; i2 < signs.length; i2++) if (signs[i2].tall) tallB = signs[i2];
          goalOk = !!tallB && tallB.cells.length === g.cfg.tallCap;
          if (goalOk) for (i2 = 0; i2 < tallB.cells.length; i2++) if (tallB.cells[i2] !== g.goal) goalOk = false;
        }
        for (i2 = 0; i2 < signs.length; i2++) {
          var bb = signs[i2];
          if (!bb.cells.length) continue;
          if (bb.cells.length !== bb.cap) goalOk = false;
        }

        var ok = replayOk && solved && !alreadyWon && !lockViolation && goalOk && shapeOk && colorOk && emptyOk && symOk;
        if (!ok) {
          allOk = false;
          if (fails.length < 8) fails.push({ level: L, seed: seed, replay: replayOk, solved: solved,
            won: alreadyWon, lock: lockViolation, goal: goalOk, shape: shapeOk, color: colorOk,
            empty: emptyOk, sym: symOk, empties: emptyBottles,
            normals: normals, tallStart: tallStart, goalCells: goalCells });
        }
        if (steps < minSteps) minSteps = steps;
        if (steps > maxSteps) maxSteps = steps;
        sumSteps += steps;
        sumMixed += g.mixed;
        sumDone += g.done;
        if (L <= 2 && s <= 2) {
          report.push({ level: L, seed: seed, bottles: g.bottles.length, colors: g.cfg.colors, tall: g.cfg.tall,
                        goal: g.goal, tallStart: tallStart, empty: emptyBottles, scramble: g.moves.length, replay: steps, ok: ok });
        }
      }
    }
    function avg(a) { var t = 0, i; for (i = 0; i < a.length; i++) t += a[i]; return a.length ? t / a.length : 0; }
    return { allOk: allOk, minSteps: minSteps, maxSteps: maxSteps, avgSteps: cases ? sumSteps / cases : 0,
             fails: fails, samples: report, levelSpec: levelSpec,
             avgMixed: cases ? sumMixed / cases : 0, avgDone: cases ? sumDone / cases : 0,
             avgMs: cases ? sumMs / cases : 0, slowestMs: slowestMs, cases: cases,
             lastEmpties: emptyBottles };
  }
};
</script>
